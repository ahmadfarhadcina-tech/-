<!DOCTYPE html>
<html lang="en" dir="ltr" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Profile Settings</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--primary:#7c3aed;--primary-dark:#6d28d9;--bg:#0f172a;--card:#1e293b;--text:#f8fafc;--muted:#94a3b8;--border:#334155;--radius:16px;}
*{box-sizing:border-box;margin:0;padding:0;font-family:Tahoma,sans-serif;}
body{background:var(--bg);color:var(--text);min-height:100vh;padding:20px;}
.app{max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:25px;}
h2{font-size:18px;color:var(--primary);margin-bottom:20px;}
.group{margin-bottom:18px;}
.group label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px;}
input, .custom-select{width:100%;padding:14px 16px;background:#0f172a;border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:14px;outline:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
button{cursor:pointer;border:0;padding:14px 20px;border-radius:var(--radius);font-size:15px;font-weight:600;width:100%;margin-top:10px;}
.primary{background:var(--primary);color:white;}
.secondary{background:transparent;color:var(--muted);}
.profile-preview{width:85px;height:85px;border-radius:50%;background:var(--primary);margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:32px;overflow:hidden;border:2px solid var(--border);}
.upload{width:auto!important;padding:6px 14px!important;font-size:12px!important;background:#3b82f6;color:#fff;}
</style>
</head>
<body>
<div class="app">
<h2>Profile Settings</h2>
<div style="text-align:center;margin-bottom:20px">
<div id="profile-preview" class="profile-preview">U</div>
<input type="file" id="avatar-input" accept="image/*" style="display:none" onchange="handleImageUpload(event)">
<button class="upload" onclick="document.getElementById('avatar-input').click()">📷 Upload Photo</button>
</div>
<div class="group"><label>Full Name / Username</label><input id="profile-name" placeholder="Enter your name"></div>
<div class="group"><label>Phone Number</label><input id="profile-phone" placeholder="+93 700 000 000"></div>
<button class="primary" onclick="saveProfileSettings()">Save Profile</button>
<button class="secondary" onclick="window.location.href='transactions.html'">Back to Transactions</button>
</div>
<script>
const SUPABASE_URL = 'https://hvsymjkbmpmvjycwenbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_9pkhkb88LNXJw457Sx8dpA_0E231JwH';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let currentUser = null, userProfile = { name:'', phone:'', location:'Jawzjan', avatar:'', themeColor:'#7c3aed', language:'en' };

async function loadProfile(){
 const {data:{session}} = await supabaseClient.auth.getSession();
 if(!session){ window.location.href='index.html'; return; }
 currentUser = session.user;
 const {data} = await supabaseClient.from('exchange_users').select('*').eq('user_id', currentUser.id).maybeSingle();
 if(data && data.profile){
  userProfile = data.profile;
  document.getElementById('profile-name').value = userProfile.name || '';
  document.getElementById('profile-phone').value = userProfile.phone || '';
  if(userProfile.avatar){
   document.getElementById('profile-preview').innerHTML = `<img src="${userProfile.avatar}" style="width:100%;height:100%;object-fit:cover">`;
  }
 }
}

async function handleImageUpload(event){
 const file = event.target.files?.[0];
 if(!file || !currentUser) return;
 const path = `${currentUser.id}/avatar.jpg`;
 await supabaseClient.storage.from('user-uploads').upload(path, file, {upsert:true});
 const {data} = supabaseClient.storage.from('user-uploads').getPublicUrl(path);
 userProfile.avatar = data.publicUrl + '?v=' + Date.now();
 document.getElementById('profile-preview').innerHTML = `<img src="${userProfile.avatar}" style="width:100%;height:100%;object-fit:cover">`;
}

async function saveProfileSettings(){
 userProfile.name = document.getElementById('profile-name').value.trim();
 userProfile.phone = document.getElementById('profile-phone').value.trim();
 await supabaseClient.from('exchange_users').upsert({ user_id: currentUser.id, email: currentUser.email, profile: userProfile }, { onConflict: 'user_id' });
 window.location.href = 'transactions.html';
}

window.addEventListener('DOMContentLoaded', loadProfile);
</script>
</body>
</html>
