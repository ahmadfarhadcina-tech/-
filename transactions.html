<!DOCTYPE html>
<html lang="fa" dir="rtl" id="html-root">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Daily Accounting - Transactions</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
    --primary:#7c3aed;
    --primary-dark:#6d28d9;
    --bg:#0b1120;
    --card:#111827;
    --card2:#172033;
    --text:#f8fafc;
    --muted:#94a3b8;
    --border:#293548;
    --green:#10b981;
    --red:#ef4444;
    --blue:#3b82f6;
    --orange:#f59e0b;
    --radius:18px;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Tahoma,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    background:
        radial-gradient(circle at top right,#25145f 0%,transparent 35%),
        radial-gradient(circle at bottom left,#082f49 0%,transparent 35%),
        var(--bg);
    color:var(--text);
    min-height:100vh;
}

button,
input,
select{
    font-family:inherit;
}

button{
    border:0;
    cursor:pointer;
}

button:active{
    transform:scale(.94);
}

.app{
    width:100%;
    max-width:1100px;
    min-height:100vh;
    margin:auto;
    background:rgba(17,24,39,.94);
    display:flex;
    flex-direction:column;
}

/* ================= HEADER ================= */

header{
    position:sticky;
    top:0;
    z-index:100;
    padding:13px 16px;
    background:rgba(15,23,42,.94);
    backdrop-filter:blur(18px);
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.header-title{
    display:flex;
    align-items:center;
    gap:9px;
}

.header-icon{
    width:38px;
    height:38px;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,var(--primary),#4f46e5);
    box-shadow:0 8px 25px #7c3aed45;
    font-size:19px;
}

header h1{
    font-size:16px;
    color:#fff;
}

header small{
    display:block;
    color:var(--muted);
    font-size:9px;
    margin-top:3px;
}

.header-actions{
    display:flex;
    gap:6px;
}

/* ================= BUTTONS ================= */

.btn{
    padding:9px 12px;
    border-radius:11px;
    color:#fff;
    font-size:11px;
    transition:.2s;
}

.btn-primary{
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    box-shadow:0 5px 18px #7c3aed35;
}

.btn-blue{
    background:var(--blue);
}

.btn-red{
    background:var(--red);
}

.btn-green{
    background:var(--green);
}

.btn-dark{
    background:#1e293b;
    border:1px solid var(--border);
}

.btn:active{
    transform:scale(.93);
}

/* ================= PAGE ================= */

.page{
    padding:16px;
    flex:1;
    padding-bottom:100px;
}

.top-summary{
    background:
        linear-gradient(135deg,#1e1b4b,#111827);
    border:1px solid #4937a3;
    border-radius:22px;
    padding:18px;
    margin-bottom:16px;
    box-shadow:0 12px 35px #0003;
}

.summary-title{
    color:#c4b5fd;
    font-size:12px;
    margin-bottom:7px;
}

.summary-value{
    font-size:25px;
    font-weight:bold;
}

.summary-sub{
    color:var(--muted);
    font-size:10px;
    margin-top:7px;
}

/* ================= CLIENT CARD ================= */

.client-card{
    background:linear-gradient(145deg,#151f31,#0f172a);
    border:1px solid var(--border);
    border-radius:20px;
    margin-bottom:15px;
    overflow:hidden;
    box-shadow:0 8px 30px #0002;
    animation:cardIn .35s ease both;
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:translateY(12px) scale(.98);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.client-head{
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    border-bottom:1px solid var(--border);
}

.client-info{
    display:flex;
    align-items:center;
    gap:11px;
}

.client-avatar{
    width:43px;
    height:43px;
    border-radius:14px;
    background:linear-gradient(135deg,var(--primary),#4f46e5);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:17px;
    box-shadow:0 5px 18px #7c3aed30;
}

.client-name{
    font-size:15px;
    font-weight:bold;
}

.client-count{
    font-size:9px;
    color:var(--muted);
    margin-top:4px;
}

.client-actions{
    display:flex;
    gap:5px;
}

.icon-btn{
    width:34px;
    height:34px;
    border-radius:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#fff;
    background:#1e293b;
    border:1px solid var(--border);
    transition:.2s;
}

.icon-btn:active{
    transform:scale(.88) rotate(-5deg);
}

/* ================= BALANCE ================= */

.balance-box{
    margin:12px;
    padding:13px;
    border-radius:15px;
    background:#0b1220;
    border:1px solid var(--border);
}

.balance-title{
    color:var(--muted);
    font-size:10px;
    margin-bottom:7px;
}

.balance-value{
    font-size:16px;
    font-weight:bold;
}

.balance-green{
    color:var(--green);
}

.balance-red{
    color:var(--red);
}

.balance-neutral{
    color:#38bdf8;
}

.balance-note{
    font-size:9px;
    color:var(--muted);
    margin-top:5px;
}

/* ================= TRANSACTIONS ================= */

.transactions{
    padding:0 12px 12px;
}

.transaction{
    background:#172033;
    border:1px solid var(--border);
    border-radius:15px;
    padding:13px;
    margin-top:9px;
    animation:transactionIn .3s ease both;
}

@keyframes transactionIn{
    from{
        opacity:0;
        transform:translateX(15px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.transaction-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
}

.transaction-currency{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:13px;
    font-weight:bold;
}

.currency-icon{
    width:30px;
    height:30px;
    border-radius:9px;
    background:#243047;
    display:flex;
    align-items:center;
    justify-content:center;
}

.transaction-type{
    font-size:9px;
    padding:5px 8px;
    border-radius:8px;
}

.type-in{
    color:#6ee7b7;
    background:#064e3b;
}

.type-out{
    color:#fca5a5;
    background:#450a0a;
}

.transaction-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:12px;
}

.transaction-item{
    background:#111827;
    border-radius:10px;
    padding:8px;
}

.transaction-item small{
    display:block;
    color:var(--muted);
    font-size:8px;
    margin-bottom:4px;
}

.transaction-item strong{
    font-size:11px;
}

.transaction-total{
    margin-top:9px;
    background:#0b1220;
    padding:10px;
    border-radius:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.transaction-total span{
    color:var(--muted);
    font-size:9px;
}

.transaction-total strong{
    color:#c4b5fd;
    font-size:13px;
}

.transaction-date{
    margin-top:9px;
    color:var(--muted);
    font-size:9px;
    line-height:1.8;
}

.transaction-actions{
    display:flex;
    gap:6px;
    margin-top:10px;
}

.transaction-actions button{
    flex:1;
    padding:7px;
    border-radius:9px;
    color:#fff;
    font-size:9px;
}

/* ================= EMPTY ================= */

.empty{
    text-align:center;
    padding:55px 20px;
    color:var(--muted);
}

.empty-icon{
    width:70px;
    height:70px;
    margin:0 auto 15px;
    border-radius:22px;
    background:#172033;
    border:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
}

/* ================= FAB ================= */

.fab{
    position:fixed;
    right:24px;
    bottom:25px;
    width:61px;
    height:61px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--primary),#4f46e5);
    color:#fff;
    font-size:29px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 12px 35px #0008;
    z-index:90;
    transition:.25s;
}

.fab:hover{
    transform:scale(1.07) rotate(5deg);
}

.fab:active{
    transform:scale(.88) rotate(-10deg);
}

/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;
    background:#0009;
    backdrop-filter:blur(8px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
    z-index:500;
}

.modal.show{
    display:flex;
    animation:fadeIn .2s ease;
}

@keyframes fadeIn{
    from{opacity:0}
    to{opacity:1}
}

.modal-card{
    width:100%;
    max-width:520px;
    max-height:90vh;
    overflow-y:auto;
    background:linear-gradient(145deg,#1b263a,#0f172a);
    border:1px solid #394761;
    border-radius:24px;
    box-shadow:0 25px 80px #000b;
    animation:modalIn .3s cubic-bezier(.2,.8,.2,1);
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:translateY(30px) scale(.92);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.modal-head{
    padding:17px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    background:#151e30ee;
    backdrop-filter:blur(12px);
    z-index:2;
}

.modal-head h2{
    font-size:15px;
}

.close{
    width:34px;
    height:34px;
    border-radius:10px;
    background:#1e293b;
    color:#fff;
    font-size:18px;
}

.modal-body{
    padding:17px;
}

.form-group{
    margin-bottom:14px;
}

.form-group label{
    display:block;
    color:var(--muted);
    font-size:10px;
    margin-bottom:7px;
}

input,
select{
    width:100%;
    padding:13px 14px;
    border-radius:13px;
    border:1px solid var(--border);
    outline:none;
    background:#0b1220;
    color:#fff;
    font-size:12px;
    transition:.2s;
}

input:focus,
select:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 3px #7c3aed25;
}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.direction{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.direction button{
    padding:13px 8px;
    border-radius:12px;
    background:#0b1220;
    color:var(--muted);
    border:1px solid var(--border);
    transition:.2s;
}

.direction button.active.in{
    background:#064e3b;
    border-color:var(--green);
    color:#6ee7b7;
}

.direction button.active.out{
    background:#450a0a;
    border-color:var(--red);
    color:#fca5a5;
}

.calculation{
    background:linear-gradient(135deg,#1e1b4b,#111827);
    border:1px solid #4937a3;
    padding:14px;
    border-radius:15px;
    margin:15px 0;
}

.calc-row{
    display:flex;
    justify-content:space-between;
    margin:6px 0;
    font-size:11px;
}

.calc-row span{
    color:var(--muted);
}

.calc-total{
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid #ffffff18;
    font-size:16px;
    font-weight:bold;
    color:#c4b5fd;
}

.save-btn{
    width:100%;
    padding:14px;
    border-radius:14px;
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    color:#fff;
    font-weight:bold;
    font-size:13px;
    box-shadow:0 7px 22px #7c3aed40;
}

.save-btn:disabled{
    opacity:.5;
}

/* ================= CLIENT SELECT ================= */

.client-list{
    display:grid;
    gap:9px;
}

.client-select{
    width:100%;
    padding:13px;
    background:#111827;
    border:1px solid var(--border);
    color:#fff;
    border-radius:13px;
    text-align:right;
    display:flex;
    align-items:center;
    gap:10px;
    transition:.2s;
}

.client-select:hover{
    border-color:var(--primary);
    transform:translateY(-1px);
}

.client-select-avatar{
    width:35px;
    height:35px;
    border-radius:10px;
    background:var(--primary);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-shrink:0;
}

.client-select-info strong{
    display:block;
    font-size:12px;
}

.client-select-info small{
    color:var(--muted);
    font-size:8px;
}

/* ================= TOAST ================= */

#toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%) translateY(20px);
    background:#111827;
    border:1px solid var(--border);
    color:#fff;
    padding:12px 17px;
    border-radius:13px;
    display:none;
    z-index:2000;
    font-size:11px;
    max-width:90%;
    text-align:center;
    box-shadow:0 12px 35px #0008;
}

#toast.show{
    display:block;
    animation:toastIn .3s ease forwards;
}

@keyframes toastIn{
    from{
        opacity:0;
        transform:translateX(-50%) translateY(20px);
    }
    to{
        opacity:1;
        transform:translateX(-50%) translateY(0);
    }
}

/* ================= RESPONSIVE ================= */

@media(max-width:600px){

    header{
        padding:11px;
    }

    header h1{
        font-size:13px;
    }

    .header-icon{
        width:34px;
        height:34px;
        font-size:16px;
    }

    .page{
        padding:12px;
    }

    .form-row{
        grid-template-columns:1fr 1fr;
    }

    .fab{
        right:18px;
        bottom:18px;
    }
}
</style>
</head>

<body>

<div class="app">

<header>

    <div class="header-title">
        <div class="header-icon">💱</div>

        <div>
            <h1>معاملات</h1>
            <small>Daily Accounting</small>
        </div>
    </div>

    <div class="header-actions">

        <button class="btn btn-dark"
                onclick="goHome()">
            🏠
        </button>

        <button class="btn btn-dark"
                onclick="window.location.href='profile.html'">
            👤
        </button>

        <button class="btn btn-red"
                onclick="logoutUser()">
            خروج
        </button>

    </div>

</header>


<main class="page">

    <div class="top-summary">

        <div class="summary-title">
            مجموع کل معاملات
        </div>

        <div class="summary-value"
             id="grand-total">
            ۰ افغانی
        </div>

        <div class="summary-sub"
             id="grand-count">
            ۰ معامله ثبت شده
        </div>

    </div>


    <div id="accounts-list"></div>

</main>


<button class="fab"
        onclick="openClientSelector()">
    +
</button>

</div>


<!-- ================= TRANSACTION MODAL ================= -->

<div class="modal"
     id="transaction-modal">

    <div class="modal-card">

        <div class="modal-head">

            <h2 id="transaction-modal-title">
                ثبت معامله جدید
            </h2>

            <button class="close"
                    onclick="closeModal('transaction-modal')">
                ×
            </button>

        </div>

        <div class="modal-body">

            <div class="form-group">

                <label>
                    مشتری
                </label>

                <input id="selected-client-name"
                       readonly>

                <input type="hidden"
                       id="selected-client-id">

            </div>


            <div class="form-group">

                <label>
                    نوع معامله
                </label>

                <div class="direction">

                    <button id="direction-in"
                            class="active in"
                            onclick="setDirection('in')">
                        ↓ مشتری به من می‌دهد
                    </button>

                    <button id="direction-out"
                            onclick="setDirection('out')">
                        ↑ من به مشتری می‌دهم
                    </button>

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>
                        اسعار
                    </label>

                    <select id="currency"
                            onchange="calculateTransaction()">

                        <option value="USD">
                            🇺🇸 دالر آمریکا (USD)
                        </option>

                        <option value="EUR">
                            🇪🇺 یورو (EUR)
                        </option>

                        <option value="AFN">
                            🇦🇫 افغانی (AFN)
                        </option>

                        <option value="IRR">
                            🇮🇷 ریال ایران (IRR)
                        </option>

                        <option value="TOMAN">
                            🇮🇷 تومان
                        </option>

                        <option value="JPY">
                            🇯🇵 ین جاپان (JPY)
                        </option>

                        <option value="TRY">
                            🇹🇷 لیره ترکیه (TRY)
                        </option>

                        <option value="SAR">
                            🇸🇦 ریال سعودی (SAR)
                        </option>

                        <option value="AED">
                            🇦🇪 درهم امارات (AED)
                        </option>

                        <option value="GBP">
                            🇬🇧 پوند انگلیس (GBP)
                        </option>

                        <option value="CAD">
                            🇨🇦 دالر کانادا (CAD)
                        </option>

                        <option value="AUD">
                            🇦🇺 دالر استرالیا (AUD)
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        مقدار اسعار
                    </label>

                    <input id="amount"
                           type="number"
                           step="any"
                           inputmode="decimal"
                           placeholder="مثلاً 100"
                           oninput="calculateTransaction()">

                </div>

            </div>


            <div class="form-group">

                <label>
                    نرخ هر واحد به افغانی
                </label>

                <input id="rate"
                       type="number"
                       step="any"
                       inputmode="decimal"
                       placeholder="مثلاً 70"
                       oninput="calculateTransaction()">

            </div>


            <div class="calculation">

                <div class="calc-row">

                    <span>
                        مقدار:
                    </span>

                    <strong id="calc-amount">
                        ۰
                    </strong>

                </div>


                <div class="calc-row">

                    <span>
                        نرخ:
                    </span>

                    <strong id="calc-rate">
                        ۰
                    </strong>

                </div>


                <div class="calc-row calc-total">

                    <span>
                        مجموع به افغانی:
                    </span>

                    <strong id="calc-total">
                        ۰ AFN
                    </strong>

                </div>

            </div>


            <div class="form-group">

                <label>
                    تاریخ معامله
                </label>

                <input id="transaction-date"
                       type="date">

            </div>


            <div class="form-group">

                <label>
                    توضیحات (اختیاری)
                </label>

                <input id="transaction-note"
                       type="text"
                       placeholder="مثلاً خرید دالر">

            </div>


            <button class="save-btn"
                    id="save-transaction-btn"
                    onclick="saveTransaction()">

                💾 ذخیره معامله

            </button>

        </div>

    </div>

</div>


<!-- ================= CLIENT SELECTOR ================= -->

<div class="modal"
     id="client-modal">

    <div class="modal-card">

        <div class="modal-head">

            <h2>
                انتخاب مشتری
            </h2>

            <button class="close"
                    onclick="closeModal('client-modal')">
                ×
            </button>

        </div>

        <div class="modal-body">

            <div id="client-list"
                 class="client-list">
            </div>

            <button class="btn btn-primary"
                    style="width:100%;margin-top:12px;padding:13px"
                    onclick="openAddClientFromTransaction()">

                ＋ افزودن مشتری جدید

            </button>

        </div>

    </div>

</div>


<!-- ================= ADD CLIENT MODAL ================= -->

<div class="modal"
     id="client-add-modal">

    <div class="modal-card">

        <div class="modal-head">

            <h2>
                افزودن مشتری
            </h2>

            <button class="close"
                    onclick="closeModal('client-add-modal')">
                ×
            </button>

        </div>

        <div class="modal-body">

            <div class="form-group">

                <label>
                    نام مشتری
                </label>

                <input id="new-client-name"
                       type="text"
                       placeholder="نام مشتری">

            </div>

            <button class="save-btn"
                    onclick="addClient()">

                👤 ایجاد مشتری

            </button>

        </div>

    </div>

</div>


<!-- ================= DELETE CONFIRM MODAL ================= -->

<div class="modal"
     id="confirm-modal">

    <div class="modal-card">

        <div class="modal-head">

            <h2>
                تأیید عملیات
            </h2>

/* =========================================================

function toast(message){

    const el =
        document.getElementById('toast');

    el.innerText = message;

    el.classList.remove('show');

    void el.offsetWidth;

    el.classList.add('show');

    clearTimeout(window.toastTimer);

    window.toastTimer =
        setTimeout(()=>{
            el.classList.remove('show');
        },3000);
}


/* =========================================================

========================================================= */

function openModal(id){

    const modal =
        document.getElementById(id);

    if(!modal) return;

    modal.classList.add('show');

    document.body.style.overflow =
        'hidden';
}


function closeModal(id){

    const modal =
        document.getElementById(id);

    if(!modal) return;

    modal.classList.remove('show');

    if(
        !document.querySelector('.modal.show')
    ){
        document.body.style.overflow =
            '';
    }
}

/* =========================================================
   FORMAT NUMBER
========================================================= */

function formatNumber(value){

    const number =
        Number(value) || 0;

    return new Intl.NumberFormat(
        'fa-AF',
        {
            maximumFractionDigits:2
        }
    ).format(number);
}


/* =========================================================
   CURRENCY NAME
========================================================= */

function currencyName(currency){

    const names = {

        USD:'دالر',

        EUR:'یورو',

        AFN:'افغانی',

        IRR:'ریال ایران',

        TOMAN:'تومان',

        JPY:'ین',

        TRY:'لیره',

        SAR:'ریال سعودی',

        AED:'درهم',

        GBP:'پوند',

        CAD:'دالر کانادا',

        AUD:'دالر استرالیا'

    };

    return names[currency] || currency;
}


/* =========================================================
   CURRENCY ICON
========================================================= */

function currencyIcon(currency){

    const icons = {

        USD:'🇺🇸',

        EUR:'🇪🇺',

        AFN:'🇦🇫',

        IRR:'🇮🇷',

        TOMAN:'🇮🇷',

        JPY:'🇯🇵',

        TRY:'🇹🇷',

        SAR:'🇸🇦',

        AED:'🇦🇪',

        GBP:'🇬🇧',

        CAD:'🇨🇦',

        AUD:'🇦🇺'

    };

    return icons[currency] || '💱';
}


/* =========================================================
   RENDER DASHBOARD
========================================================= */

function renderDashboard(){

    const box =
        document.getElementById(
            'accounts-list'
        );

    box.innerHTML = '';


    let grandTotal = 0;

    let grandCount = 0;


    if(
        !appData.clients ||
        !appData.clients.length
    ){

        box.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    💱
                </div>

                <div style="font-size:13px;color:#fff;margin-bottom:7px">
                    هنوز مشتری ثبت نشده
                </div>

                <div style="font-size:10px">
                    از دکمه + یک مشتری اضافه کنید.
                </div>

            </div>

        `;

        updateGrandTotal(
            0,
            0
        );

        return;
    }


    appData.clients.forEach(
        (client,index)=>{

            const transactions =
                Array.isArray(client.transactions)
                ? client.transactions
                : [];


            let balance = 0;


            transactions.forEach(
                transaction=>{

                    const total =
                        Number(
                            transaction.totalAFN ??
                            transaction.amountInBase ??
                            transaction.total ??
                            0
                        ) || 0;


                    /*
                       in:
                       مشتری به ما می‌دهد
                       پس مشتری بدهکار نیست؛
                       موجودی به نفع ما است.

                       out:
                       ما به مشتری می‌دهیم
                       پس ما به مشتری بدهکار می‌شویم.
                    */

                    if(
                        transaction.type === 'in' ||
                        transaction.direction === 'in' ||
                        transaction.type === 'receive'
                    ){

                        balance += total;

                    }else{

                        balance -= total;

                    }


                    grandTotal += total;

                    grandCount++;

                }
            );


            const initial =
                (client.name || 'م')
                .trim()
                .charAt(0)
                .toUpperCase();


            let balanceHTML = '';


            if(balance > 0){

                balanceHTML = `

                    <div class="balance-value balance-green">

                        ${formatNumber(balance)}
                        افغانی

                    </div>

                    <div class="balance-note">

                        💚 مشتری به شما باقی دارد

                    </div>

                `;

            }
            else if(balance < 0){

                balanceHTML = `

                    <div class="balance-value balance-red">

                        ${formatNumber(
                            Math.abs(balance)
                        )}
                        افغانی

                    </div>

                    <div class="balance-note">

                        🔴 شما به مشتری باقی دارید

                    </div>

                `;

            }
            else{

                balanceHTML = `

                    <div class="balance-value balance-neutral">

                        تسویه شده

                    </div>

                    <div class="balance-note">

                        ⚪ هیچ باقی نمانده

                    </div>

                `;
            }


            const transactionsHTML =
                transactions.length

                ?

                transactions
                .map(
                    (transaction,tIndex)=>
                        renderTransaction(
                            transaction,
                            client,
                            tIndex
                        )
                )
                .join('')

                :

                `

                    <div style="
                        text-align:center;
                        color:var(--muted);
                        font-size:10px;
                        padding:18px 5px;
                    ">

                        هنوز معامله‌ای ثبت نشده

                    </div>

                `;


            box.insertAdjacentHTML(
                'beforeend',
                `

                <div class="client-card"
                     style="animation-delay:${index*50}ms">

                    <div class="client-head">

                        <div class="client-info">

                            <div class="client-avatar">

                                ${escapeHTML(initial)}

                            </div>

                            <div>

                                <div class="client-name">

                                    ${escapeHTML(
                                        client.name || 'بدون نام'
                                    )}

                                </div>

                                <div class="client-count">

                                    ${formatNumber(
                                        transactions.length
                                    )}
                                    معامله

                                </div>

                            </div>

                        </div>


                        <div class="client-actions">

                            <button class="icon-btn"
                                    title="معامله جدید"
                                    onclick="openTransactionForClient('${client.id}')">

                                ＋

                            </button>


                            <button class="icon-btn"
                                    title="حذف مشتری"
                                    onclick="askDeleteClient('${client.id}')">

                                🗑️

                            </button>

                        </div>

                    </div>


                    <div class="balance-box">

                        <div class="balance-title">

                            وضعیت حساب

                        </div>

                        ${balanceHTML}

                    </div>


                    <div class="transactions">

                        ${transactionsHTML}

                    </div>

                </div>

                `
            );

        }
    );


    updateGrandTotal(
        grandTotal,
        grandCount
    );
}


/* =========================================================
   RENDER TRANSACTION
========================================================= */

function renderTransaction(
    transaction,
    client,
    index
){

    const amount =
        Number(
            transaction.rawAmount ??
            transaction.amount ??
            0
        ) || 0;


    const rate =
        Number(
            transaction.rate ??
            transaction.exchangeRate ??
            0
        ) || 0;


    const total =
        Number(
            transaction.totalAFN ??
            transaction.amountInBase ??
            transaction.total ??
            amount * rate
        ) || 0;


    const currency =
        transaction.currency ||
        'USD';


    const direction =
        transaction.type === 'out' ||
        transaction.direction === 'out'
        ? 'out'
        : 'in';


    const date =
        transaction.rawDate ||
        transaction.date ||
        transaction.transactionDate ||
        '';


    const note =
        transaction.note ||
        transaction.description ||
        '';


    return `

        <div class="transaction"
             style="animation-delay:${index*40}ms">

            <div class="transaction-top">

                <div class="transaction-currency">

                    <div class="currency-icon">

                        ${currencyIcon(currency)}

                    </div>

                    <span>

                        ${currencyName(currency)}

                    </span>

                </div>


                <div class="
                    transaction-type
                    ${direction === 'in'
                        ? 'type-in'
                        : 'type-out'}
                ">

                    ${direction === 'in'
                        ? '↓ دریافت'
                        : '↑ پرداخت'}

                </div>

            </div>


            <div class="transaction-grid">

                <div class="transaction-item">

                    <small>
                        مقدار اسعار
                    </small>

                    <strong>
                        ${formatNumber(amount)}
                        ${escapeHTML(currency)}
                    </strong>

                </div>


                <div class="transaction-item">

                    <small>
                        نرخ هر واحد
                    </small>

                    <strong>
                        ${formatNumber(rate)}
                        AFN
                    </strong>

                </div>

            </div>


            <div class="transaction-total">

                <span>
                    مجموع معامله
                </span>

                <strong>

                    ${formatNumber(total)}
                    AFN

                </strong>

            </div>


            ${
                date
                ?

                `

                <div class="transaction-date">

                    📅 تاریخ:

                    ${escapeHTML(
                        formatDateDisplay(date)
                    )}

                </div>

                `
                :
                ''
            }


            ${
                note
                ?

                `

                <div class="transaction-date">

                    📝 ${escapeHTML(note)}

                </div>

                `
                :
                ''
            }


            <div class="transaction-actions">

                <button
                    class="btn-blue"
                    onclick="editTransaction('${client.id}',${index})">

                    ✏️ ویرایش

                </button>


                <button
                    class="btn-red"
                    onclick="askDeleteTransaction('${client.id}',${index})">

                    🗑️ حذف

                </button>

            </div>

        </div>

    `;
}

========================================================= */

function setDirection(direction){

    currentDirection =
        direction;


    const inBtn =
        document.getElementById(
            'direction-in'
        );

    const outBtn =
        document.getElementById(
            'direction-out'
        );


    inBtn.classList.remove(
        'active'
    );

    outBtn.classList.remove(
        'active'
    );


    if(direction === 'in'){

        );

    }else{

        outBtn.classList.add(

/* =========================================================
   CALCULATE
========================================================= */

function calculateTransaction(){

    const amount =
        Number(
            document.getElementById(
                'amount'
            ).value
        ) || 0;


    const rate =
        Number(
            document.getElementById(
                'rate'
            ).value
        ) || 0;


    const total =
        amount * rate;


    document.getElementById(
        'calc-amount'
    ).innerText =
        formatNumber(amount);


    document.getElementById(
        'calc-rate'
    ).innerText =
        formatNumber(rate);


    document.getElementById(
        'calc-total'
    ).innerText =
        formatNumber(total) +
        ' AFN';
}


/* =========================================================
   SAVE TRANSACTION
========================================================= */

async function saveTransaction(){

    const clientId =
        document.getElementById(
            'selected-client-id'
        ).value;


    const client =
        appData.clients.find(
            c => String(c.id) === String(clientId)
        );


    if(!client){

        toast('مشتری انتخاب نشده');

        return;
    }


    const currency =
        document.getElementById(
            'currency'
        ).value;


    const amount =
        Number(
            document.getElementById(
                'amount'
            ).value
        );


    const rate =
        Number(
            document.getElementById(
                'rate'
            ).value
        );


    const date =
        document.getElementById(
            'transaction-date'
        ).value;


    const note =
        document.getElementById(
            'transaction-note'
        ).value.trim();


    if(!amount || amount <= 0){

        toast(
            'مقدار اسعار را وارد کنید'
        );

        return;
    }


    if(!rate || rate <= 0){

        toast(
            'نرخ معامله را وارد کنید'
        );

        return;
    }


    if(!date){

        toast(
            'تاریخ معامله را وارد کنید'
        );

        return;
    }


    const totalAFN =
        amount * rate;


    const transaction = {

        id:
            editingTransaction
            ? editingTransaction.id
            : String(Date.now()),

        type:
            currentDirection,

        direction:
            currentDirection,

        currency:
            currency,

        rawAmount:
            amount,

        amount:
            amount,

        rate:
            rate,

        exchangeRate:
            rate,

        totalAFN:
            totalAFN,

        amountInBase:
            totalAFN,

        rawDate:
            date,

        date:
            date,

        transactionDate:
            date,

        note:
            note,

        createdAt:
            editingTransaction
            ? editingTransaction.createdAt
            : new Date().toISOString(),

        updatedAt:
            new Date().toISOString()

    };


    if(!Array.isArray(client.transactions)){

        client.transactions = [];

    }


    if(editingTransaction){

        client.transactions[
            editingTransaction.index
        ] = transaction;

    }else{

        client.transactions.unshift(
            transaction
        );
    }


    const saved =
        await saveData();


    if(!saved){

        return;
    }


    closeModal(
        'transaction-modal'
    );


    editingTransaction =
        null;


    renderDashboard();


    toast(
        editingTransaction
        ? 'معامله ویرایش شد'
        : 'معامله با موفقیت ذخیره شد'
    );
}


/* =========================================================
   EDIT TRANSACTION
========================================================= */

function editTransaction(
    clientId,
    transactionIndex
){

    const client =
        appData.clients.find(
            c => String(c.id) === String(clientId)
        );


    if(!client ||
       !client.transactions ||
       !client.transactions[transactionIndex]
    ){

        toast(
            'معامله پیدا نشد'
        );

        return;
    }


    const transaction =
        client.transactions[
            transactionIndex
        ];


    editingTransaction = {

        index:
            transactionIndex,

        id:
            transaction.id ||
            String(Date.now()),

        createdAt:
            transaction.createdAt

    };


    document.getElementById(
        'transaction-modal-title'
    ).innerText =
        'ویرایش معامله';


    document.getElementById(
        'selected-client-id'
    ).value =
        client.id;


    document.getElementById(
        'selected-client-name'
    ).value =
        client.name;


    document.getElementById(
        'currency'
    ).value =
        transaction.currency ||
        'USD';


    document.getElementById(
        'amount'
    ).value =
        transaction.rawAmount ??
        transaction.amount ??
        '';


    document.getElementById(
        'rate'
    ).value =
        transaction.rate ??
        transaction.exchangeRate ??
        '';


    document.getElementById(
        'transaction-date'
    ).value =
        transaction.rawDate ||
        transaction.date ||
        transaction.transactionDate ||
        '';


    document.getElementById(
        'transaction-note'
    ).value =
        transaction.note ||
        transaction.description ||
        '';


    setDirection(
        transaction.type === 'out' ||
        transaction.direction === 'out'
        ? 'out'
        : 'in'
    );


    calculateTransaction();


    openModal(
        'transaction-modal'
    );
}

function askDeleteTransaction(
    clientId,
    transactionIndex
){

    const client =
        appData.clients.find(
            c => String(c.id) === String(clientId)
        );


    if(!client) return;


    deleteTarget = {

        type:'transaction',

        clientId:
            clientId,

        transactionIndex:
            transactionIndex

    };


    document.getElementById(
        'confirm-text'

/* =========================================================
   CONFIRM DELETE
========================================================= */

async function confirmDelete(){

    if(!deleteTarget){

        closeModal(
            'confirm-modal'
        );

        return;
    }


    if(
        deleteTarget.type ===
        'client'
    ){

        appData.clients =
            appData.clients.filter(
                c =>
                    String(c.id) !==
                    String(
                        deleteTarget.clientId
                    )
            );

    }


    if(
        deleteTarget.type ===
        'transaction'
    ){

        const client =
            appData.clients.find(
                c =>
                    String(c.id) ===
                    String(
                        deleteTarget.clientId
                    )
            );


        if(client){

            client.transactions.splice(
                deleteTarget.transactionIndex,
                1
            );

        }
    }


    const saved =
        await saveData();


    if(!saved){

        return;
    }


    deleteTarget =
        null;


    closeModal(
        'confirm-modal'
    );


    renderDashboard();


    toast(
        'با موفقیت حذف شد'
    );
}

function openAddClientFromTransaction(){

    closeModal(
        'client-modal'
    );


    document.getElementById(
        'new-client-name'
    ).value =
        '';


    openModal(
        'client-add-modal'
    );


    setTimeout(()=>{

        document.getElementById(
            'new-client-name'
        ).focus();

    },200);
}


/* =========================================================
   ADD CLIENT
========================================================= */

async function addClient(){

    const name =
        document.getElementById(
            'new-client-name'
        ).value.trim();


    if(!name){

        toast(
            'نام مشتری را وارد کنید'
        );

        return;
    }


    const newClient = {

        id:
            String(
                Date.now()
            ),

        name:
            name,

        transactions:
            []

    };


    appData.clients.push(
        newClient
    );


    const saved =
        await saveData();


    if(!saved){

        return;
    }


    closeModal(
        'client-add-modal'
    );


    renderDashboard();


    toast(
        'مشتری اضافه شد'
    );


    /*
       بعد از ساخت مشتری،
       مستقیماً پنجره ثبت معامله
       برای همان مشتری باز می‌شود.
    */

    setTimeout(()=>{

        openTransactionForClient(
            newClient.id
        );

    },250);
}

/* =========================================================
   TODAY
========================================================= */

function getToday(){

    const d =
        new Date();


    const y =
        d.getFullYear();


    const m =
        String(
            d.getMonth()+1
        ).padStart(2,'0');


    const day =
        String(
            d.getDate()
        ).padStart(2,'0');


    return `${y}-${m}-${day}`;
}


/* =========================================================
   DATE DISPLAY
========================================================= */

function formatDateDisplay(
    dateValue
){

    if(!dateValue){

        return '';
    }


    const d =
        new Date(
            dateValue +
            'T00:00:00'
        );


    if(isNaN(d.getTime())){

        return dateValue;
    }


    return new Intl.DateTimeFormat(
        'fa-AF',
        {
            year:'numeric',
            month:'2-digit',
            day:'2-digit'
        }
    ).format(d);
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(value ?? '')
        .replace(
            /&/g,
            '&amp;'
        )
        .replace(
            /</g,
            '&lt;'
        )
        .replace(
            />/g,
            '&gt;'
        )
        .replace(
            /"/g,
            '&quot;'
        )
        .replace(
            /'/g,
            '&#039;'
        );
}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    'keydown',
    (e)=>{

        if(e.key === 'Escape'){

            document
                .querySelectorAll(
                    '.modal.show'
                )
                .forEach(
                    modal =>
                        modal.classList.remove(
                            'show'
                        )
                );

            document.body.style.overflow =
                '';
        }

    }
);
