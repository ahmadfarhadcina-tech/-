<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
  <title>Transactions | Daily Accounting</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="translator.js"></script>
  <script src="sarafi-api.js"></script>

  <style>
    :root{
      --primary:#7c3aed;
      --primary-dark:#6d28d9;
      --bg:#f7f7f9;
      --card:#ffffff;
      --card2:#f5f3ff;
      --text:#1f2937;
      --muted:#6b7280;
      --border:#e5e7eb;
      --green:#10b981;
      --red:#ef4444;
      --blue:#3b82f6;
      --gold:#f59e0b;
      --radius:13px;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Tahoma, sans-serif;
      -webkit-tap-highlight-color:transparent;
    }

    html,body{
      width:100%;
      min-height:100%;
      background:#f7f7f9;
      color:var(--text);
    }

    body{
      min-height:100vh;
      overflow-x:hidden;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    button,input,select,textarea{
      font:inherit;
    }

    button{
      border:0;
      cursor:pointer;
      background:none;
    }

    button:active,
    .nav-item:active,
    .client-card:active,
    .transaction-row:active,
    .fab:active{
      transform:scale(.96);
    }

    .top-header{
      position:sticky;
      top:0;
      z-index:30;
      background:#fff;
      border-bottom:1px solid #e5e7eb;
      padding:10px 16px;
      box-shadow:0 1px 5px rgba(0,0,0,.04);
    }

    .header-inner{
      width:100%;
      max-width:470px;
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:8px;
      min-width:0;
    }

    .brand-icon{
      width:35px;
      height:35px;
      border-radius:10px;
      background:var(--primary);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:18px;
      box-shadow:0 4px 12px rgba(124,58,237,.30);
      flex-shrink:0;
    }

    .brand-text{
      min-width:0;
    }

    .brand-text h1{
      font-size:15px;
      color:var(--primary);
      font-weight:700;
      margin:0;
    }

    .brand-text p{
      margin-top:2px;
      font-size:9px;
      color:var(--muted);
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .header-actions{
      display:flex;
      align-items:center;
      gap:6px;
      flex-shrink:0;
    }

    .icon-btn{
      width:32px;
      height:32px;
      border-radius:9px;
      background:#f5f3ff;
      color:var(--primary);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:16px;
      transition:.18s ease;
    }

    .icon-btn:hover{
      background:#ede9fe;
    }

    .container{
      width:100%;
      max-width:470px;
      margin:0 auto;
      padding:16px 16px 80px;
    }

    .page-title{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin:2px 0 14px;
    }

    .page-title h2{
      margin:0;
      font-size:18px;
      color:#1f2937;
    }

    .page-title span{
      font-size:10px;
      color:var(--muted);
    }

    .rate-status{
      background:#fff;
      border:1px solid var(--border);
      border-radius:14px;
      padding:10px 12px;
      margin-bottom:12px;
      box-shadow:0 2px 8px rgba(0,0,0,.045);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:9px;
    }

    .rate-status-left{
      display:flex;
      align-items:center;
      gap:8px;
      min-width:0;
      flex:1;
    }

    .rate-dot{
      width:9px;
      height:9px;
      border-radius:50%;
      background:#aaa;
      flex-shrink:0;
    }

    .rate-dot.online{
      background:var(--green);
      box-shadow:0 0 0 3px rgba(16,185,129,.15);
    }

    .rate-dot.error{
      background:var(--red);
      box-shadow:0 0 0 3px rgba(239,68,68,.15);
    }

    .rate-status-text{
      font-size:10px;
      color:#374151;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .refresh-rate{
      background:#f5f3ff;
      color:var(--primary);
      padding:7px 9px;
      border-radius:9px;
      font-size:10px;
      font-weight:600;
      flex-shrink:0;
    }

    #accounts-list{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .client-card{
      background:#fff;
      border:1px solid var(--border);
      border-radius:15px;
      overflow:hidden;
      box-shadow:0 2px 9px rgba(0,0,0,.045);
      animation:cardIn .25s ease;
    }

    @keyframes cardIn{
      from{
        opacity:0;
        transform:translateY(8px) scale(.99);
      }
      to{
        opacity:1;
        transform:none;
      }
    }

    .client-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:12px 14px;
      border-bottom:1px solid #f0f0f0;
    }

    .client-info{
      display:flex;
      align-items:center;
      gap:9px;
      min-width:0;
      flex:1;
    }

    .client-avatar{
      width:38px;
      height:38px;
      border-radius:10px;
      background:var(--primary);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:bold;
      font-size:14px;
      flex-shrink:0;
    }

    .client-name{
      font-size:14px;
      font-weight:bold;
      color:#1f2937;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .client-summary{
      margin-top:3px;
      font-size:9px;
      color:#9ca3af;
    }

    .client-actions{
      display:flex;
      gap:5px;
      flex-shrink:0;
    }

    .small-btn{
      width:31px;
      height:31px;
      border-radius:9px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#f5f3ff;
      color:var(--primary);
      font-size:14px;
      transition:.18s ease;
    }

    .small-btn.delete{
      background:#fef2f2;
      color:var(--red);
    }

    .client-balance{
      margin:10px 11px 0;
      border-radius:10px;
      padding:9px 10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      font-size:10px;
    }

    .client-balance.positive{
      background:#ecfdf5;
      color:#059669;
    }

    .client-balance.negative{
      background:#fef2f2;
      color:#dc2626;
    }

    .client-balance.zero{
      background:#f8fafc;
      color:#6b7280;
    }

    .balance-value{
      font-weight:bold;
      direction:ltr;
      font-size:10px;
      text-align:left;
    }

    .transactions-list{
      border-top:1px solid #f0f0f0;
      margin-top:10px;
      padding:0 0 2px;
    }

    .transaction-row{
      padding:10px 13px;
      border-bottom:1px solid #f1f1f1;
      display:flex;
      flex-direction:column;
      gap:6px;
      background:#fff;
      transition:.16s ease;
    }

    .transaction-row:last-child{
      border-bottom:0;
    }

    .transaction-main{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
    }

    .transaction-left{
      display:flex;
      align-items:center;
      gap:8px;
      min-width:0;
      flex:1;
    }

    .transaction-icon{
      width:29px;
      height:29px;
      border-radius:8px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:12px;
      flex-shrink:0;
    }

    .transaction-icon.in{
      background:#ecfdf5;
      color:var(--green);
    }

    .transaction-icon.out{
      background:#fef2f2;
      color:var(--red);
    }

    .transaction-name{
      font-size:10px;
      font-weight:bold;
      color:#374151;
    }

    .transaction-date{
      margin-top:3px;
      font-size:8px;
      color:#9ca3af;
    }

    .transaction-amount{
      font-size:11px;
      font-weight:bold;
      direction:ltr;
      text-align:left;
      white-space:nowrap;
    }

    .transaction-amount.in{
      color:var(--green);
    }

    .transaction-amount.out{
      color:var(--red);
    }

    .transaction-bottom{
      margin-top:2px;
      padding-top:7px;
      border-top:1px dashed #e5e7eb;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:7px;
    }

    .transaction-meta{
      color:#9ca3af;
      font-size:8px;
      line-height:1.7;
      min-width:0;
      word-break:break-word;
    }

    .transaction-buttons{
      display:flex;
      gap:5px;
      flex-shrink:0;
    }

    .transaction-mini-btn{
      width:27px;
      height:27px;
      border-radius:8px;
      background:#eff6ff;
      color:#2563eb;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:11px;
    }

    .transaction-mini-btn.delete{
      background:#fef2f2;
      color:var(--red);
    }

    .empty-state{
      background:#fff;
      border:1px dashed #d9d6e2;
      border-radius:14px;
      padding:40px 20px;
      text-align:center;
      color:var(--muted);
    }

    .empty-icon{
      font-size:38px;
      margin-bottom:9px;
    }

    .empty-state h3{
      margin:0 0 6px;
      font-size:15px;
      color:#374151;
    }

    .empty-state p{
      margin:0;
      font-size:10px;
      line-height:1.8;
    }

    .empty-transactions{
      padding:13px;
      text-align:center;
      color:#9ca3af;
      font-size:9px;
    }

    .fab{
      position:fixed;
      right:16px;
      bottom:74px;
      width:46px;
      height:46px;
      border-radius:50%;
      background:var(--primary);
      color:#fff;
      font-size:25px;
      box-shadow:0 6px 18px rgba(0,0,0,.16);
      z-index:40;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    [dir=rtl] .fab{
      right:auto;
      left:16px;
    }

    .modal-overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.35);
      backdrop-filter:blur(4px);
      display:none;
      align-items:flex-end;
      justify-content:center;
      z-index:1000;
      padding:10px;
    }

    .modal-overlay.show{
      display:flex;
      animation:fadeIn .18s ease;
    }

    @keyframes fadeIn{
      from{opacity:0}
      to{opacity:1}
    }

    .modal{
      width:100%;
      max-width:450px;
      max-height:92vh;
      overflow:auto;
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:18px 18px 12px 12px;
      padding:17px;
      box-shadow:0 -10px 35px rgba(0,0,0,.15);
      animation:modalUp .22s ease;
    }

    @keyframes modalUp{
      from{
        opacity:0;
        transform:translateY(35px) scale(.97);
      }
      to{
        opacity:1;
        transform:translateY(0) scale(1);
      }
    }

    .modal-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:14px;
    }

    .modal-header h3{
      font-size:15px;
      color:var(--primary);
      margin:0;
    }

    .close-btn{
      width:31px;
      height:31px;
      border-radius:8px;
      background:#f3f4f6;
      color:#6b7280;
      font-size:17px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .form-group{
      margin-bottom:11px;
    }

    .form-group label{
      display:block;
      font-size:10px;
      font-weight:bold;
      color:#6b7280;
      margin-bottom:5px;
    }

    .input,
    .select,
    .textarea{
      width:100%;
      border:1px solid #dfe3e8;
      background:#fff;
      border-radius:11px;
      padding:11px 12px;
      outline:none;
      transition:.18s ease;
      color:#1f2937;
      font-size:12px;
    }

    .input:focus,
    .select:focus,
    .textarea:focus{
      border-color:var(--primary);
      box-shadow:0 0 0 3px rgba(124,58,237,.10);
      background:#fff;
    }

    .textarea{
      min-height:70px;
      resize:vertical;
    }

    .two-cols{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:9px;
    }

    .direction-box{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:7px;
    }

    .direction-option{
      border:1px solid #dfe3e8;
      background:#fff;
      border-radius:11px;
      padding:10px 7px;
      text-align:center;
      font-size:10px;
      transition:.18s ease;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:42px;
    }

    .direction-option.selected.in{
      border-color:#10b981;
      background:#ecfdf5;
      color:#059669;
    }

    .direction-option.selected.out{
      border-color:#ef4444;
      background:#fef2f2;
      color:#dc2626;
    }

    .direction-option input{
      display:none;
    }

    .rate-result{
      background:#f5f3ff;
      border:1px solid #e9d5ff;
      border-radius:11px;
      padding:10px;
      margin-top:8px;
    }

    .rate-result-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
    }

    .rate-label{
      font-size:9px;
      color:#6b7280;
    }

    .rate-number{
      direction:ltr;
      font-size:12px;
      font-weight:bold;
      color:var(--primary);
      text-align:left;
    }

    .base-equivalent,
    .afn-total{
      margin-top:6px;
      padding-top:6px;
      border-top:1px dashed #ddd2f0;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
    }

    .base-equivalent span,
    .afn-total span{
      font-size:9px;
      color:#6b7280;
    }

    .base-equivalent strong,
    .afn-total strong{
      direction:ltr;
      font-size:14px;
      color:var(--primary-dark);
      text-align:left;
    }

    .modal-actions{
      display:flex;
      gap:7px;
      margin-top:13px;
    }

    .primary-btn,
    .secondary-btn,
    .danger-btn{
      flex:1;
      border-radius:11px;
      padding:11px;
      font-size:11px;
      font-weight:600;
      transition:.18s ease;
    }

    .primary-btn{
      background:var(--primary);
      color:#fff;
      box-shadow:0 4px 12px rgba(124,58,237,.30);
    }

    .secondary-btn{
      background:#f3f4f6;
      color:#4b5563;
    }

    .danger-btn{
      background:#fef2f2;
      color:#dc2626;
    }

    .primary-btn:disabled{
      opacity:.5;
      cursor:not-allowed;
    }

    .loading{
      text-align:center;
      padding:30px;
      color:#9ca3af;
      font-size:10px;
    }

    .toast-container{
      position:fixed;
      bottom:75px;
      left:12px;
      right:12px;
      z-index:200;
      pointer-events:none;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:7px;
    }

    .toast{
      max-width:450px;
      width:100%;
      background:#1f2937;
      color:#fff;
      border-radius:10px;
      padding:10px 13px;
      font-size:10px;
      border:1px solid #374151;
      box-shadow:0 8px 25px rgba(0,0,0,.18);
      animation:toastIn .22s ease;
      text-align:center;
    }

    .toast.success{
      background:var(--primary);
    }

    .toast.error{
      background:#dc2626;
    }

    @keyframes toastIn{
      from{
        opacity:0;
        transform:translateY(10px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .bottom-nav{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      height:60px;
      background:rgba(255,255,255,.97);
      backdrop-filter:blur(12px);
      border-top:1px solid #e5e7eb;
      display:flex;
      justify-content:space-around;
      align-items:center;
      z-index:50;
      box-shadow:0 -2px 10px rgba(0,0,0,.05);
      padding:0;
    }

    .nav-inner{
      width:100%;
      display:flex;
      height:100%;
    }

    .nav-item{
      width:50%;
      height:100%;
      background:transparent;
      border-radius:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:2px;
      color:#9ca3af;
      text-decoration:none;
      font-size:8px;
      padding:6px 4px;
      transition:.18s ease;
    }

    .nav-item .nav-icon{
      font-size:19px;
      line-height:19px;
    }

    .nav-item.active{
      color:var(--primary);
    }

    @media(max-width:380px){
      .container{
        padding-left:12px;
        padding-right:12px;
      }

      .client-card{
        border-radius:12px;
      }

      .transaction-row{
        padding:9px 10px;
      }

      .header-inner{
        padding:0;
      }

      .brand-text p{
        display:none;
      }
    }
  </style>
</head>
<body>

  <header class="top-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-icon">💱</div>
        <div class="brand-text">
          <h1 data-i18n="dailyAccounting">Daily Accounting</h1>
          <p data-i18n="transactionManagement">مدیریت معاملات و حساب مشتریان</p>
        </div>
      </div>

      <div class="header-actions">
        <button class="icon-btn" onclick="refreshRates()" title="بروزرسانی نرخ" data-i18n-title="refreshRates">↻</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="page-title">
      <h2 data-i18n="transactions">معاملات</h2>
      <span id="clientCount">0 مشتری</span>
    </div>

    <div class="rate-status">
      <div class="rate-status-left">
        <span class="rate-dot" id="rateDot"></span>
        <span class="rate-status-text" id="rateStatus" data-i18n="loadingRates">در حال دریافت نرخ اسعار...</span>
      </div>

      <button class="refresh-rate" onclick="refreshRates()" data-i18n="refresh">بروزرسانی</button>
    </div>

    <div id="accounts-list">
      <div class="loading" data-i18n="loadingAccounts">در حال بارگذاری حساب‌ها...</div>
    </div>
  </main>

  <button class="fab" onclick="openAddClientModal()" title="افزودن مشتری" data-i18n-title="addClient">+</button>

  <div class="modal-overlay" id="clientModal">
    <div class="modal">
      <div class="modal-header">
        <h3 data-i18n="addClient">افزودن مشتری</h3>
        <button class="close-btn" onclick="closeModal('clientModal')">×</button>
      </div>

      <div class="form-group">
        <label data-i18n="clientName">نام مشتری</label>
        <input id="clientNameInput" class="input" type="text" placeholder="مثلاً احمد" data-i18n-placeholder="exampleAhmad" autocomplete="off" />
      </div>

      <div class="modal-actions">
        <button class="secondary-btn" onclick="closeModal('clientModal')" data-i18n="cancel">لغو</button>
        <button class="primary-btn" onclick="saveClient()" data-i18n="saveClient">ذخیره مشتری</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="transactionModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="transactionModalTitle" data-i18n="newTransaction">معامله جدید</h3>
        <button class="close-btn" onclick="closeModal('transactionModal')">×</button>
      </div>

      <div class="form-group">
        <label data-i18n="client">مشتری</label>
        <select id="transactionClient" class="select"></select>
      </div>

      <div class="form-group">
        <label data-i18n="transactionType">نوع معامله</label>
        <div class="direction-box">
          <label class="direction-option selected in" id="directionInBox">
            <input type="radio" name="direction" value="in" checked onchange="setDirection('in')" />
            <span data-i18n="clientGivesMe">↓ مشتری به من می‌دهد</span>
          </label>

          <label class="direction-option out" id="directionOutBox">
            <input type="radio" name="direction" value="out" onchange="setDirection('out')" />
            <span data-i18n="iGiveClient">↑ من به مشتری می‌دهم</span>
          </label>
        </div>
      </div>

      <div class="two-cols">
        <div class="form-group">
          <label data-i18n="currency">پول / ارز</label>
          <select id="transactionCurrency" class="select" onchange="calculateTransaction()">

  <div class="toast-container" id="toastContainer"></div>

  <script>
    const SUPABASE_URL = "https://hvsymjkbmpmvjycwenbd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_9pkhkb88LNXJw457Sx8dpA_0E231JwH";

    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    let currentUser = null;
    let appData = { clients: [] };
    let liveRates = null;
    let editingTransaction = null;
    let selectedDirection = "in";
    let confirmCallback = null;

    function pageT(key, fallback) {
      try {
        if (window.DailyTranslator && typeof window.DailyTranslator.t === "function") {
          const value = window.DailyTranslator.t(key);
          if (value && value !== key) return value;
        }
      } catch (e) {}
      return fallback || key;
    }

    function applyPageLanguage() {
      try {
        if (window.DailyTranslator && typeof window.DailyTranslator.applyGlobalSettings === "function") {
          window.DailyTranslator.applyGlobalSettings();
        }
        if (window.DailyTranslator && typeof window.DailyTranslator.translatePage === "function") {
          window.DailyTranslator.translatePage();
        }
      } catch (e) {}
    }

    function getSelectedBaseCurrency() {
      try {
        if (window.DailyTranslator && typeof window.DailyTranslator.getBaseCurrency === "function") {
          const value = window.DailyTranslator.getBaseCurrency();
          if (typeof value === "string" && value.trim()) return value.trim().toUpperCase();
          if (value && typeof value === "object") {
            const code = value.code || value.currency || value.currencyCode;
            if (code) return String(code).trim().toUpperCase();
          }
        }
      } catch (e) {}
      try {
        if (window.DailyTranslator && typeof window.DailyTranslator.getCurrencyCode === "function") {
          const code = window.DailyTranslator.getCurrencyCode();
          if (code) return String(code).trim().toUpperCase();
        }
      } catch (e) {}
      return "AFN";
    }

    function getSelectedBaseCurrencyName() {
      const code = getSelectedBaseCurrency();
      const names = {
        AFN: "افغانی",
        USD: "دلار",
        EUR: "یورو",
        IRR: "ریال ایران",
        TRY: "لیر ترکیه",
        SAR: "ریال سعودی",
        AED: "درهم امارات",
        GBP: "پوند",
        CAD: "دلار کانادا",
        AUD: "دلار استرالیا",
        CHF: "فرانک سوئیس",
        INR: "روپیه هند",
        PKR: "روپیه پاکستان",
        CNY: "یوان چین",
        RUB: "روبل روسیه",
        JPY: "ین ژاپن",
        TOMAN: "تومان"
      };
      return names[code] || code;
    }

    function updateCurrencyInterface() {
      const base = getSelectedBaseCurrency();
      const baseName = getSelectedBaseCurrencyName();

      const rateLabel = document.getElementById("rateLabel");
      if (rateLabel) rateLabel.textContent = `${pageT("todayRate","نرخ امروز")} به ${base}`;

      const equivalentLabel = document.getElementById("baseEquivalentLabel");
      if (equivalentLabel) equivalentLabel.textContent = `${pageT("equivalent","معادل")} ${baseName} (${base})`;

      const afnLabel = document.getElementById("afnTotalLabel");
      if (afnLabel) afnLabel.textContent = pageT("transactionValueAFN","ارزش ثبت‌شده به افغانی");

      const rateStatus = document.getElementById("rateStatus");
      if (rateStatus && liveRates) {
        rateStatus.textContent = `${pageT("ratesOnline","نرخ اسعار آنلاین است")} • ${base}`;
      }
    }

    function normalizeKey(key) {
      return String(key).trim().toLowerCase().replace(/[\s_-]/g, "");
    }

    function extractNumber(value) {
      if (typeof value === "number") return Number.isFinite(value) ? value : null;
      if (typeof value === "string") {
        const cleaned = value.replace(/,/g, "").replace(/[^\d.-]/g, "");
        if (!cleaned) return null;
        const n = Number(cleaned);
        return Number.isFinite(n) ? n : null;
      }
      if (value && typeof value === "object") {
        const keys = ["rate", "value", "price", "sell", "buy", "afn", "AFN", "rateAfn", "afnRate"];
        for (const key of keys) {
          if (value[key] !== undefined) {
            const n = extractNumber(value[key]);
            if (n !== null) return n;
          }
        }
      }
      return null;
    }

    function findCurrencyValue(obj, aliases) {
      if (obj === null || obj === undefined) return null;
      if (typeof obj !== "object") return null;

      for (const key of Object.keys(obj)) {
        const value = obj[key];
        const normalizedKey = normalizeKey(key);

        for (const alias of aliases) {
          const normalizedAlias = normalizeKey(alias);
          if (normalizedKey === normalizedAlias) {
            const n = extractNumber(value);
            if (n !== null) return n;
          }
        }
      }

      for (const key of Object.keys(obj)) {
        const value = obj[key];
        if (value && typeof value === "object") {
          const result = findCurrencyValue(value, aliases);
          if (result !== null) return result;
        }
      }

      return null;
    }

    function getRateForCurrency(currency) {
      currency = String(currency || "AFN").trim().toUpperCase();
      if (currency === "AFN") return 1;
      if (!liveRates) return null;

      const aliases = {
        USD: ["USD", "usd", "dollar", "دلار"],
        EUR: ["EUR", "eur", "euro", "یورو"],
        IRR: ["IRR", "irr", "rial", "ریال"],
        TOMAN: ["TOMAN", "toman", "IRAN_TOMAN", "تومان"],
        JPY: ["JPY", "jpy", "yen", "ین"],
        TRY: ["TRY", "try", "lira", "لیر"],
        SAR: ["SAR", "sar", "saudiRiyal", "ریال سعودی"],
        AED: ["AED", "aed", "dirham", "درهم"],
        GBP: ["GBP", "gbp", "pound", "پوند"],
        CAD: ["CAD", "cad"],
        AUD: ["AUD", "aud"],
        CHF: ["CHF", "chf"],
        INR: ["INR", "inr", "rupee", "روپیه"],
        PKR: ["PKR", "pkr"],
        CNY: ["CNY", "cny", "yuan", "یوان"],
        RUB: ["RUB", "rub", "ruble", "روبل"]
      };

      const found = findCurrencyValue(liveRates, aliases[currency] || [currency]);
      if (found === null) return null;
      const number = Number(found);
      return Number.isFinite(number) && number > 0 ? number : null;
    }

    function getLiveRate(fromCurrency, toCurrency) {
      const from = String(fromCurrency || "AFN").trim().toUpperCase();
      const to = String(toCurrency || getSelectedBaseCurrency()).trim().toUpperCase();

      if (from === to) return 1;

      if (window.CinaSarafi && typeof window.CinaSarafi.getSarafiRate === "function") {
        try {
          const rate = window.CinaSarafi.getSarafiRate(from, to);
          if (rate !== null && Number.isFinite(Number(rate)) && Number(rate) > 0) {
            return Number(rate);
          }
        } catch (e) {}
      }

      if (!liveRates) return null;

      const fromRate = from === "AFN" ? 1 : getRateForCurrency(from);
      const toRate = to === "AFN" ? 1 : getRateForCurrency(to);

      if (
        fromRate === null ||
        toRate === null ||
        !Number.isFinite(Number(fromRate)) ||
        !Number.isFinite(Number(toRate)) ||
        Number(fromRate) <= 0 ||
        Number(toRate) <= 0
      ) {
        return null;
      }

      return Number(fromRate) / Number(toRate);
    }

    function convertLiveCurrency(amount, fromCurrency, toCurrency) {
      const number = Number(amount);
      if (!Number.isFinite(number)) return null;
      const rate = getLiveRate(fromCurrency, toCurrency);
      if (rate === null || !Number.isFinite(rate)) return null;
      return number * rate;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function escapeAttribute(value) {
      return escapeHtml(value);
    }

    function formatNumber(number) {
      if (number === null || number === undefined || !Number.isFinite(Number(number))) return "0";
      return Number(number).toLocaleString("en-US", { maximumFractionDigits: 8 });
    }

    function formatDate(dateString) {
      if (!dateString) return pageT("noDate","بدون تاریخ");
      try {
        const date = new Date(dateString + "T00:00:00");
        const settings = window.DailyTranslator && typeof window.DailyTranslator.getSettings === "function" ? window.DailyTranslator.getSettings() : null;
        const language = settings?.language || "fa";
        const localeMap = { en: "en-US", fa: "fa-AF", ar: "ar", ps: "ps-AF", tr: "tr-TR" };
        return new Intl.DateTimeFormat(localeMap[language] || "fa-AF", { year: "numeric", month: "2-digit", day: "2-digit" }).format(date);
      } catch (e) {
        return dateString;
      }
    }

    function showToast(message, type = "") {
      const container = document.getElementById("toastContainer");
      if (!container) return;
      const toast = document.createElement("div");
      toast.className = `toast ${type}`;
      toast.textContent = message;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateY(-8px)";
        setTimeout(() => toast.remove(), 200);
      }, 2800);
    }

    function createId() {
      return (Date.now().toString(36) + Math.random().toString(36).substring(2, 10));
    }

    function openModal(id) {
      const modal = document.getElementById(id);
      if (!modal) return;
      modal.classList.add("show");
      document.body.style.overflow = "hidden";
    }

    function closeModal(id) {
      const modal = document.getElementById(id);
      if (!modal) return;
      modal.classList.remove("show");
      if (!document.querySelector(".modal-overlay.show")) document.body.style.overflow = "";
    }

    function openConfirm(title, message, callback) {
      const confirmTitle = document.getElementById("confirmTitle");
      const confirmMessage = document.getElementById("confirmMessage");
      const confirmButton = document.getElementById("confirmButton");

      if (confirmTitle) confirmTitle.textContent = title;
      if (confirmMessage) confirmMessage.innerHTML = message;

      confirmCallback = callback;

      confirmButton.onclick = async () => {
        closeModal("confirmModal");
        if (confirmCallback) {
          const cb = confirmCallback;
          confirmCallback = null;
          await cb();
        }
      };

      openModal("confirmModal");
    }

    document.querySelectorAll(".modal-overlay").forEach(overlay => {
      overlay.addEventListener("click", function (event) {
        if (event.target === overlay) closeModal(overlay.id);
      });
    });

    function setToday() {
      const input = document.getElementById("transactionDate");
      if (!input || input.value) return;

      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      input.value = `${year}-${month}-${day}`;
    }

    function normalizeExistingData() {
      appData.clients.forEach(client => {
        if (!client.id) client.id = createId();
        if (!Array.isArray(client.transactions)) client.transactions = [];

        client.transactions.forEach(tx => {
          if (!tx.id) tx.id = createId();
          if (!tx.currency) tx.currency = "AFN";
          if (!tx.type) tx.type = tx.direction || "in";
          if (tx.amount === undefined) tx.amount = tx.rawAmount || 0;
          if (tx.rawAmount === undefined) tx.rawAmount = tx.amount || 0;
          if (!tx.rawDate) tx.rawDate = tx.date || new Date().toISOString().slice(0, 10);
          if (tx.totalAFN === undefined) {
            tx.totalAFN = tx.amountInBase !== undefined ? Number(tx.amountInBase) || 0 : 0;
          }
        });
      });
    }

    async function saveData() {
      if (!supabaseClient || !currentUser) return;
      const { error } = await supabaseClient.from("exchange_users").upsert({
        user_id: currentUser.id,
        email: currentUser.email,
        content: appData
      }, { onConflict: "user_id" });

      if (error) throw error;
    }

    async function checkAuth() {
      if (!supabaseClient) return;
      const { data, error } = await supabaseClient.auth.getSession();
      if (error) {
        console.error(error);
        showToast(pageT("authCheckError","خطا در بررسی حساب"), "error");
        return;
      }

      currentUser = data.session?.user || null;
      if (!currentUser) {
        window.location.href = "index.html";
        return;
      }

      await loadData();
    }

    async function loadData() {
      if (!supabaseClient || !currentUser) return;

      try {
        const { data, error } = await supabaseClient
          .from("exchange_users")
          .select("*")
          .eq("user_id", currentUser.id)
          .maybeSingle();

        if (error) throw error;

        if (data && data.content) {
          appData = typeof data.content === "string" ? JSON.parse(data.content) : data.content;
        }

        if (!appData || typeof appData !== "object") appData = {};
        if (!Array.isArray(appData.clients)) appData.clients = [];

        normalizeExistingData();
        renderClients();
      } catch (error) {
        console.error(error);
        showToast(pageT("loadDataError","خطا در بارگذاری اطلاعات"), "error");
      }
    }

    function renderClients() {
      const container = document.getElementById("accounts-list");
      const count = document.getElementById("clientCount");
      if (!container || !count) return;

      count.textContent = `${appData.clients.length} ${pageT("clients","مشتری")}`;

      if (!appData.clients.length) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">👥</div>
            <h3>${pageT("noClients","هنوز مشتری ندارید")}</h3>
            <p>${pageT("addClientHint","از دکمه + برای اضافه کردن مشتری استفاده کنید.")}</p>
          </div>
        `;
        return;
      }

      container.innerHTML = appData.clients.map(client => renderClient(client)).join("");
    }

    function renderClient(client) {
      const transactions = Array.isArray(client.transactions) ? client.transactions : [];
      let balanceAFN = 0;

      transactions.forEach(tx => {
        const value = Number(tx.totalAFN) || 0;
        if (tx.type === "in" || tx.direction === "in") {
          balanceAFN += value;
        } else {
          balanceAFN -= value;
        }
      });

      const baseCurrency = getSelectedBaseCurrency();
      const balanceBase = convertLiveCurrency(balanceAFN, "AFN", baseCurrency);

      let balanceClass = "zero";
      let balanceText = pageT("settled","تسویه شده");

      if (balanceAFN > 0.000001) {
        balanceClass = "positive";
        balanceText = pageT("clientOwesMe","مشتری به شما باقی دارد");
      } else if (balanceAFN < -0.000001) {
        balanceClass = "negative";
        balanceText = pageT("iOweClient","شما به مشتری باقی دارید");
      }

      const avatar = escapeHtml(String(client.name || "?").trim().charAt(0));
      const balanceDisplay = balanceBase === null ? `— ${escapeHtml(baseCurrency)}` : `${formatNumber(Math.abs(balanceBase))} ${escapeHtml(baseCurrency)}`;

      const transactionsHTML = transactions
        .slice()
        .sort((a, b) => String(b.rawDate || "").localeCompare(String(a.rawDate || "")))
        .map(tx => renderTransaction(client, tx))
        .join("");

      return `
        <section class="client-card">
          <div class="client-top">
            <div class="client-info">
              <div class="client-avatar">${avatar}</div>
              <div style="min-width:0">
                <div class="client-name">${escapeHtml(client.name)}</div>
                <div class="client-summary">${transactions.length} ${pageT("transactionsCountWord","معامله")}</div>
              </div>
            </div>

            <div class="client-actions">
              <button class="small-btn" onclick="openTransactionModal('${escapeAttribute(client.id)}')" title="${pageT("newTransaction","معامله جدید")}">＋</button>
              <button class="small-btn delete" onclick="askDeleteClient('${escapeAttribute(client.id)}')" title="${pageT("deleteClient","حذف مشتری")}">🗑</button>
            </div>
          </div>

          <div class="client-balance ${balanceClass}">
            <span>${balanceText}</span>
            <span class="balance-value">${balanceDisplay}</span>
          </div>

          <div class="transactions-list">
            ${transactionsHTML || `<div class="empty-transactions">${pageT("noTransactions","هنوز معامله‌ای ثبت نشده است.")}</div>`}
          </div>
        </section>
      `;
    }

    function renderTransaction(client, tx) {
      const isIn = tx.type === "in" || tx.direction === "in";
      const sign = isIn ? "+" : "-";
      const icon = isIn ? "↓" : "↑";
      const currency = String(tx.currency || "AFN").toUpperCase();
      const amount = Number(tx.rawAmount ?? tx.amount ?? 0);
      const date = tx.rawDate || tx.date || "";
      const afnRate = Number(tx.rateAtTransaction) || 0;
      const baseCurrency = getSelectedBaseCurrency();
      const equivalent = convertLiveCurrency(amount, currency, baseCurrency);
      const note = tx.note ? escapeHtml(tx.note) : "";

      let equivalentText = `${pageT("equivalent","معادل")}: — ${escapeHtml(baseCurrency)}`;
      if (equivalent !== null) equivalentText = `${pageT("equivalent","معادل")}: ${formatNumber(equivalent)} ${escapeHtml(baseCurrency)}`;

      return `
        <div class="transaction-row">
          <div class="transaction-main">
            <div class="transaction-left">
              <div class="transaction-icon ${isIn ? "in" : "out"}">${icon}</div>
              <div>
                <div class="transaction-name">${isIn ? pageT("clientGaveMe","مشتری به من داد") : pageT("iGaveClient","من به مشتری دادم")}</div>
                <div class="transaction-date">${formatDate(date)}</div>
              </div>
            </div>

            <div class="transaction-amount ${isIn ? "in" : "out"}">
              ${sign}${formatNumber(amount)} ${escapeHtml(currency)}
            </div>
          </div>

          <div class="transaction-bottom">
            <div class="transaction-meta">
              <strong>${equivalentText}</strong>
              ${afnRate ? ` • ${pageT("rate","نرخ")} ${formatNumber(afnRate)} AFN` : ""}
              ${note ? ` • ${note}` : ""}
            </div>

            <div class="transaction-buttons">
              <button class="transaction-mini-btn" onclick="editTransaction('${escapeAttribute(client.id)}','${escapeAttribute(tx.id)}')" title="${pageT("edit","ویرایش")}">✎</button>
              <button class="transaction-mini-btn delete" onclick="askDeleteTransaction('${escapeAttribute(client.id)}','${escapeAttribute(tx.id)}')" title="${pageT("delete","حذف")}">×</button>
            </div>
          </div>
        </div>
      `;
    }

    function openAddClientModal() {
      const input = document.getElementById("clientNameInput");
      if (input) input.value = "";
      openModal("clientModal");
      setTimeout(() => {
        const el = document.getElementById("clientNameInput");
        if (el) el.focus();
      }, 100);
    }

    async function saveClient() {
      const input = document.getElementById("clientNameInput");
      const name = input.value.trim();

      if (!name) {
        showToast(pageT("enterClientName","نام مشتری را وارد کنید"), "error");
        input.focus();
        return;
      }

      appData.clients.push({ id: createId(), name, transactions: [] });

      try {
        await saveData();
        closeModal("clientModal");
        renderClients();
        showToast(pageT("clientAdded","مشتری با موفقیت اضافه شد"), "success");
      } catch (error) {
        console.error(error);
        appData.clients.pop();
        showToast(pageT("clientSaveFailed","ذخیره مشتری انجام نشد"), "error");
      }
    }

    function askDeleteClient(clientId) {
      const client = appData.clients.find(c => c.id === clientId);
      if (!client) return;

      openConfirm(
        pageT("deleteClient","حذف مشتری"),
        `${pageT("deleteClientQuestion","آیا مطمئن هستید که")} «${escapeHtml(client.name)}» ${pageT("deleteClientQuestionEnd","و تمام معاملات او حذف شود؟")}`,
        async () => {
          const old = appData.clients;
          appData.clients = old.filter(c => c.id !== clientId);

          try {
            await saveData();
            renderClients();
            showToast(pageT("clientDeleted","مشتری حذف شد"), "success");
          } catch (error) {
            console.error(error);
            appData.clients = old;
            renderClients();
            showToast(pageT("deleteFailed","حذف انجام نشد"), "error");
          }
        }
      );
    }

    async function openTransactionModal(clientId) {
      editingTransaction = null;
      document.getElementById("transactionModalTitle").textContent = pageT("newTransaction","معامله جدید");
      fillClientSelect(clientId);
      document.getElementById("transactionAmount").value = "";
      document.getElementById("transactionCurrency").value = "AFN";
      document.getElementById("transactionNote").value = "";
      setToday();
      setDirection("in");
      updateCurrencyInterface();
      openModal("transactionModal");
      await refreshRates();
      calculateTransaction();
    }

    function fillClientSelect(selectedId) {
      const select = document.getElementById("transactionClient");
      select.innerHTML = appData.clients.map(client => `
        <option value="${escapeAttribute(client.id)}" ${client.id === selectedId ? "selected" : ""}>
          ${escapeHtml(client.name)}
        </option>
      `).join("");
    }

    function setDirection(direction) {
      selectedDirection = direction;

      const inBox = document.getElementById("directionInBox");
      const outBox = document.getElementById("directionOutBox");

      inBox.classList.toggle("selected", direction === "in");
      outBox.classList.toggle("selected", direction === "out");

      const input = document.querySelector(`input[name="direction"][value="${direction}"]`);
      if (input) input.checked = true;
    }

    async function editTransaction(clientId, transactionId) {
      const client = appData.clients.find(c => c.id === clientId);
      if (!client) return;

      const tx = client.transactions.find(t => t.id === transactionId);
      if (!tx) return;

      editingTransaction = { clientId, transactionId };

      document.getElementById("transactionModalTitle").textContent = pageT("editTransaction","ویرایش معامله");
      fillClientSelect(clientId);

      document.getElementById("transactionCurrency").value = tx.currency || "AFN";
      document.getElementById("transactionAmount").value = tx.rawAmount ?? tx.amount ?? "";
      document.getElementById("transactionDate").value = tx.rawDate || tx.date || "";
      document.getElementById("transactionNote").value = tx.note || "";

      setDirection(tx.type || tx.direction || "in");
      updateCurrencyInterface();

      openModal("transactionModal");
      await refreshRates();
      calculateTransaction();
    }

    async function saveTransaction() {
      const clientId = document.getElementById("transactionClient").value;
      const currency = document.getElementById("transactionCurrency").value.trim().toUpperCase();
      const amount = Number(document.getElementById("transactionAmount").value);
      const date = document.getElementById("transactionDate").value;
      const note = document.getElementById("transactionNote").value.trim();

      if (!clientId) {
        showToast(pageT("selectClient","مشتری را انتخاب کنید"), "error");
        return;
      }

      if (!amount || amount <= 0) {
        showToast(pageT("enterAmount","مقدار معامله را وارد کنید"), "error");
        return;
      }

      if (!date) {
        showToast(pageT("enterTransactionDate","تاریخ معامله را وارد کنید"), "error");
        return;
      }

      const rate = getRateForCurrency(currency);
      if (rate === null) {
        showToast(pageT("rateNotAvailable","نرخ این ارز از API دریافت نشد"), "error");
        return;
      }

      const totalAFN = calculateAFN(amount, rate, currency);
      if (!Number.isFinite(totalAFN)) {
        showToast(pageT("rateCalculationFailed","محاسبه نرخ انجام نشد"), "error");
        return;
      }

      const selectedBase = getSelectedBaseCurrency();
      const selectedBaseRate = getLiveRate(currency, selectedBase);
      const amountInSelectedBase = selectedBaseRate === null ? null : amount * selectedBaseRate;

      const tx = {
        id: editingTransaction ? editingTransaction.transactionId : createId(),
        type: selectedDirection,
        direction: selectedDirection,
        currency,
        rawAmount: amount,
        amount,
        rateAtTransaction: rate,
        totalAFN,
        amountInBase: totalAFN,
        baseCurrencyAtTransaction: selectedBase,
        baseRateAtTransaction: selectedBaseRate,
        amountInSelectedBaseAtTransaction: amountInSelectedBase,
        rawDate: date,
        date,
        note,
        rateSource: "sarafi-api.js",
        rateSavedAt: new Date().toISOString()
      };

      const wasEditing = !!editingTransaction;

      try {
        if (wasEditing) {
          const client = appData.clients.find(c => c.id === editingTransaction.clientId);
          if (!client) throw new Error("Client not found");

          const index = client.transactions.findIndex(t => t.id === editingTransaction.transactionId);
          if (index === -1) throw new Error("Transaction not found");

          client.transactions[index] = tx;
        } else {
          const client = appData.clients.find(c => c.id === clientId);
          if (!client) throw new Error("Client not found");
          if (!Array.isArray(client.transactions)) client.transactions = [];
          client.transactions.push(tx);
        }

        await saveData();
        editingTransaction = null;
        closeModal("transactionModal");
        renderClients();
        showToast(
          wasEditing ? pageT("transactionEdited","معامله ویرایش شد") : pageT("transactionSaved","معامله با موفقیت ثبت شد"),
          "success"
        );
      } catch (error) {
        console.error(error);
        showToast(pageT("transactionSaveFailed","ذخیره معامله انجام نشد"), "error");
      }
    }

    function askDeleteTransaction(clientId, transactionId) {
      openConfirm(
        pageT("deleteTransaction","حذف معامله"),
        pageT("deleteTransactionQuestion","آیا مطمئن هستید که این معامله حذف شود؟"),
        async () => {
          const client = appData.clients.find(c => c.id === clientId);
          if (!client) return;

          const old = [...client.transactions];
          client.transactions = client.transactions.filter(tx => tx.id !== transactionId);

          try {
            await saveData();
            renderClients();
            showToast(pageT("transactionDeleted","معامله حذف شد"), "success");
          } catch (error) {
            console.error(error);
            client.transactions = old;
            renderClients();
            showToast(pageT("transactionDeleteFailed","حذف معامله انجام نشد"), "error");
          }
        }
      );
    }

    function calculateAFN(amount, rate, currency) {
      if (currency === "AFN") return amount;
      return amount * rate;
    }

    function calculateTransaction() {
      const currencyElement = document.getElementById("transactionCurrency");
      const amountElement = document.getElementById("transactionAmount");
      if (!currencyElement || !amountElement) return;

      const currency = currencyElement.value.trim().toUpperCase();
      const amount = Number(amountElement.value) || 0;

      const baseCurrency = getSelectedBaseCurrency();
      const afnRate = getRateForCurrency(currency);
      const baseRate = getLiveRate(currency, baseCurrency);

      const rateDisplay = document.getElementById("rateDisplay");
      const baseTotal = document.getElementById("baseTotal");
      const totalDisplay = document.getElementById("afnTotal");
      const saveButton = document.getElementById("saveTransactionBtn");

      if (baseRate === null) {
        rateDisplay.textContent = pageT("notReceived","دریافت نشد");
        baseTotal.textContent = `— ${baseCurrency}`;
      } else {
        rateDisplay.textContent = `1 ${currency} = ${formatNumber(baseRate)} ${baseCurrency}`;
        const equivalent = amount * baseRate;
        baseTotal.textContent = `${formatNumber(equivalent)} ${baseCurrency}`;
      }

      if (afnRate === null) {
        totalDisplay.textContent = "— AFN";
        saveButton.disabled = true;
        return;
      }

      const total = calculateAFN(amount, afnRate, currency);
      totalDisplay.textContent = `${formatNumber(total)} AFN`;
      saveButton.disabled = false;
    }

    async function refreshRates() {
      const dot = document.getElementById("rateDot");
      const status = document.getElementById("rateStatus");
      if (!dot || !status) return null;

      dot.classList.remove("online", "error");
      status.textContent = pageT("loadingRates","در حال دریافت نرخ اسعار...");

      try {
        let rates = null;

        if (window.CinaSarafi && typeof window.CinaSarafi.refreshSarafiRates === "function") {
          rates = await window.CinaSarafi.refreshSarafiRates();
        } else if (typeof getSarafiRates === "function") {
          rates = await getSarafiRates();
        } else {
          throw new Error("Sarafi API function not found");
        }

        if (!rates) throw new Error("API returned empty data");

        liveRates = rates;
        dot.classList.add("online");

        const base = getSelectedBaseCurrency();
        status.textContent = `${pageT("ratesOnline","نرخ اسعار آنلاین است")} • ${base}`;
        updateCurrencyInterface();

        const transactionModal = document.getElementById("transactionModal");
        if (transactionModal && transactionModal.classList.contains("show")) calculateTransaction();

        renderClients();
        return rates;
      } catch (error) {
        console.error("Rate loading error:", error);
        dot.classList.add("error");
        status.textContent = pageT("ratesFailed","دریافت نرخ اسعار ناموفق بود");
        liveRates = null;
        renderClients();
        return null;
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      applyPageLanguage();
      updateCurrencyInterface();
      setToday();

      await checkAuth();
      await refreshRates();
      updateCurrencyInterface();
      renderClients();
    });

    setInterval(async () => {
      await refreshRates();
    }, 60000);

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        document.querySelectorAll(".modal-overlay.show").forEach(modal => closeModal(modal.id));
      }
    });

    setTimeout(() => {
      applyPageLanguage();
      updateCurrencyInterface();
      renderClients();
    }, 100);
  </script>
</body>
</html>
