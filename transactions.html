<!DOCTYPE html>
<html lang="fa" dir="rtl" id="html-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>معاملات | Daily Accounting</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="translator.js"></script>
  <script src="sarafi-api.js"></script>

  <style>
    :root{
      --primary:#7c3aed;
      --primary-soft:#f5f3ff;
      --primary-strong:#6d28d9;
      --primary-fade:#efe7ff;

      --bg:#f7f7f9;
      --card:#ffffff;
      --card-soft:#faf8ff;
      --text:#1f2937;
      --muted:#6b7280;
      --border:#e5e7eb;

      --green:#10b981;
      --green-soft:#ecfdf5;
      --red:#ef4444;
      --red-soft:#fef2f2;
      --blue:#2563eb;
      --blue-soft:#eff6ff;

      --shadow-soft:0 8px 22px rgba(124,58,237,0.08);
      --shadow-card:0 10px 24px rgba(17,24,39,0.06);
      --shadow-modal:0 20px 45px rgba(15,23,42,0.18);
      --radius:18px;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      -webkit-tap-highlight-color:transparent;
      font-family:Tahoma, sans-serif;
    }

    html, body{
      width:100%;
      min-height:100%;
      background:var(--bg);
      color:var(--text);
    }

    body{
      min-height:100vh;
      overflow-x:hidden;
      padding-bottom:60px;
    }

    button, input, select, textarea{
      font:inherit;
    }

    button{
      border:0;
      background:none;
      cursor:pointer;
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    .app-shell{
      max-width:480px;
      margin:0 auto;
      min-height:100vh;
      background:var(--bg);
      position:relative;
    }

    /* ===========================================
       HEADER
    =========================================== */

    .topbar{
      position:sticky;
      top:0;
      z-index:40;
      background:rgba(255,255,255,0.86);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(229,231,235,0.9);
      box-shadow:0 1px 4px rgba(0,0,0,0.04);
    }

    .topbar-inner{
      max-width:480px;
      margin:0 auto;
      padding:12px 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .brand-wrap{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .brand-icon{
      width:38px;
      height:38px;
      border-radius:12px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(135deg, var(--primary), var(--primary-strong));
      color:#fff;
      font-size:18px;
      box-shadow:0 8px 18px rgba(124,58,237,0.25);
      flex-shrink:0;
    }

    .brand-text{
      min-width:0;
    }

    .brand-text h1{
      margin:0;
      font-size:15px;
      color:var(--primary);
      font-weight:800;
      line-height:1.2;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .brand-text p{
      margin:3px 0 0;
      color:var(--muted);
      font-size:9px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .header-action{
      width:36px;
      height:36px;
      border-radius:11px;
      background:var(--primary-soft);
      color:var(--primary);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:18px;
      box-shadow:inset 0 0 0 1px rgba(124,58,237,0.08);
      transition:all .2s ease;
    }

    .header-action:active{
      transform:scale(.96);
    }

    /* ===========================================
       PAGE
    =========================================== */

    .page{
      max-width:480px;
      margin:0 auto;
      padding:16px 14px 80px;
    }

    .page-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:14px;
    }

    .page-head h2{
      margin:0;
      font-size:18px;
      color:var(--text);
      font-weight:800;
    }

    .page-head span{
      font-size:10px;
      color:var(--muted);
      background:#fff;
      border:1px solid var(--border);
      padding:5px 8px;
      border-radius:999px;
      box-shadow:0 4px 12px rgba(17,24,39,0.04);
    }

    .rate-panel{
      background:#fff;
      border:1px solid var(--border);
      border-radius:16px;
      box-shadow:var(--shadow-soft);
      padding:10px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:12px;
    }

    .rate-left{
      display:flex;
      align-items:center;
      gap:9px;
      min-width:0;
    }

    .rate-dot{
      width:9px;
      height:9px;
      border-radius:50%;
      background:#d1d5db;
      box-shadow:0 0 0 4px rgba(148,163,184,0.08);
      flex-shrink:0;
    }

    .rate-dot.online{
      background:var(--green);
      box-shadow:0 0 0 4px rgba(16,185,129,0.12);
    }

    .rate-dot.error{
      background:var(--red);
      box-shadow:0 0 0 4px rgba(239,68,68,0.12);
    }

    .rate-text{
      font-size:10px;
      color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .mini-btn{
      padding:8px 10px;
      border-radius:10px;
      background:var(--primary-soft);
      color:var(--primary);
      font-size:10px;
      font-weight:700;
      box-shadow:inset 0 0 0 1px rgba(124,58,237,0.08);
      transition:all .2s ease;
    }

    .mini-btn:active{
      transform:scale(.96);
    }

    /* ===========================================
       CLIENT CARD
    =========================================== */

    .account-list{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .client-card{
      background:#fff;
      border:1px solid var(--border);
      border-radius:20px;
      box-shadow:var(--shadow-card);
      padding:12px;
      animation:cardIn .25s ease both;
      transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }

    .client-card:hover{
      transform:translateY(-2px);
      box-shadow:0 12px 26px rgba(17,24,39,0.07);
      border-color:rgba(124,58,237,0.18);
    }

    .client-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .client-info{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
      flex:1;
    }

    .client-avatar{
      width:40px;
      height:40px;
      border-radius:12px;
      background:linear-gradient(135deg, var(--primary), var(--primary-strong));
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:15px;
      font-weight:800;
      box-shadow:0 8px 18px rgba(124,58,237,0.2);
      flex-shrink:0;
    }

    .client-meta{
      min-width:0;
      flex:1;
    }

    .client-name{
      font-size:14px;
      font-weight:800;
      color:var(--text);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .client-summary{
      font-size:9px;
      color:var(--muted);
      margin-top:4px;
    }

    .client-tools{
      display:flex;
      align-items:center;
      gap:6px;
      flex-shrink:0;
    }

    .round-btn{
      width:32px;
      height:32px;
      border-radius:10px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:16px;
      transition:all .2s ease;
      box-shadow:inset 0 0 0 1px rgba(124,58,237,0.08);
    }

    .round-btn.primary{
      background:var(--primary-soft);
      color:var(--primary);
    }

    .round-btn.danger{
      background:var(--red-soft);
      color:var(--red);
    }

    .round-btn:active{
      transform:scale(.96);
    }

    .balance-pill{
      margin-top:12px;
      border-radius:12px;
      padding:10px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      font-size:10px;
      font-weight:700;
      border:1px solid transparent;
    }

    .balance-pill.positive{
      background:var(--green-soft);
      border-color:rgba(16,185,129,0.12);
      color:#047857;
    }

    .balance-pill.negative{
      background:var(--red-soft);
      border-color:rgba(239,68,68,0.12);
      color:#b91c1c;
    }

    .balance-pill.zero{
      background:#f8fafc;
      border-color:#edf2f7;
      color:#475569;
    }

    .balance-value{
      direction:ltr;
      font-weight:800;
      text-align:left;
      font-size:10px;
      white-space:nowrap;
    }

    .transactions-box{
      margin-top:10px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .tx-row{
      background:linear-gradient(180deg,#fafafa,#f7f7f9);
      border:1px solid #f1f1f1;
      border-radius:14px;
      padding:10px;
      transition:all .2s ease;
      animation:cardIn .2s ease both;
    }

    .tx-row:active{
      transform:scale(.99);
    }

    .tx-main{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .tx-left{
      display:flex;
      align-items:center;
      gap:8px;
      min-width:0;
      flex:1;
    }

    .tx-icon{
      width:30px;
      height:30px;
      border-radius:9px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:13px;
      flex-shrink:0;
    }

    .tx-icon.in{
      background:var(--green-soft);
      color:var(--green);
    }

    .tx-icon.out{
      background:var(--red-soft);
      color:var(--red);
    }

    .tx-meta{
      min-width:0;
      flex:1;
    }

    .tx-label{
      font-size:10px;
      font-weight:800;
      color:#374151;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .tx-date{
      font-size:8px;
      color:var(--muted);
      margin-top:3px;
    }

    .tx-amount{
      direction:ltr;
      font-size:11px;
      font-weight:900;
      white-space:nowrap;
      text-align:left;
    }

    .tx-amount.in{
      color:var(--green);
    }

    .tx-amount.out{
      color:var(--red);
    }

    .tx-foot{
      margin-top:8px;
      padding-top:8px;
      border-top:1px dashed #e5e7eb;
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:10px;
    }

    .tx-detail{
      color:var(--muted);
      font-size:8px;
      line-height:1.7;
      min-width:0;
      flex:1;
    }

    .tx-action-wrap{
      display:flex;
      align-items:center;
      gap:5px;
      flex-shrink:0;
    }

    .tx-action{
      width:28px;
      height:28px;
      border-radius:8px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:11px;
      transition:all .2s ease;
    }

    .tx-action.edit{
      background:var(--blue-soft);
      color:var(--blue);
    }

    .tx-action.delete{
      background:var(--red-soft);
      color:var(--red);
    }

    .tx-action:active{
      transform:scale(.96);
    }

    .empty-box{
      text-align:center;
      padding:28px 18px;
      border:1px dashed #d7d8dc;
      background:#fff;
      border-radius:16px;
      color:var(--muted);
    }

    .empty-box .empty-icon{
      font-size:34px;
      margin-bottom:8px;
    }

    .empty-box h3{
      margin:0 0 6px;
      font-size:15px;
      color:#374151;
      font-weight:800;
    }

    .empty-box p{
      margin:0;
      font-size:10px;
      line-height:1.8;
    }

    /* ===========================================
       FAB
    =========================================== */

    .fab{
      position:fixed;
      right:18px;
      bottom:78px;
      width:54px;
      height:54px;
      border-radius:50%;
      background:linear-gradient(135deg, var(--primary), var(--primary-strong));
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:26px;
      font-weight:700;
      box-shadow:0 10px 24px rgba(124,58,237,0.28);
      z-index:50;
      transition:all .2s ease;
    }

    .fab:active{
      transform:scale(.96);
    }

    /* ===========================================
       MODAL
    =========================================== */

    .modal-backdrop{
      position:fixed;
      inset:0;
      z-index:90;
      background:rgba(15,23,42,0.32);
      backdrop-filter:blur(4px);
      -webkit-backdrop-filter:blur(4px);
      display:none;
      align-items:flex-end;
      justify-content:center;
      padding:10px;
    }

    .modal-backdrop.show{
      display:flex;
      animation:modalIn .18s ease;
    }

    .modal{
      width:100%;
      max-width:450px;
      background:#fff;
      border:1px solid var(--border);
      border-radius:22px 22px 16px 16px;
      box-shadow:var(--shadow-modal);
      padding:16px 16px 18px;
      max-height:92vh;
      overflow:auto;
      animation:slideUp .22s ease;
    }

    .modal-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:14px;
    }

    .modal-head h3{
      margin:0;
      color:var(--primary);
      font-size:16px;
      font-weight:800;
    }

    .close-btn{
      width:32px;
      height:32px;
      border-radius:10px;
      background:#f3f4f6;
      color:#475569;
      font-size:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:all .2s ease;
    }

    .close-btn:active{
      transform:scale(.96);
    }

    .field{
      margin-bottom:12px;
    }

    .field label{
      display:block;
      font-size:10px;
      font-weight:800;
      color:var(--muted);
      margin-bottom:6px;
    }

    .input, .select, .textarea{
      width:100%;
      background:#fff;
      border:1px solid #dfe3e8;
      border-radius:12px;
      padding:12px 12px;
      color:var(--text);
      font-size:12px;
      outline:none;
      transition:all .2s ease;
    }

    .input:focus, .select:focus, .textarea:focus{
      border-color:var(--primary);
      box-shadow:0 0 0 3px rgba(124,58,237,0.12);
      background:#fff;
    }

    .textarea{
      min-height:78px;
      resize:vertical;
    }

    .two-col{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:9px;
    }

    .direction-box{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }

    .direction-option{
      background:#fff;
      border:1px solid #dfe3e8;
      border-radius:12px;
      padding:10px 8px;
      text-align:center;
      color:#374151;
      font-size:10px;
      font-weight:700;
      transition:all .2s ease;
      cursor:pointer;
    }

    .direction-option input{
      display:none;
    }

    .direction-option.selected.in{
      background:var(--green-soft);
      border-color:rgba(16,185,129,0.3);
      color:#047857;
    }

    .direction-option.selected.out{
      background:var(--red-soft);
      border-color:rgba(239,68,68,0.3);
      color:#b91c1c;
    }

    .summary-box{
      background:linear-gradient(180deg, var(--primary-soft), #f8f5ff);
      border:1px solid rgba(124,58,237,0.14);
      border-radius:14px;
      padding:12px;
      margin-top:8px;
    }

    .summary-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      padding-top:6px;
      margin-top:6px;
      border-top:1px dashed rgba(124,58,237,0.16);
    }

    .summary-row:first-child{
      border-top:0;
      margin-top:0;
      padding-top:0;
    }

    .summary-label{
      font-size:9px;
      color:var(--muted);
    }

    .summary-value{
      font-size:12px;
      color:var(--primary-strong);
      font-weight:900;
      direction:ltr;
      text-align:left;
    }

    .modal-actions{
      display:flex;
      gap:8px;
      margin-top:14px;
    }

    .primary-btn, .secondary-btn, .danger-btn{
      flex:1;
      padding:12px 10px;
      border-radius:12px;
      font-size:11px;
      font-weight:800;
      transition:all .2s ease;
    }

    .primary-btn{
      background:linear-gradient(135deg, var(--primary), var(--primary-strong));
      color:#fff;
      box-shadow:0 8px 18px rgba(124,58,237,0.2);
    }

    .secondary-btn{
      background:#f3f4f6;
      color:#374151;
    }

    .danger-btn{
      background:var(--red-soft);
      color:var(--red);
    }

    .primary-btn:disabled{
      opacity:.5;
      cursor:not-allowed;
      box-shadow:none;
    }

    .primary-btn:active, .secondary-btn:active, .danger-btn:active{
      transform:scale(.98);
    }

    /* ===========================================
       TOAST
    =========================================== */

    .toast-container{
      position:fixed;
      left:12px;
      right:12px;
      bottom:78px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:8px;
      z-index:120;
      pointer-events:none;
    }

    .toast{
      max-width:420px;
      width:100%;
      border-radius:12px;
      padding:11px 14px;
      background:#1f2937;
      color:#fff;
      font-size:10px;
      text-align:center;
      box-shadow:0 12px 26px rgba(17,24,39,0.18);
      border:1px solid rgba(55,65,81,0.9);
      animation:toastIn .2s ease;
      transition:all .2s ease;
    }

    .toast.success{
      background:linear-gradient(135deg, var(--primary), var(--primary-strong));
    }

    .toast.error{
      background:linear-gradient(135deg, #ef4444, #dc2626);
    }

    /* ===========================================
       BOTTOM NAV
    =========================================== */

    .bottom-nav{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      height:62px;
      background:rgba(255,255,255,0.96);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      border-top:1px solid var(--border);
      z-index:60;
      box-shadow:0 -5px 20px rgba(15,23,42,0.06);
    }

    .bottom-nav-inner{
      max-width:480px;
      margin:0 auto;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:space-around;
    }

    .nav-item{
      width:50%;
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:2px;
      color:#9ca3af;
      transition:all .2s ease;
      padding:6px 4px;
    }

    .nav-item .nav-ico{
      font-size:18px;
      line-height:1;
    }

    .nav-item span:last-child{
      font-size:8px;
      font-weight:700;
    }

    .nav-item.active{
      color:var(--primary);
      background:linear-gradient(180deg, rgba(124,58,237,0.04), rgba(124,58,237,0.01));
    }

    .nav-item:active{
      transform:scale(.98);
    }

    /* ===========================================
       ANIMATIONS
    =========================================== */

    @keyframes cardIn{
      from{
        opacity:0;
        transform:translateY(8px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes slideUp{
      from{
        opacity:0;
        transform:translateY(30px) scale(.98);
      }
      to{
        opacity:1;
        transform:translateY(0) scale(1);
      }
    }

    @keyframes modalIn{
      from{
        opacity:0;
      }
      to{
        opacity:1;
      }
    }

    @keyframes toastIn{
      from{
        opacity:0;
        transform:translateY(12px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @media (max-width:390px){
      .page{
        padding-left:12px;
        padding-right:12px;
      }

      .brand-text p{
        display:none;
      }

      .client-card{
        border-radius:16px;
      }

      .tx-row{
        padding:9px;
      }

      .fab{
        width:52px;
        height:52px;
      }
    }
  </style>
</head>
<body>

  <div class="app-shell">

    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand-wrap">
          <div class="brand-icon">💱</div>
          <div class="brand-text">
            <h1 data-i18n="dailyAccounting">Daily Accounting</h1>
            <p data-i18n="transactionManagement">مدیریت معاملات و حساب مشتریان</p>
          </div>
        </div>

        <button class="header-action" onclick="refreshRates()" title="بروزرسانی نرخ" data-i18n-title="refreshRates">↻</button>
      </div>
    </header>

    <main class="page">

      <div class="page-head">
        <h2 data-i18n="transactions">معاملات</h2>

  <script>
    const SUPABASE_URL = "https://hvsymjkbmpmvjycwenbd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_9pkhkb88LNXJw457Sx8dpA_0E231JwH";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let appData = { clients: [] };
    let liveRates = null;
    let editingTransaction = null;
    let selectedDirection = "in";
    let confirmCallback = null;

    function pageT(key, fallback){
      try{
        if(window.DailyTranslator && typeof window.DailyTranslator.t === "function"){
          const value = window.DailyTranslator.t(key);
          if(value && value !== key) return value;
        }
      }catch(e){}
      return fallback || key;
    }

    function applyPageLanguage(){
      try{
        if(window.DailyTranslator && typeof window.DailyTranslator.applyGlobalSettings === "function"){
          window.DailyTranslator.applyGlobalSettings();
        }
        if(window.DailyTranslator && typeof window.DailyTranslator.translatePage === "function"){
          window.DailyTranslator.translatePage();
        }
      }catch(e){}
    }

    function getSelectedBaseCurrency(){
      try{
        if(window.DailyTranslator && typeof window.DailyTranslator.getBaseCurrency === "function"){
          const value = window.DailyTranslator.getBaseCurrency();
          if(typeof value === "string" && value.trim()) return value.trim().toUpperCase();
          if(value && typeof value === "object"){
            const code = value.code || value.currency || value.currencyCode;
            if(code) return String(code).trim().toUpperCase();
          }
        }
      }catch(e){}

      try{
        if(window.DailyTranslator && typeof window.DailyTranslator.getCurrencyCode === "function"){
          const code = window.DailyTranslator.getCurrencyCode();
          if(code) return String(code).trim().toUpperCase();
        }
      }catch(e){}

      return "AFN";
    }

    function getSelectedBaseCurrencyName(){
      const code = getSelectedBaseCurrency();
      const names = {
        AFN:"افغانی",
        USD:"دلار",
        EUR:"یورو",
        IRR:"ریال ایران",
        TRY:"لیر ترکیه",
        SAR:"ریال سعودی",
        AED:"درهم امارات",
        GBP:"پوند",
        CAD:"دلار کانادا",
        AUD:"دلار استرالیا",
        CHF:"فرانک سوئیس",
        INR:"روپیه هند",
        PKR:"روپیه پاکستان",
        CNY:"یوان چین",
        RUB:"روبل روسیه",
        JPY:"ین ژاپن",
        TOMAN:"تومان"
      };
      return names[code] || code;
    }

    function getLiveRate(fromCurrency, toCurrency){
      const from = String(fromCurrency || "AFN").trim().toUpperCase();
      const to = String(toCurrency || getSelectedBaseCurrency()).trim().toUpperCase();

      if(from === to) return 1;

      if(window.CinaSarafi && typeof window.CinaSarafi.getSarafiRate === "function"){
        try{
          const rate = window.CinaSarafi.getSarafiRate(from, to);
          if(rate !== null && Number.isFinite(Number(rate)) && Number(rate) > 0){
            return Number(rate);
          }
        }catch(e){}
      }

      if(!liveRates) return null;

      const fromRate = from === "AFN" ? 1 : getRateForCurrency(from);
      const toRate = to === "AFN" ? 1 : getRateForCurrency(to);

      if(fromRate === null || toRate === null || !Number.isFinite(Number(fromRate)) || !Number.isFinite(Number(toRate)) || Number(fromRate) <= 0 || Number(toRate) <= 0){
        return null;
      }

      return Number(fromRate) / Number(toRate);
    }

    function convertLiveCurrency(amount, fromCurrency, toCurrency){
      const number = Number(amount);
      if(!Number.isFinite(number)) return null;
      const rate = getLiveRate(fromCurrency, toCurrency);
      if(rate === null || !Number.isFinite(rate)) return null;
      return number * rate;
    }

    function updateCurrencyInterface(){
      const base = getSelectedBaseCurrency();
      const baseName = getSelectedBaseCurrencyName();

      const rateLabel = document.getElementById("rateLabel");
      if(rateLabel) rateLabel.textContent = `${pageT("todayRate","نرخ امروز")} به ${base}`;

      const equivalentLabel = document.getElementById("baseEquivalentLabel");
      if(equivalentLabel) equivalentLabel.textContent = `${pageT("equivalent","معادل")} ${baseName} (${base})`;

      const afnLabel = document.getElementById("afnTotalLabel");
      if(afnLabel) afnLabel.textContent = pageT("transactionValueAFN","ارزش ثبت‌شده به افغانی");

      const status = document.getElementById("rateStatus");
      if(status && liveRates){
        status.textContent = `${pageT("ratesOnline","نرخ اسعار آنلاین است")} • ${base}`;
      }
    }

    window.addEventListener("storage", async (event) => {
      if(event.key === "dailyAccountingSettings"){
        applyPageLanguage();
        updateCurrencyInterface();
        await refreshRates();
        renderClients();
      }
    });

    window.addEventListener("dailyAccountingSettingsChanged", async () => {
      applyPageLanguage();
      updateCurrencyInterface();
      await refreshRates();
      renderClients();
    });

    window.addEventListener("dailyAccountingCurrencyChanged", async () => {
      applyPageLanguage();
      updateCurrencyInterface();
      await refreshRates();
      renderClients();
      calculateTransaction();
    });

    window.addEventListener("dailyAccountingCountryChanged", async () => {
      applyPageLanguage();
      updateCurrencyInterface();
      await refreshRates();
      renderClients();
      calculateTransaction();
    });

    const currencyNames = {
      AFN:"افغانی",
      USD:"دلار",
      EUR:"یورو",
      IRR:"ریال ایران",
      TOMAN:"تومان",
      JPY:"ین",
      TRY:"لیر",
      SAR:"ریال سعودی",
      AED:"درهم",
      GBP:"پوند",
      CAD:"دلار کانادا",
      AUD:"دلار استرالیا",
      CHF:"فرانک سوئیس",
      INR:"روپیه هند",
      PKR:"روپیه پاکستان",
      CNY:"یوان چین",
      RUB:"روبل روسیه"
    };

    document.addEventListener("DOMContentLoaded", async () => {
      applyPageLanguage();
      updateCurrencyInterface();
      setToday();
      await checkAuth();
      await refreshRates();
      updateCurrencyInterface();
      renderClients();
    });

    async function checkAuth(){
      const { data, error } = await supabaseClient.auth.getSession();
      if(error){
        console.error(error);
        showToast(pageT("authCheckError","خطا در بررسی حساب"), "error");
        return;
      }

      currentUser = data.session?.user || null;

      if(!currentUser){
        window.location.href = "index.html";
        return;
      }

      await loadData();
    }

    async function loadData(){
      try{
        const { data, error } = await supabaseClient
          .from("exchange_users")
          .select("*")
          .eq("user_id", currentUser.id)
          .maybeSingle();

        if(error) throw error;

        if(data && data.content){
          if(typeof data.content === "string"){
            try{
              appData = JSON.parse(data.content);
            }catch(e){
              appData = { clients: [] };
            }
          }else{
            appData = data.content;
          }
        }

        if(!appData || typeof appData !== "object") appData = {};
        if(!Array.isArray(appData.clients)) appData.clients = [];

        normalizeExistingData();
        renderClients();

      }catch(error){
        console.error(error);
        showToast(pageT("loadDataError","خطا در بارگذاری اطلاعات"), "error");
      }
    }

    function normalizeExistingData(){
      appData.clients.forEach(client => {
        if(!client.id) client.id = createId();
        if(!Array.isArray(client.transactions)) client.transactions = [];
        client.transactions.forEach(tx => {
          if(!tx.id) tx.id = createId();
          if(!tx.currency) tx.currency = "AFN";
          if(!tx.type) tx.type = tx.direction || "in";
          if(tx.amount === undefined) tx.amount = tx.rawAmount || 0;
          if(tx.rawAmount === undefined) tx.rawAmount = tx.amount || 0;
          if(!tx.rawDate) tx.rawDate = tx.date || new Date().toISOString().slice(0,10);
          if(tx.totalAFN === undefined){
            if(tx.amountInBase !== undefined){
              tx.totalAFN = Number(tx.amountInBase) || 0;
            }else{
              tx.totalAFN = 0;
            }
          }
        });
      });
    }

    async function saveData(){
      const { error } = await supabaseClient
        .from("exchange_users")
        .upsert({
          user_id: currentUser.id,
          email: currentUser.email,
          content: appData
        }, { onConflict: "user_id" });

      if(error) throw error;
    }

    function renderClients(){
      const container = document.getElementById("accountsList");
      const count = document.getElementById("clientCount");
      if(!container || !count) return;

      count.textContent = `${appData.clients.length} ${pageT("clients","مشتری")}`;

      if(!appData.clients.length){
        container.innerHTML = `
          <div class="empty-box">
            <div class="empty-icon">👥</div>
            <h3>${pageT("noClients","هنوز مشتری ندارید")}</h3>
            <p>${pageT("addClientHint","از دکمه + برای اضافه کردن مشتری استفاده کنید.")}</p>
          </div>
        `;
        return;
      }

      container.innerHTML = appData.clients.map(client => renderClient(client)).join("");
    }

    function renderClient(client){
      const transactions = Array.isArray(client.transactions) ? client.transactions : [];
      let balanceAFN = 0;

      transactions.forEach(tx => {
        const value = Number(tx.totalAFN) || 0;
        if(tx.type === "in" || tx.direction === "in"){
          balanceAFN += value;
        }else{
          balanceAFN -= value;
        }
      });

      const baseCurrency = getSelectedBaseCurrency();
      const balanceBase = convertLiveCurrency(balanceAFN, "AFN", baseCurrency);

      let balanceClass = "zero";
      let balanceText = pageT("settled","تسویه شده");

      if(balanceAFN > 0.000001){
        balanceClass = "positive";
        balanceText = pageT("clientOwesMe","مشتری به شما باقی دارد");
      }else if(balanceAFN < -0.000001){
        balanceClass = "negative";
        balanceText = pageT("iOweClient","شما به مشتری باقی دارید");
      }

      const avatar = escapeHtml(String(client.name || "?").trim().charAt(0));
      const balanceDisplay = balanceBase === null ? `— ${escapeHtml(baseCurrency)}` : `${formatNumber(Math.abs(balanceBase))} ${escapeHtml(baseCurrency)}`;

      const transactionsHTML = transactions.slice()
        .sort((a,b) => String(b.rawDate || "").localeCompare(String(a.rawDate || "")))
        .map(tx => renderTransaction(client, tx))
        .join("");

      return `
        <section class="client-card">
          <div class="client-top">
            <div class="client-info">
              <div class="client-avatar">${avatar}</div>
              <div class="client-meta">
                <div class="client-name">${escapeHtml(client.name)}</div>
                <div class="client-summary">${transactions.length} ${pageT("transactionsCountWord","معامله")}</div>
              </div>
            </div>

            <div class="client-tools">
              <button class="round-btn primary" onclick="openTransactionModal('${escapeAttribute(client.id)}')" title="${pageT("newTransaction","معامله جدید")}">＋</button>
              <button class="round-btn danger" onclick="askDeleteClient('${escapeAttribute(client.id)}')" title="${pageT("deleteClient","حذف مشتری")}">🗑</button>
            </div>
          </div>

          <div class="balance-pill ${balanceClass}">
            <span>${balanceText}</span>
            <span class="balance-value">${balanceDisplay}</span>
          </div>

          <div class="transactions-box">
            ${transactionsHTML || `
              <div class="empty-box" style="padding:18px 12px;">
                <div class="empty-icon" style="font-size:22px; margin-bottom:6px;">📝</div>
                <p style="margin:0; font-size:9px;">${pageT("noTransactions","هنوز معامله‌ای ثبت نشده است.")}</p>
              </div>
            `}
          </div>
        </section>
      `;
    }

    function renderTransaction(client, tx){
      const isIn = tx.type === "in" || tx.direction === "in";
      const sign = isIn ? "+" : "-";
      const icon = isIn ? "↓" : "↑";
      const currency = String(tx.currency || "AFN").toUpperCase();
      const amount = Number(tx.rawAmount ?? tx.amount ?? 0);
      const date = tx.rawDate || tx.date || "";
      const afnRate = Number(tx.rateAtTransaction) || 0;
      const baseCurrency = getSelectedBaseCurrency();
      const equivalent = convertLiveCurrency(amount, currency, baseCurrency);
      const note = tx.note ? escapeHtml(tx.note) : "";

      let equivalentText = equivalent === null
        ? `${pageT("equivalent","معادل")}: — ${escapeHtml(baseCurrency)}`
        : `${pageT("equivalent","معادل")}: ${formatNumber(equivalent)} ${escapeHtml(baseCurrency)}`;

      return `
        <div class="tx-row">
          <div class="tx-main">
            <div class="tx-left">
              <div class="tx-icon ${isIn ? "in" : "out"}">${icon}</div>
              <div class="tx-meta">
                <div class="tx-label">${isIn ? pageT("clientGaveMe","مشتری به من داد") : pageT("iGaveClient","من به مشتری دادم")}</div>
                <div class="tx-date">${formatDate(date)}</div>
              </div>
            </div>

            <div class="tx-amount ${isIn ? "in" : "out"}">
              ${sign}${formatNumber(amount)} ${escapeHtml(currency)}
            </div>
          </div>

          <div class="tx-foot">
            <div class="tx-detail">
              <strong>${equivalentText}</strong>
              ${afnRate ? ` • ${pageT("rate","نرخ")} ${formatNumber(afnRate)} AFN` : ""}
              ${note ? ` • ${note}` : ""}
            </div>

            <div class="tx-action-wrap">
              <button class="tx-action edit" onclick="editTransaction('${escapeAttribute(client.id)}','${escapeAttribute(tx.id)}')" title="${pageT("edit","ویرایش")}">✎</button>
              <button class="tx-action delete" onclick="askDeleteTransaction('${escapeAttribute(client.id)}','${escapeAttribute(tx.id)}')" title="${pageT("delete","حذف")}">×</button>
            </div>
          </div>
        </div>
      `;
    }

    function openAddClientModal(){
      document.getElementById("clientNameInput").value = "";
      openModal("clientModal");
      setTimeout(() => document.getElementById("clientNameInput").focus(), 100);
    }

    async function saveClient(){
      const input = document.getElementById("clientNameInput");
      const name = input.value.trim();

      if(!name){
        showToast(pageT("enterClientName","نام مشتری را وارد کنید"), "error");
        input.focus();
        return;
      }

      appData.clients.push({
        id: createId(),
        name,
        transactions:[]
      });

      try{
        await saveData();
        closeModal("clientModal");
        renderClients();
        showToast(pageT("clientAdded","مشتری با موفقیت اضافه شد"), "success");
      }catch(error){
        console.error(error);
        appData.clients.pop();
        showToast(pageT("clientSaveFailed","ذخیره مشتری انجام نشد"), "error");
      }
    }

    function askDeleteClient(clientId){
      const client = appData.clients.find(c => c.id === clientId);
      if(!client) return;

      openConfirm(
        pageT("deleteClient","حذف مشتری"),
        `${pageT("deleteClientQuestion","آیا مطمئن هستید که")} «${escapeHtml(client.name)}» ${pageT("deleteClientQuestionEnd","و تمام معاملات او حذف شود؟")}`,
        async () => {
          const old = appData.clients;
          appData.clients = old.filter(c => c.id !== clientId);

          try{
            await saveData();
            renderClients();
            showToast(pageT("clientDeleted","مشتری حذف شد"), "success");
          }catch(error){
            console.error(error);
            appData.clients = old;
            renderClients();
            showToast(pageT("deleteFailed","حذف انجام نشد"), "error");
          }
        }
      );
    }

    async function openTransactionModal(clientId){
      editingTransaction = null;
      document.getElementById("transactionModalTitle").textContent = pageT("newTransaction","معامله جدید");
      fillClientSelect(clientId);
      document.getElementById("transactionAmount").value = "";
      document.getElementById("transactionCurrency").value = "AFN";
      document.getElementById("transactionNote").value = "";
      setToday();
      setDirection("in");
      updateCurrencyInterface();
      openModal("transactionModal");
      await refreshRates();
      calculateTransaction();
    }

    function fillClientSelect(selectedId){
      const select = document.getElementById("transactionClient");
      select.innerHTML = appData.clients.map(client => `
        <option value="${escapeAttribute(client.id)}" ${client.id === selectedId ? "selected" : ""}>
          ${escapeHtml(client.name)}
        </option>
      `).join("");
    }

    function setDirection(direction){
      selectedDirection = direction;

      const inBox = document.getElementById("directionInBox");
      const outBox = document.getElementById("directionOutBox");

      inBox.classList.toggle("selected", direction === "in");
      outBox.classList.toggle("selected", direction === "out");

      const input = document.querySelector(`input[name="direction"][value="${direction}"]`);
      if(input) input.checked = true;
    }

    async function editTransaction(clientId, transactionId){
      const client = appData.clients.find(c => c.id === clientId);
      if(!client) return;

      const tx = client.transactions.find(t => t.id === transactionId);
      if(!tx) return;

      editingTransaction = { clientId, transactionId };

      document.getElementById("transactionModalTitle").textContent = pageT("editTransaction","ویرایش معامله");
      fillClientSelect(clientId);

      document.getElementById("transactionCurrency").value = tx.currency || "AFN";
      document.getElementById("transactionAmount").value = tx.rawAmount ?? tx.amount ?? "";
      document.getElementById("transactionDate").value = tx.rawDate || tx.date || "";
      document.getElementById("transactionNote").value = tx.note || "";

      setDirection(tx.type || tx.direction || "in");
      updateCurrencyInterface();

      openModal("transactionModal");
      await refreshRates();
      calculateTransaction();
    }

    async function saveTransaction(){
      const clientId = document.getElementById("transactionClient").value;
      const currency = document.getElementById("transactionCurrency").value.trim().toUpperCase();
      const amount = Number(document.getElementById("transactionAmount").value);
      const date = document.getElementById("transactionDate").value;
      const note = document.getElementById("transactionNote").value.trim();

      if(!clientId){
        showToast(pageT("selectClient","مشتری را انتخاب کنید"), "error");
        return;
      }

      if(!amount || amount <= 0){
        showToast(pageT("enterAmount","مقدار معامله را وارد کنید"), "error");
        return;
      }

      if(!date){
        showToast(pageT("enterTransactionDate","تاریخ معامله را وارد کنید"), "error");
        return;
      }

      const rate = getRateForCurrency(currency);
      if(rate === null){
        showToast(pageT("rateNotAvailable","نرخ این ارز از API دریافت نشد"), "error");
        return;
      }

      const totalAFN = calculateAFN(amount, rate, currency);
      if(!Number.isFinite(totalAFN)){
        showToast(pageT("rateCalculationFailed","محاسبه نرخ انجام نشد"), "error");
        return;
      }

      const selectedBase = getSelectedBaseCurrency();
      const selectedBaseRate = getLiveRate(currency, selectedBase);
      const amountInSelectedBase = selectedBaseRate === null ? null : amount * selectedBaseRate;

      const tx = {
        id: editingTransaction ? editingTransaction.transactionId : createId(),
        type: selectedDirection,
        direction: selectedDirection,
        currency,
        rawAmount: amount,
        amount,
        rateAtTransaction: rate,
        totalAFN,
        amountInBase: totalAFN,
        baseCurrencyAtTransaction: selectedBase,
        baseRateAtTransaction: selectedBaseRate,
        amountInSelectedBaseAtTransaction: amountInSelectedBase,
        rawDate: date,
        date,
        note,
        rateSource: "sarafi-api.js",
        rateSavedAt: new Date().toISOString()
      };

      const wasEditing = !!editingTransaction;

      try{
        if(wasEditing){
          const client = appData.clients.find(c => c.id === editingTransaction.clientId);
          if(!client) throw new Error("Client not found");

          const index = client.transactions.findIndex(t => t.id === editingTransaction.transactionId);
          if(index === -1) throw new Error("Transaction not found");

          client.transactions[index] = tx;
        }else{
          const client = appData.clients.find(c => c.id === clientId);
          if(!client) throw new Error("Client not found");
          if(!Array.isArray(client.transactions)) client.transactions = [];
          client.transactions.push(tx);
        }

        await saveData();
        editingTransaction = null;
        closeModal("transactionModal");
        renderClients();
        showToast(wasEditing ? pageT("transactionEdited","معامله ویرایش شد") : pageT("transactionSaved","معامله با موفقیت ثبت شد"), "success");

      }catch(error){
        console.error(error);
        showToast(pageT("transactionSaveFailed","ذخیره معامله انجام نشد"), "error");
      }
    }

    function askDeleteTransaction(clientId, transactionId){
      openConfirm(
        pageT("deleteTransaction","حذف معامله"),
        pageT("deleteTransactionQuestion","آیا مطمئن هستید که این معامله حذف شود؟"),
        async () => {
          const client = appData.clients.find(c => c.id === clientId);
          if(!client) return;

          const old = [...client.transactions];
          client.transactions = client.transactions.filter(tx => tx.id !== transactionId);

          try{
            await saveData();
            renderClients();
            showToast(pageT("transactionDeleted","معامله حذف شد"), "success");
          }catch(error){
            console.error(error);
            client.transactions = old;
            renderClients();
            showToast(pageT("transactionDeleteFailed","حذف معامله انجام نشد"), "error");
          }
        }
      );
    }

    async function refreshRates(){
      const dot = document.getElementById("rateDot");
      const status = document.getElementById("rateStatus");
      if(!dot || !status) return null;

      dot.classList.remove("online", "error");
      status.textContent = pageT("loadingRates","در حال دریافت نرخ اسعار...");

      try{
        let rates = null;

        if(window.CinaSarafi && typeof window.CinaSarafi.refreshSarafiRates === "function"){
          rates = await window.CinaSarafi.refreshSarafiRates();
        }else if(typeof getSarafiRates === "function"){
          rates = await getSarafiRates();
        }else{
          throw new Error("Sarafi API function not found");
        }

        if(!rates) throw new Error("API returned empty data");

        liveRates = rates;
        dot.classList.add("online");
        const base = getSelectedBaseCurrency();
        status.textContent = `${pageT("ratesOnline","نرخ اسعار آنلاین است")} • ${base}`;
        updateCurrencyInterface();

        const transactionModal = document.getElementById("transactionModal");
        if(transactionModal && transactionModal.classList.contains("show")){
          calculateTransaction();
        }

        renderClients();
        return rates;

      }catch(error){
        console.error("Rate loading error:", error);
        dot.classList.add("error");
        status.textContent = pageT("ratesFailed","دریافت نرخ اسعار ناموفق بود");
        liveRates = null;
        renderClients();
        return null;
      }
    }

    function getRateForCurrency(currency){
      currency = String(currency || "AFN").trim().toUpperCase();
      if(currency === "AFN") return 1;
      if(!liveRates) return null;

      const aliases = {
        USD:["USD","usd","dollar","dollars","دلار"],
        EUR:["EUR","eur","euro","euros","یورو"],
        IRR:["IRR","irr","rial","iranRial","ریال"],
        TOMAN:["TOMAN","toman","IRAN_TOMAN","تومان"],
        JPY:["JPY","jpy","yen","ین"],
        TRY:["TRY","try","lira","turkishLira","لیر"],
        SAR:["SAR","sar","saudiRiyal","ریال سعودی"],
        AED:["AED","aed","dirham","درهم"],
        GBP:["GBP","gbp","pound","پوند"],
        CAD:["CAD","cad"],
        AUD:["AUD","aud"],
        CHF:["CHF","chf"],
        INR:["INR","inr","rupee","روپیه"],
        PKR:["PKR","pkr"],
        CNY:["CNY","cny","yuan","یوان"],
        RUB:["RUB","rub","ruble","روبل"]
      };

      const found = findCurrencyValue(liveRates, aliases[currency] || [currency]);
      if(found === null) return null;

      const number = Number(found);
      if(!Number.isFinite(number) || number <= 0) return null;

      return number;
    }

    function findCurrencyValue(object, aliases){
      if(object === null || object === undefined) return null;
      if(typeof object !== "object") return null;

      for(const key of Object.keys(object)){
        const value = object[key];
        const normalizedKey = normalizeKey(key);

        for(const alias of aliases){
          const normalizedAlias = normalizeKey(alias);
          if(normalizedKey === normalizedAlias){
            const number = extractNumber(value);
            if(number !== null) return number;
          }
        }
      }

      for(const key of Object.keys(object)){
        const value = object[key];
        if(value && typeof value === "object"){
          const result = findCurrencyValue(value, aliases);
          if(result !== null) return result;
        }
      }

      return null;
    }

    function extractNumber(value){
      if(typeof value === "number") return Number.isFinite(value) ? value : null;
      if(typeof value === "string"){
        const cleaned = value.replace(/,/g,"").replace(/[^\d.-]/g, "");
        if(!cleaned) return null;
        const n = Number(cleaned);
        return Number.isFinite(n) ? n : null;
      }

      if(value && typeof value === "object"){
        const possibleKeys = ["rate","value","price","sell","buy","afn","AFN","rateAfn","afnRate"];
        for(const key of possibleKeys){
          if(value[key] !== undefined){
            const n = extractNumber(value[key]);
            if(n !== null) return n;
          }
        }
      }

      return null;
    }

    function normalizeKey(key){
      return String(key).trim().toLowerCase().replace(/[\s_-]/g, "");
    }

    function calculateTransaction(){
      const currencyElement = document.getElementById("transactionCurrency");
      const amountElement = document.getElementById("transactionAmount");
      if(!currencyElement || !amountElement) return;

      const currency = currencyElement.value.trim().toUpperCase();
      const amount = Number(amountElement.value) || 0;
      const baseCurrency = getSelectedBaseCurrency();
      const afnRate = getRateForCurrency(currency);
      const baseRate = getLiveRate(currency, baseCurrency);

      const rateDisplay = document.getElementById("rateDisplay");
      const baseTotal = document.getElementById("baseTotal");
      const totalDisplay = document.getElementById("afnTotal");
      const saveButton = document.getElementById("saveTransactionBtn");

      if(baseRate === null){
        rateDisplay.textContent = pageT("notReceived","دریافت نشد");
        baseTotal.textContent = `— ${baseCurrency}`;
      }else{
        rateDisplay.textContent = `1 ${currency} = ${formatNumber(baseRate)} ${baseCurrency}`;
        const equivalent = amount * baseRate;
        baseTotal.textContent = `${formatNumber(equivalent)} ${baseCurrency}`;
      }

      if(afnRate === null){
        totalDisplay.textContent = "— AFN";
        saveButton.disabled = true;
        return;
      }

      const total = calculateAFN(amount, afnRate, currency);
      totalDisplay.textContent = `${formatNumber(total)} AFN`;
      saveButton.disabled = false;
    }

    function calculateAFN(amount, rate, currency){
      if(currency === "AFN") return amount;
      return amount * rate;
    }

    function openModal(id){
      const modal = document.getElementById(id);
      if(!modal) return;
      modal.classList.add("show");
      document.body.style.overflow = "hidden";
    }

    function closeModal(id){
      const modal = document.getElementById(id);
      if(!modal) return;
      modal.classList.remove("show");
      if(!document.querySelector(".modal-backdrop.show")){
        document.body.style.overflow = "";
      }
    }

    function openConfirm(title, message, callback){
      document.getElementById("confirmTitle").textContent = title;
      document.getElementById("confirmMessage").innerHTML = message;
      confirmCallback = callback;

      document.getElementById("confirmButton").onclick = async () => {
        closeModal("confirmModal");
        if(confirmCallback){
          const cb = confirmCallback;
          confirmCallback = null;
          await cb();
        }
      };

      openModal("confirmModal");
    }

    document.querySelectorAll(".modal-backdrop").forEach(overlay => {
      overlay.addEventListener("click", (event) => {
        if(event.target === overlay){
          closeModal(overlay.id);
        }
      });
    });

    function setToday(){
      const input = document.getElementById("transactionDate");
      if(!input) return;

      if(!input.value){
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, "0");
        const day = String(now.getDate()).padStart(2, "0");
        input.value = `${year}-${month}-${day}`;
      }
    }

    function formatDate(dateString){
      if(!dateString) return pageT("noDate","بدون تاریخ");

      try{
        const date = new Date(dateString + "T00:00:00");
        const settings = window.DailyTranslator && typeof window.DailyTranslator.getSettings === "function" ? window.DailyTranslator.getSettings() : null;
        const language = settings?.language || "fa";
        const localeMap = { en:"en-US", fa:"fa-AF", ar:"ar", ps:"ps-AF", tr:"tr-TR" };
        return new Intl.DateTimeFormat(localeMap[language] || "fa-AF", { year:"numeric", month:"2-digit", day:"2-digit" }).format(date);
      }catch(e){
        return dateString;
      }
    }

    function showToast(message, type = ""){
      const container = document.getElementById("toastContainer");
      const toast = document.createElement("div");
      toast.className = `toast ${type}`;
      toast.textContent = message;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateY(-8px)";
        setTimeout(() => toast.remove(), 200);
      }, 2800);
    }

    function createId(){
      return Date.now().toString(36) + Math.random().toString(36).substring(2,10);
    }

    function formatNumber(number){
      if(number === null || number === undefined || !Number.isFinite(Number(number))){
        return "0";
      }
      return Number(number).toLocaleString("en-US", { maximumFractionDigits:8 });
    }

    function escapeHtml(value){
      return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function escapeAttribute(value){
      return escapeHtml(value);
    }

    setInterval(async () => {
      await refreshRates();
    }, 60000);

    document.addEventListener("keydown", (event) => {
      if(event.key === "Escape"){
        document.querySelectorAll(".modal-backdrop.show").forEach(modal => closeModal(modal.id));
      }
    });

    setTimeout(() => {
      applyPageLanguage();
      updateCurrencyInterface();
      renderClients();
    }, 100);
  </script>
