<!DOCTYPE html>
<html lang="en" dir="ltr" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Daily Accounting - Transactions</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--primary:#7c3aed;--bg:#0f172a;--card:#1e293b;--text:#f8fafc;--muted:#94a3b8;--border:#334155;--green:#10b981;--red:#ef4444;--radius:16px;}
*{box-sizing:border-box;margin:0;padding:0;font-family:Tahoma,sans-serif;}
body{background:var(--bg);color:var(--text);min-height:100vh;}
.app{width:100%;max-width:1200px;margin:0 auto;min-height:100vh;background:var(--card);display:flex;flex-direction:column;}
header{background:linear-gradient(135deg,#1e293b,#0f172a);padding:14px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
header h1{font-size:18px;color:var(--primary);}
.page{padding:30px;}
.card{background:#0f172a;border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.name{font-size:17px;font-weight:bold;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;text-align:center;}
.stat{background:#1e293b;padding:10px;border-radius:12px;border:1px solid var(--border);}
.stat small{display:block;color:var(--muted);font-size:11px;margin-bottom:4px;}
.fab{position:fixed;right:30px;bottom:30px;width:60px;height:60px;border-radius:50%;background:var(--primary);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 25px #0008;cursor:pointer;z-index:50;}
.smallbtn{padding:5px 9px!important;font-size:10px!important;border-radius:7px!important;cursor:pointer;border:0;color:#fff;}
.green{background:var(--green);} .red{background:var(--red);} .blue{background:#3b82f6;} .primary{background:var(--primary);}
</style>
</head>
<body>
<div class="app">
<header>
<h1 id="header-title">Daily Accounting</h1>
<div>
<button class="smallbtn primary" onclick="window.location.href='profile.html'">Profile</button>
<button class="smallbtn red" onclick="logoutUser()">Logout</button>
</div>
</header>

<main class="page">
<div id="accounts-list"></div>
</main>

<div id="fab" class="fab" onclick="openAddClientPrompt()">+</div>
</div>

<script>
const SUPABASE_URL = 'https://hvsymjkbmpmvjycwenbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_9pkhkb88LNXJw457Sx8dpA_0E231JwH';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let appData = { clients: [] };

async function loadData(){
 const {data:{session}} = await supabaseClient.auth.getSession();
 if(!session){ window.location.href='index.html'; return; }
 currentUser = session.user;
 
 const {data} = await supabaseClient.from('exchange_users').select('*').eq('user_id', currentUser.id).maybeSingle();
 if(data && data.content) appData = data.content;
 renderDashboard();
}

function renderDashboard(){
 const box = document.getElementById('accounts-list');
 box.innerHTML = '';
 if(!appData.clients?.length){
  box.innerHTML = `<div style="text-align:center;color:var(--muted);margin-top:60px;">No accounts registered yet.<br>Click the + button.</div>`;
  return;
 }
 appData.clients.forEach((c, idx)=>{
  box.insertAdjacentHTML('beforeend', `
   <div class="card">
    <div class="card-head">
     <div class="name">${c.name}</div>
     <button class="smallbtn red" onclick="deleteClient('${c.id}')">Delete</button>
    </div>
   </div>
  `);
 });
}

async function openAddClientPrompt(){
 const name = prompt('Enter client name:');
 if(!name) return;
 appData.clients.push({ id: String(Date.now()), name, transactions: [] });
 await supabaseClient.from('exchange_users').upsert({ user_id: currentUser.id, email: currentUser.email, content: appData }, { onConflict: 'user_id' });
 renderDashboard();
}

async function deleteClient(id){
 appData.clients = appData.clients.filter(c => c.id !== id);
 await supabaseClient.from('exchange_users').upsert({ user_id: currentUser.id, email: currentUser.email, content: appData }, { onConflict: 'user_id' });
 renderDashboard();
}

async function logoutUser(){
 await supabaseClient.auth.signOut();
 window.location.href='index.html';
}

window.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
</html>
