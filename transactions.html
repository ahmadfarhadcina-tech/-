<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>معاملات | Daily Accounting</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sarafi-api.js"></script>

<style>
:root{
    --primary:#7c3aed;
    --primary-dark:#5b21b6;
    --primary-light:#f3eefe;
    --primary-soft:#faf8ff;

    --green:#16a34a;
    --green-light:#ecfdf3;

    --red:#dc3545;
    --red-light:#fff1f2;

    --blue:#2563eb;
    --blue-light:#eff6ff;

    --bg:#f7f7f9;
    --card:#ffffff;
    --text:#17171c;
    --muted:#73737d;
    --border:#e8e8ee;

    --shadow:0 7px 24px rgba(20,20,30,.07);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:
        Tahoma,
        Arial,
        "Noto Sans Arabic",
        sans-serif;
}

body{
    padding-bottom:84px;
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

button:active,
.nav-item:active,
.client-card:active,
.transaction-row:active,
.fab:active{
    transform:scale(.96);
}

/* =========================================================
   HEADER
========================================================= */

.top-header{
    position:sticky;
    top:0;
    z-index:30;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
    padding:12px 14px;
}

.header-inner{
    max-width:760px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.brand-icon{
    width:42px;
    height:42px;
    border-radius:13px;
    background:linear-gradient(
        135deg,
        var(--primary),
        #9b6df5
    );
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    box-shadow:
        0 5px 14px rgba(124,58,237,.24);
}

.brand-text h1{
    margin:0;
    font-size:17px;
}

.brand-text p{
    margin:2px 0 0;
    color:var(--muted);
    font-size:11px;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:7px;
}

.icon-btn{
    width:38px;
    height:38px;
    border-radius:12px;
    background:var(--primary-light);
    color:var(--primary);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
    transition:.18s;
}

.icon-btn:hover{
    background:#e9ddff;
}

/* =========================================================
   MAIN
========================================================= */

.container{
    width:100%;
    max-width:760px;
    margin:auto;
    padding:14px;
}

.page-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:4px 0 12px;
}

.page-title h2{
    margin:0;
    font-size:20px;
}

.page-title span{
    font-size:11px;
    color:var(--muted);
}

/* =========================================================
   RATE BAR
========================================================= */

.rate-status{
    background:white;
    border:1px solid var(--border);
    border-radius:15px;
    padding:10px 12px;
    margin-bottom:12px;
    box-shadow:0 4px 14px rgba(0,0,0,.035);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.rate-status-left{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
}

.rate-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#aaa;
    flex:none;
}

.rate-dot.online{
    background:#16a34a;
    box-shadow:
        0 0 0 4px rgba(22,163,74,.12);
}

.rate-dot.error{
    background:var(--red);
}

.rate-status-text{
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.refresh-rate{
    background:var(--primary-light);
    color:var(--primary);
    padding:7px 10px;
    border-radius:9px;
    font-size:11px;
    flex:none;
}

/* =========================================================
   CLIENT CARDS
========================================================= */

.client-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:17px;
    padding:11px;
    margin-bottom:9px;
    box-shadow:var(--shadow);
    transition:.18s;
    animation:fadeUp .25s ease both;
}

.client-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.client-info{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
}

.client-avatar{
    width:40px;
    height:40px;
    border-radius:12px;
    background:linear-gradient(
        135deg,
        var(--primary),
        #9b6df5
    );
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    flex:none;
}

.client-name{
    font-weight:bold;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.client-summary{
    color:var(--muted);
    font-size:10px;
    margin-top:3px;
}

.client-actions{
    display:flex;
    gap:5px;
    flex:none;
}

.small-btn{
    width:31px;
    height:31px;
    border-radius:9px;
    background:var(--primary-light);
    color:var(--primary);
    transition:.16s;
}

.small-btn.delete{
    color:var(--red);
    background:var(--red-light);
}

.client-balance{
    margin-top:9px;
    border-radius:11px;
    padding:8px 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:11px;
}

.client-balance.positive{
    background:var(--green-light);
    color:#15803d;
}

.client-balance.negative{
    background:var(--red-light);
    color:#c52f40;
}

.client-balance.zero{
    background:#f3f3f6;
    color:#687079;
}

.balance-value{
    font-weight:bold;
    direction:ltr;
}

/* =========================================================
   TRANSACTIONS
========================================================= */

.transactions-list{
    margin-top:8px;
}

.transaction-row{
    background:#fafafd;
    border:1px solid #ededf2;
    border-radius:12px;
    padding:9px;
    margin-top:7px;
    transition:.16s;
}

.transaction-main{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
}

.transaction-left{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
}

.transaction-icon{
    width:32px;
    height:32px;
    border-radius:9px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    flex:none;
}

.transaction-icon.in{
    background:#eaf8f0;
    color:#168344;
}

.transaction-icon.out{
    background:var(--red-light);
    color:#c63b4a;
}

.transaction-name{
    font-size:12px;
    font-weight:bold;
}

.transaction-date{
    font-size:9px;
    color:var(--muted);
    margin-top:2px;
}

.transaction-amount{
    direction:ltr;
    text-align:left;
    font-size:12px;
    font-weight:bold;
    white-space:nowrap;
}

.transaction-amount.in{
    color:#168344;
}

.transaction-amount.out{
    color:#c63b4a;
}

.transaction-bottom{
    margin-top:6px;
    padding-top:6px;
    border-top:1px dashed #e4e4eb;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
}

.transaction-meta{
    color:var(--muted);
    font-size:9px;
}

.transaction-buttons{
    display:flex;
    gap:4px;
}

.transaction-mini-btn{
    width:26px;
    height:26px;
    border-radius:7px;
    background:var(--primary-light);
    color:var(--primary);
    font-size:11px;
}

.transaction-mini-btn.delete{
    color:var(--red);
    background:var(--red-light);
}

.empty-transactions{
    padding:12px;
    text-align:center;
    color:#92929b;
    font-size:10px;
}

/* =========================================================
   EMPTY STATE
========================================================= */

.empty-state{
    background:white;
    border:1px dashed #d5d2df;
    border-radius:18px;
    padding:35px 18px;
    text-align:center;
    color:var(--muted);
}

.empty-icon{
    font-size:38px;
    margin-bottom:8px;
}

.empty-state h3{
    margin:0 0 5px;
    font-size:16px;
    color:var(--text);
}

.empty-state p{
    margin:0;
    font-size:11px;
}

/* =========================================================
   FAB
========================================================= */

.fab{
    position:fixed;
    left:18px;
    bottom:88px;
    width:53px;
    height:53px;
    border-radius:17px;
    background:linear-gradient(
        135deg,
        var(--primary),
        #9b6df5
    );
    color:white;
    font-size:26px;
    box-shadow:
        0 10px 25px rgba(124,58,237,.28);
    z-index:40;
    transition:.18s;
}

/* =========================================================
   MODAL
========================================================= */

.modal-overlay{
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(15,10,25,.52);
    backdrop-filter:blur(6px);
    display:none;
    align-items:flex-end;
    justify-content:center;
    padding:0;
}

.modal-overlay.show{
    display:flex;
    animation:fadeIn .18s ease;
}

.modal{
    width:100%;
    max-width:600px;
    max-height:92vh;
    overflow:auto;
    background:white;
    border-radius:24px 24px 0 0;
    padding:17px;
    animation:modalUp .22s ease;
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:14px;
}

.modal-header h3{
    margin:0;
    font-size:17px;
}

.close-btn{
    width:34px;
    height:34px;
    border-radius:10px;
    background:#f1f1f5;
    color:#52605a;
    font-size:18px;
}

.form-group{
    margin-bottom:11px;
}

.form-group label{
    display:block;
    font-size:11px;
    font-weight:bold;
    margin-bottom:5px;
}

.input,
.select,
.textarea{
    width:100%;
    border:1px solid #dfdfe7;
    background:#fafafd;
    border-radius:11px;
    padding:11px 12px;
    outline:none;
    transition:.18s;
    color:var(--text);
    font-size:12px;
}

.input:focus,
.select:focus,
.textarea:focus{
    border-color:var(--primary);
    box-shadow:
        0 0 0 3px rgba(124,58,237,.09);
    background:white;
}

.textarea{
    min-height:70px;
    resize:vertical;
}

.two-cols{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.direction-box{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

.direction-option{
    border:1px solid #dfdfe7;
    background:#fafafd;
    border-radius:11px;
    padding:11px 7px;
    text-align:center;
    font-size:11px;
    transition:.18s;
}

.direction-option.selected.in{
    border-color:#22a75b;
    background:#eaf8f0;
    color:#168344;
}

.direction-option.selected.out{
    border-color:#e06b6b;
    background:var(--red-light);
    color:#c23c3c;
}

.direction-option input{
    display:none;
}

.rate-result{
    background:linear-gradient(
        135deg,
        #f7f3ff,
        #fbfaff
    );
    border:1px solid #e7ddfa;
    border-radius:13px;
    padding:11px;
    margin-top:8px;
}

.rate-result-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
}

.rate-label{
    font-size:10px;
    color:var(--muted);
}

.rate-number{
    direction:ltr;
    font-weight:bold;
    font-size:13px;
    color:var(--primary);
}

.afn-total{
    margin-top:6px;
    padding-top:6px;
    border-top:1px dashed #ddd2f0;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.afn-total span{
    font-size:10px;
    color:var(--muted);
}

.afn-total strong{
    direction:ltr;
    font-size:16px;
    color:var(--primary-dark);
}

.modal-actions{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.primary-btn,
.secondary-btn,
.danger-btn{
    flex:1;
    border-radius:11px;
    padding:11px;
    font-size:12px;
    transition:.18s;
}

.primary-btn{
    background:var(--primary);
    color:white;
    box-shadow:
        0 5px 14px rgba(124,58,237,.18);
}

.secondary-btn{
    background:#f0f0f4;
    color:#53615b;
}

.danger-btn{
    background:var(--red-light);
    color:#c33b3b;
}

.primary-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.loading{
    text-align:center;
    padding:25px;
    color:var(--muted);
    font-size:12px;
}

/* =========================================================
   TOAST
========================================================= */

.toast-container{
    position:fixed;
    top:74px;
    left:12px;
    right:12px;
    z-index:200;
    pointer-events:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:7px;
}

.toast{
    max-width:500px;
    width:100%;
    background:#25232d;
    color:white;
    border-radius:12px;
    padding:11px 13px;
    font-size:11px;
    box-shadow:0 8px 25px rgba(0,0,0,.18);
    animation:toastIn .22s ease;
    text-align:center;
}

.toast.success{
    background:var(--primary);
}

.toast.error{
    background:#c43e3e;
}

/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:50;
    background:rgba(255,255,255,.97);
    backdrop-filter:blur(15px);
    border-top:1px solid var(--border);
    padding:7px 10px calc(
        7px + env(safe-area-inset-bottom)
    );
}

.nav-inner{
    max-width:600px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:6px;
}

.nav-item{
    height:55px;
    border-radius:14px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:3px;
    color:#7a7883;
    text-decoration:none;
    font-size:10px;
    transition:.18s;
}

.nav-item .nav-icon{
    font-size:19px;
    line-height:20px;
}

.nav-item.active{
    background:var(--primary-light);
    color:var(--primary);
    font-weight:bold;
}

/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes fadeIn{
    from{opacity:0}
    to{opacity:1}
}

@keyframes modalUp{
    from{
        transform:translateY(40px);
        opacity:0;
    }
    to{
        transform:translateY(0);
        opacity:1;
    }
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes toastIn{
    from{
        opacity:0;
        transform:translateY(-10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(min-width:700px){

    .modal-overlay{
        align-items:center;
        padding:20px;
    }

    .modal{
        border-radius:22px;
        max-height:88vh;
    }

    .fab{
        left:calc(50% - 350px);
    }
}
</style>
</head>

<body>

<!-- =========================================================
     HEADER
     Profile و Logout عمداً در این صفحه وجود ندارند.
========================================================= -->

<header class="top-header">

    <div class="header-inner">

        <div class="brand">

            <div class="brand-icon">
                💱
            </div>

            <div class="brand-text">

                <h1>
                    Daily Accounting
                </h1>

                <p>
                    مدیریت معاملات و حساب مشتریان
                </p>

            </div>

        </div>

        <div class="header-actions">

            <button
                class="icon-btn"
                onclick="refreshRates()"
                title="بروزرسانی نرخ"
            >
                ↻
            </button>

        </div>

    </div>

</header>


<main class="container">

    <div class="page-title">

        <h2>
            معاملات
        </h2>

        <span id="clientCount">
            0 مشتری
        </span>

    </div>


    <div class="rate-status">

        <div class="rate-status-left">

            <span
                class="rate-dot"
                id="rateDot"
            ></span>

            <span
                class="rate-status-text"
                id="rateStatus"
            >
                در حال دریافت نرخ اسعار...
            </span>

        </div>

        <button
            class="refresh-rate"
            onclick="refreshRates()"
        >
            بروزرسانی
        </button>

    </div>


    <div id="accounts-list">

        <div class="loading">
            در حال بارگذاری حساب‌ها...
        </div>

    </div>

</main>


<button
    class="fab"
    onclick="openAddClientModal()"
>
    +
</button>


<!-- =========================================================
     ADD CLIENT MODAL
========================================================= -->

<div
    class="modal-overlay"
    id="clientModal"
>

    <div class="modal">

        <div class="modal-header">

            <h3>
                افزودن مشتری
            </h3>

            <button
                class="close-btn"
                onclick="closeModal('clientModal')"
            >
                ×
            </button>

        </div>

        <div class="form-group">

            <label>
                نام مشتری
            </label>

            <input
                id="clientNameInput"
                class="input"
                type="text"
                placeholder="مثلاً احمد"
                autocomplete="off"
            >

        </div>

        <div class="modal-actions">

            <button
                class="secondary-btn"
                onclick="closeModal('clientModal')"
            >
                لغو
            </button>

            <button
                class="primary-btn"
                onclick="saveClient()"
            >
                ذخیره مشتری
            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     TRANSACTION MODAL
========================================================= -->

<div
    class="modal-overlay"
    id="transactionModal"
>

    <div class="modal">

        <div class="modal-header">

            <h3 id="transactionModalTitle">
                معامله جدید
            </h3>

            <button
                class="close-btn"
                onclick="closeModal('transactionModal')"
            >
                ×
            </button>

        </div>


        <div class="form-group">

            <label>
                مشتری
            </label>

            <select
                id="transactionClient"
                class="select"
            ></select>

        </div>


        <div class="form-group">

            <label>
                نوع معامله
            </label>

            <div class="direction-box">

                <label
                    class="direction-option selected in"
                    id="directionInBox"
                >

                    <input
                        type="radio"
                        name="direction"
                        value="in"
                        checked
                        onchange="setDirection('in')"
                    >

                    ↓ مشتری به من می‌دهد

                </label>


                <label
                    class="direction-option out"
                    id="directionOutBox"
                >

                    <input
                        type="radio"
                        name="direction"
                        value="out"
                        onchange="setDirection('out')"
                    >

                    ↑ من به مشتری می‌دهم

                </label>

            </div>

        </div>


        <div class="two-cols">

            <div class="form-group">

                <label>
                    پول / ارز
                </label>

                <select
                    id="transactionCurrency"
                    class="select"
                    onchange="calculateTransaction()"
                >

                    <option value="AFN">
                        🇦🇫 افغانی (AFN)
                    </option>

                    <option value="USD">
                        🇺🇸 دلار (USD)
                    </option>

                    <option value="EUR">
                        🇪🇺 یورو (EUR)
                    </option>

                    <option value="IRR">
                        🇮🇷 ریال ایران (IRR)
                    </option>

                    <option value="TOMAN">
                        🇮🇷 تومان (Toman)
                    </option>

                    <option value="JPY">
                        🇯🇵 ین (JPY)
                    </option>

                    <option value="TRY">
                        🇹🇷 لیر ترکیه (TRY)
                    </option>

                    <option value="SAR">
                        🇸🇦 ریال سعودی (SAR)
                    </option>

                    <option value="AED">
                        🇦🇪 درهم (AED)
                    </option>

                    <option value="GBP">
                        🇬🇧 پوند (GBP)
                    </option>

                    <option value="CAD">
                        🇨🇦 دلار کانادا (CAD)
                    </option>

                    <option value="AUD">
                        🇦🇺 دلار استرالیا (AUD)
                    </option>

                    <option value="CHF">
                        🇨🇭 فرانک سوئیس (CHF)
                    </option>

                    <option value="INR">
                        🇮🇳 روپیه هند (INR)
                    </option>

                    <option value="PKR">

/* =========================================================
   AUTH
========================================================= */

async function checkAuth(){

    const {
        data,
        error
    } =
        await supabaseClient.auth.getSession();

    if(error){

        console.error(error);

        showToast(
            "خطا در بررسی حساب",
            "error"
        );

        return;

    }

    currentUser =
        data.session?.user || null;

    if(!currentUser){

        window.location.href =
            "index.html";

        return;

    }

    await loadData();

}


/* =========================================================
   LOAD DATA
========================================================= */

async function loadData(){

    try{

        const {
            data,
            error
        } =
            await supabaseClient
                .from("exchange_users")
                .select("*")
                .eq(
                    "user_id",
                    currentUser.id
                )
                .maybeSingle();

        if(error){
            throw error;
        }

        if(data){

            if(data.content){

                if(
                    typeof data.content ===
                    "string"
                ){

                    try{

                        appData =
                            JSON.parse(
                                data.content
                            );

                    }catch(e){

                        appData = {
                            clients:[]
                        };

                    }

                }else{

                    appData =
                        data.content;

                }

            }

        }

        if(
            !appData ||
            typeof appData !== "object"
        ){

            appData = {};

        }

        if(
            !Array.isArray(
                appData.clients
            )
        ){

            appData.clients = [];

        }

        normalizeExistingData();

        renderClients();

    }catch(error){

        console.error(error);

        showToast(
            "خطا در بارگذاری اطلاعات",
            "error"
        );

    }

}


/* =========================================================
   NORMALIZE OLD DATA
========================================================= */

function normalizeExistingData(){

    appData.clients.forEach(
        client => {

            if(!client.id){

                client.id =
                    createId();

            }

            if(
                !Array.isArray(
                    client.transactions
                )
            ){

                client.transactions = [];

            }

            client.transactions.forEach(
                tx => {

                    if(!tx.id){

                        tx.id =
                            createId();

                    }

                    if(!tx.currency){

                        tx.currency =
                            "AFN";

                    }

                    if(!tx.type){

                        tx.type =
                            tx.direction ||
                            "in";

                    }

                    if(
                        tx.amount ===
                        undefined
                    ){

                        tx.amount =
                            tx.rawAmount ||
                            0;

                    }

                    if(
                        tx.rawAmount ===
                        undefined
                    ){

                        tx.rawAmount =
                            tx.amount ||
                            0;

                    }

                    if(!tx.rawDate){

                        tx.rawDate =
                            tx.date ||
                            new Date()
                                .toISOString()
                                .slice(0,10);

                    }

                    if(
                        tx.totalAFN ===
                        undefined
                    ){

                        if(
                            tx.amountInBase !==
                            undefined
                        ){

                            tx.totalAFN =
                                Number(
                                    tx.amountInBase
                                ) || 0;

                        }else{

                            tx.totalAFN = 0;

                        }

                    }

                }
            );

        }
    );

}


/* =========================================================
   SAVE DATA
========================================================= */

async function saveData(){

    const {
        error
    } =
        await supabaseClient
            .from("exchange_users")
            .upsert(
                {
                    user_id:
                        currentUser.id,

                    email:
                        currentUser.email,

                    content:
                        appData
                },
                {
                    onConflict:
                        "user_id"
                }
            );

    if(error){

        throw error;

    }

}


/* =========================================================
   RENDER CLIENTS
========================================================= */

function renderClients(){

    const container =
        document.getElementById(
            "accounts-list"
        );

    const count =
        document.getElementById(
            "clientCount"
        );

    count.textContent =
        `${appData.clients.length} مشتری`;

    if(
        !appData.clients.length
    ){

        container.innerHTML = `

            <div class="empty-state">

                <div class="empty-icon">
                    👥
                </div>

                <h3>
                    هنوز مشتری ندارید
                </h3>

                <p>
                    از دکمه + برای اضافه کردن مشتری استفاده کنید.
                </p>

            </div>

        `;

        return;

    }

    container.innerHTML =
        appData.clients
            .map(
                client =>
                    renderClient(client)
            )
            .join("");

}


function renderClient(client){

    const transactions =
        Array.isArray(
            client.transactions
        )
            ? client.transactions
            : [];

    let balance = 0;

    transactions.forEach(
        tx => {

            const value =
                Number(
                    tx.totalAFN
                ) || 0;

            if(
                tx.type === "in" ||
                tx.direction === "in"
            ){

                balance += value;

            }else{

                balance -= value;

            }

        }
    );


    let balanceClass =
        "zero";

    let balanceText =
        "تسویه شده";


    if(balance > 0.000001){

        balanceClass =
            "positive";

        balanceText =
            "مشتری به شما باقی دارد";

    }else if(
        balance < -0.000001
    ){

        balanceClass =
            "negative";

        balanceText =
            "شما به مشتری باقی دارید";

    }


    const avatar =
        escapeHtml(
            String(
                client.name || "?"
            )
            .trim()
            .charAt(0)
        );


    const transactionsHTML =
        transactions
            .slice()
            .sort(
                (a,b) =>
                    String(
                        b.rawDate || ""
                    )
                    .localeCompare(
                        String(
                            a.rawDate || ""
                        )
                    )
            )
            .map(
                tx =>
                    renderTransaction(
                        client,
                        tx
                    )
            )
            .join("");


    return `

        <section class="client-card">

            <div class="client-top">

                <div class="client-info">

                    <div class="client-avatar">
                        ${avatar}
                    </div>

                    <div style="min-width:0">

                        <div class="client-name">
                            ${escapeHtml(
                                client.name
                            )}
                        </div>

                        <div class="client-summary">
                            ${transactions.length}
                            معامله
                        </div>

                    </div>

                </div>


                <div class="client-actions">

                    <button
                        class="small-btn"
                        onclick="openTransactionModal('${escapeAttribute(client.id)}')"
                        title="معامله جدید"
                    >
                        ＋
                    </button>

                    <button
                        class="small-btn delete"
                        onclick="askDeleteClient('${escapeAttribute(client.id)}')"
                        title="حذف مشتری"
                    >
                        🗑
                    </button>

                </div>

            </div>


            <div
                class="client-balance ${balanceClass}"
            >

                <span>
                    ${balanceText}
                </span>

                <span class="balance-value">
                    ${formatNumber(
                        Math.abs(balance)
                    )}
                    AFN
                </span>

            </div>


            <div class="transactions-list">

                ${
                    transactionsHTML ||
                    `
                    <div class="empty-transactions">
                        هنوز معامله‌ای ثبت نشده است.
                    </div>
                    `
                }

            </div>

        </section>

    `;

}


/* =========================================================
   RENDER TRANSACTION
========================================================= */

function renderTransaction(
    client,
    tx
){

    const isIn =
        tx.type === "in" ||
        tx.direction === "in";

    const sign =
        isIn ? "+" : "-";

    const icon =
        isIn ? "↓" : "↑";

    const currency =
        tx.currency || "AFN";

    const amount =
        Number(
            tx.rawAmount ??
            tx.amount ??
            0
        );

    const date =
        tx.rawDate ||
        tx.date ||
        "";

    const rate =
        Number(
            tx.rateAtTransaction
        ) || 0;

    const note =
        tx.note
            ? escapeHtml(tx.note)
            : "";


    return `

        <div class="transaction-row">

            <div class="transaction-main">

                <div class="transaction-left">

                    <div
                        class="transaction-icon ${
                            isIn
                                ? "in"
                                : "out"
                        }"
                    >
                        ${icon}
                    </div>

                    <div>

                        <div class="transaction-name">
                            ${
                                isIn
                                    ? "مشتری به من داد"
                                    : "من به مشتری دادم"
                            }
                        </div>

                        <div class="transaction-date">
                            ${formatDate(date)}
                        </div>

                    </div>

                </div>


                <div
                    class="transaction-amount ${
                        isIn
                            ? "in"
                            : "out"
                    }"
                >

                    ${sign}
                    ${formatNumber(amount)}
                    ${escapeHtml(currency)}

                </div>

            </div>


            <div class="transaction-bottom">

                <div class="transaction-meta">

                    ${formatNumber(
                        Number(
                            tx.totalAFN
                        ) || 0
                    )}
                    AFN

                    ${
                        rate
                            ? ` • نرخ ${formatNumber(rate)}`
                            : ""
                    }

                    ${
                        note
                            ? ` • ${note}`
                            : ""
                    }

                </div>


                <div class="transaction-buttons">

                    <button
                        class="transaction-mini-btn"
                        onclick="editTransaction('${escapeAttribute(client.id)}','${escapeAttribute(tx.id)}')"
                        title="ویرایش"
                    >
                        ✎
                    </button>

                    <button
                        class="transaction-mini-btn delete"
                        onclick="askDeleteTransaction('${escapeAttribute(client.id)}','${escapeAttribute(tx.id)}')"
                        title="حذف"
                    >
                        ×
                    </button>

                </div>

            </div>

        </div>

    `;

}

/* =========================================================
   EDIT TRANSACTION
========================================================= */

async function editTransaction(
    clientId,
    transactionId
){

    const client =
        appData.clients.find(
            c =>
                c.id ===
                clientId
        );

    if(!client) return;


    const tx =
        client.transactions.find(
            t =>
                t.id ===
                transactionId
        );

    if(!tx) return;


    editingTransaction = {
        clientId,
        transactionId
    };


    document.getElementById(
        "transactionModalTitle"
    ).textContent =
        "ویرایش معامله";


    fillClientSelect(
        clientId
    );


    document.getElementById(
        "transactionCurrency"
    ).value =
        tx.currency ||
        "AFN";


    document.getElementById(
        "transactionAmount"
    ).value =
        tx.rawAmount ??
        tx.amount ??
        "";


    document.getElementById(
        "transactionDate"
    ).value =
        tx.rawDate ||
        tx.date ||
        "";


    document.getElementById(
        "transactionNote"
    ).value =
        tx.note ||
        "";


    setDirection(
        tx.type ||
        tx.direction ||
        "in"
    );


    openModal(
        "transactionModal"
    );


    await refreshRates();

    calculateTransaction();

}


/* =========================================================
   SAVE TRANSACTION
========================================================= */

async function saveTransaction(){

    const clientId =
        document.getElementById(
            "transactionClient"
        ).value;

    const currency =
        document.getElementById(
            "transactionCurrency"
        ).value;

    const amount =
        Number(
            document.getElementById(
                "transactionAmount"
            ).value
        );

    const date =
        document.getElementById(
            "transactionDate"
        ).value;

    const note =
        document.getElementById(
            "transactionNote"
        ).value.trim();


    if(!clientId){

        showToast(
            "مشتری را انتخاب کنید",
            "error"
        );

        return;

    }


    if(
        !amount ||
        amount <= 0
    ){

        showToast(
            "مقدار معامله را وارد کنید",
            "error"
        );

        return;

    }


    if(!date){

        showToast(
            "تاریخ معامله را وارد کنید",
            "error"
        );

        return;

    }


    const rate =
        getRateForCurrency(
            currency
        );


    if(rate === null){

        showToast(
            "نرخ این ارز از API دریافت نشد",
            "error"
        );

        return;

    }


    const totalAFN =
        calculateAFN(
            amount,
            rate,
            currency
        );


    if(
        !Number.isFinite(
            totalAFN
        )
    ){

        showToast(
            "محاسبه نرخ انجام نشد",
            "error"
        );

        return;

    }


    const tx = {

        id:
            editingTransaction
                ? editingTransaction.transactionId
                : createId(),

        type:
            selectedDirection,

        direction:
            selectedDirection,

        currency:
            currency,

        rawAmount:
            amount,

        amount:
            amount,

        rateAtTransaction:
            rate,

        totalAFN:
            totalAFN,

        amountInBase:
            totalAFN,

        rawDate:
            date,

        date:
            date,

        note:
            note,

        rateSource:
            "sarafi-api.js",

        rateSavedAt:
            new Date()
                .toISOString()

    };


    const wasEditing =
        !!editingTransaction;


    try{

        if(wasEditing){

            const client =
                appData.clients.find(
                    c =>
                        c.id ===
                        editingTransaction.clientId
                );

            if(!client){

                throw new Error(
                    "Client not found"
                );

            }


            const index =
                client.transactions.findIndex(
                    t =>
                        t.id ===
                        editingTransaction.transactionId
                );


            if(index === -1){

                throw new Error(
                    "Transaction not found"
                );

            }


            client.transactions[index] =
                tx;

        }else{

            const client =
                appData.clients.find(
                    c =>
                        c.id ===
                        clientId
                );


            if(!client){

                throw new Error(
                    "Client not found"
                );

            }


            if(
                !Array.isArray(
                    client.transactions
                )
            ){

                client.transactions = [];

            }


            client.transactions.push(
                tx
            );

        }


        await saveData();

        editingTransaction =
            null;

        closeModal(
            "transactionModal"
        );

        renderClients();

        showToast(
            wasEditing
                ? "معامله ویرایش شد"
                : "معامله با موفقیت ثبت شد",
            "success"
        );


    }catch(error){

        console.error(error);

        showToast(
            "ذخیره معامله انجام نشد",
            "error"
        );

    }

}


/* =========================================================
   DELETE TRANSACTION
========================================================= */

function askDeleteTransaction(
    clientId,
    transactionId
){

    openConfirm(
        "حذف معامله",
        "آیا مطمئن هستید که این معامله حذف شود؟",
        async () => {

            const client =
                appData.clients.find(
                    c =>
                        c.id ===
                        clientId
                );

            if(!client) return;


            const old =
                [
                    ...client.transactions
                ];


            client.transactions =
                client.transactions.filter(
                    tx =>
                        tx.id !==
                        transactionId
                );


            try{

                await saveData();

                renderClients();

                showToast(
                    "معامله حذف شد",
                    "success"
                );

            }catch(error){

                console.error(error);

                client.transactions =
                    old;

                renderClients();

                showToast(
                    "حذف معامله انجام نشد",
                    "error"
                );

            }

        }
    );

}


/* =========================================================
   RATE API
========================================================= */

async function refreshRates(){

    const dot =
        document.getElementById(
            "rateDot"
        );

    const status =
        document.getElementById(
            "rateStatus"
        );


    if(!dot || !status){
        return null;
    }


    dot.classList.remove(
        "online",
        "error"
    );


    status.textContent =
        "در حال دریافت نرخ اسعار...";


    try{

        if(
            typeof getSarafiRates !==
            "function"
        ){

            throw new Error(
                "getSarafiRates() not found"
            );

        }


        const rates =
            await getSarafiRates();


        if(!rates){

            throw new Error(
                "API returned empty data"
            );

        }


        liveRates =
            rates;


        dot.classList.add(
            "online"
        );


        status.textContent =
            "نرخ اسعار آنلاین است";


        const transactionModal =
            document.getElementById(
                "transactionModal"
            );


        if(
            transactionModal &&
            transactionModal
                .classList
                .contains("show")
        ){

            calculateTransaction();

        }


        return rates;


    }catch(error){

        console.error(
            "Rate loading error:",
            error
        );


        dot.classList.add(
            "error"
        );


        status.textContent =
            "دریافت نرخ اسعار ناموفق بود";


        liveRates =
            null;


        return null;

    }

}


/* =========================================================
   RATE EXTRACTION
========================================================= */

function getRateForCurrency(
    currency
){

    if(currency === "AFN"){

        return 1;

    }


    if(!liveRates){

        return null;

    }


    const aliases = {

        USD:[
            "USD",
            "usd",
            "dollar",
            "dollars",
            "دلار"
        ],

        EUR:[
            "EUR",
            "eur",
            "euro",
            "euros",
            "یورو"
        ],

        IRR:[
            "IRR",
            "irr",
            "rial",
            "iranRial",
            "ریال"
        ],

        TOMAN:[
            "TOMAN",
            "toman",
            "IRAN_TOMAN",
            "تومان"
        ],

        JPY:[
            "JPY",
            "jpy",
            "yen",
            "ین"
        ],

        TRY:[
            "TRY",
            "try",
            "lira",
            "turkishLira",
            "لیر"
        ],

        SAR:[
            "SAR",
            "sar",
            "saudiRiyal",
            "ریال سعودی"
        ],

        AED:[
            "AED",
            "aed",
            "dirham",
            "درهم"
        ],

        GBP:[
            "GBP",
            "gbp",
            "pound",
            "پوند"
        ],

        CAD:[
            "CAD",
            "cad"
        ],

        AUD:[
            "AUD",
            "aud"
        ],

        CHF:[
            "CHF",
            "chf"
        ],

        INR:[
            "INR",
            "inr",
            "rupee",
            "روپیه"
        ],

        PKR:[
            "PKR",
            "pkr"
        ],

        CNY:[
            "CNY",
            "cny",
            "yuan",
            "یوان"
        ],

        RUB:[
            "RUB",
            "rub",
            "ruble",
            "روبل"
        ]

    };


    const found =
        findCurrencyValue(
            liveRates,
            aliases[currency] ||
            [currency]
        );


    if(found === null){

        return null;

    }


    return Number(found);

}


/* =========================================================
   RECURSIVE API VALUE FINDER
========================================================= */

function findCurrencyValue(
    object,
    aliases
){

    if(
        object === null ||
        object === undefined
    ){

        return null;

    }


    if(
        typeof object !==
        "object"
    ){

        return null;

    }


    for(
        const key of
        Object.keys(object)
    ){

        const value =
            object[key];


        const normalizedKey =
            normalizeKey(key);


        for(
            const alias of
            aliases
        ){

            const normalizedAlias =
                normalizeKey(
                    alias
                );


            if(
                normalizedKey ===
                normalizedAlias
            ){

                const number =
                    extractNumber(
                        value
                    );


                if(number !== null){

                    return number;

                }

            }

        }

    }


    for(
        const key of
        Object.keys(object)
    ){

        const value =
            object[key];


        if(
            value &&
            typeof value ===
            "object"
        ){

            const result =
                findCurrencyValue(
                    value,
                    aliases
                );


            if(result !== null){

                return result;

            }

        }

    }


    return null;

}


function extractNumber(
    value
){

    if(
        typeof value ===
        "number"
    ){

        return Number.isFinite(value)
            ? value
            : null;

    }


    if(
        typeof value ===
        "string"
    ){

        const cleaned =
            value
                .replace(/,/g,"")
                .replace(
                    /[^\d.-]/g,
                    ""
                );


        if(!cleaned){

            return null;

        }


        const n =
            Number(cleaned);


        return Number.isFinite(n)
            ? n
            : null;

    }


    if(
        value &&
        typeof value ===
        "object"
    ){

        const possibleKeys = [

            "rate",
            "value",
            "price",
            "sell",
            "buy",
            "afn",
            "AFN",
            "rateAfn",
            "afnRate"

        ];


        for(
            const key of
            possibleKeys
        ){

            if(
                value[key] !==
                undefined
            ){

                const n =
                    extractNumber(
                        value[key]
                    );


                if(n !== null){

                    return n;

                }

            }

        }

    }


    return null;

}


function normalizeKey(
    key
){

    return String(key)
        .trim()
        .toLowerCase()
        .replace(
            /[\s_-]/g,
            ""
        );

}


/* =========================================================
   CALCULATE
========================================================= */

function calculateTransaction(){

    const currency =
        document.getElementById(
            "transactionCurrency"
        ).value;


    const amount =
        Number(
            document.getElementById(
                "transactionAmount"
            ).value
        ) || 0;


    const rate =
        getRateForCurrency(
            currency
        );


    const rateDisplay =
        document.getElementById(
            "rateDisplay"
        );


    const totalDisplay =
        document.getElementById(
            "afnTotal"
        );


    const saveButton =
        document.getElementById(
            "saveTransactionBtn"
        );


    if(rate === null){

        rateDisplay.textContent =
            "دریافت نشد";


        totalDisplay.textContent =
            "—";


        saveButton.disabled =
            true;


        return;

    }


    saveButton.disabled =
        false;


    rateDisplay.textContent =
        `${formatNumber(rate)} AFN`;


    const total =
        calculateAFN(
            amount,
            rate,
            currency
        );


    totalDisplay.textContent =
        `${formatNumber(total)} AFN`;

}


function calculateAFN(
    amount,
    rate,
    currency
){

    if(currency === "AFN"){

        return amount;

    }


    return amount * rate;

}


/* =========================================================
   MODALS
========================================================= */

function openModal(id){

    const modal =
        document.getElementById(
            id
        );


    if(!modal) return;


    modal.classList.add(
        "show"
    );


    document.body.style.overflow =
        "hidden";

}


function closeModal(id){

    const modal =
        document.getElementById(
            id
        );


    if(!modal) return;


    modal.classList.remove(
        "show"
    );


    if(
        !document.querySelector(
            ".modal-overlay.show"
        )
    ){

        document.body.style.overflow =
            "";

    }

}


/* =========================================================
   CONFIRM
========================================================= */

function openConfirm(
    title,
    message,
    callback
){

    document.getElementById(
        "confirmTitle"
    ).textContent =
        title;


    document.getElementById(
        "confirmMessage"
    ).innerHTML =
        message;


    confirmCallback =
        callback;


    document.getElementById(
        "confirmButton"
    ).onclick =
        async () => {

            closeModal(
                "confirmModal"
            );


            if(confirmCallback){

                const cb =
                    confirmCallback;


                confirmCallback =
                    null;


                await cb();

            }

        };


    openModal(
        "confirmModal"
    );

}


/* =========================================================
   CLOSE MODAL OUTSIDE
========================================================= */

document
    .querySelectorAll(
        ".modal-overlay"
    )
    .forEach(
        overlay => {

            overlay.addEventListener(
                "click",
                event => {

                    if(
                        event.target ===
                        overlay
                    ){

                        closeModal(
                            overlay.id
                        );

                    }

                }
            );

        }
    );


/* =========================================================
   DATE
========================================================= */

function setToday(){

    const input =
        document.getElementById(
            "transactionDate"
        );


    if(!input.value){

        const now =
            new Date();


        const year =
            now.getFullYear();


        const month =
            String(
                now.getMonth() + 1
            )
            .padStart(
                2,
                "0"
            );


        const day =
            String(
                now.getDate()
            )
            .padStart(
                2,
                "0"
            );


        input.value =
            `${year}-${month}-${day}`;

    }

}


function formatDate(
    dateString
){

    if(!dateString){

        return "بدون تاریخ";

    }


    try{

        const date =
            new Date(
                dateString +
                "T00:00:00"
            );


        return new Intl.DateTimeFormat(
            "fa-AF",
            {
                year:"numeric",
                month:"2-digit",
                day:"2-digit"
            }
        ).format(date);


    }catch(e){

        return dateString;

    }

}


/* =========================================================
   TOAST
========================================================= */

function showToast(
    message,
    type = ""
){

    const container =
        document.getElementById(
            "toastContainer"
        );


    const toast =
        document.createElement(
            "div"
        );


    toast.className =
        `toast ${type}`;


    toast.textContent =
        message;


    container.appendChild(
        toast
    );


    setTimeout(
        () => {

            toast.style.opacity =
                "0";

            toast.style.transform =
                "translateY(-8px)";


            setTimeout(
                () =>
                    toast.remove(),
                200
            );

        },
        2800
    );

}


/* =========================================================
   HELPERS
========================================================= */

function createId(){

    return (
        Date.now().toString(36) +
        Math.random()
            .toString(36)
            .substring(2,10)
    );

}


function formatNumber(
    number
){

    if(
        number === null ||
        number === undefined ||
        !Number.isFinite(
            Number(number)
        )
    ){

        return "0";

    }


    return Number(number)
        .toLocaleString(
            "en-US",
            {
                maximumFractionDigits:8
            }
        );

}


function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttribute(
    value
){

    return escapeHtml(
        value
    );

}


/* =========================================================
   PERIODIC RATE UPDATE
========================================================= */

setInterval(

        await refreshRates();
