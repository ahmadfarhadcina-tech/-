<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Transactions | Daily Accounting</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="translator.js"></script>
  <script src="sarafi-api.js"></script>

  <style>
    :root{
      --primary:#7c3aed;
      --primary-dark:#6d28d9;
      --bg:#f7f7f9;
      --card:#ffffff;
      --card2:#f5f3ff;
      --text:#1f2937;
      --muted:#6b7280;
      --border:#e5e7eb;
      --green:#10b981;
      --red:#ef4444;
      --blue:#3b82f6;
      --gold:#f59e0b;
      --radius:13px;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Tahoma,sans-serif;
      -webkit-tap-highlight-color:transparent;
    }

    html,body{
      width:100%;
      min-height:100%;
      background:#f7f7f9;
      color:var(--text);
    }

    body{
      min-height:100vh;
      overflow-x:hidden;
    }

    button,input,select,textarea{
      font:inherit;
    }

    button{
      border:0;
      cursor:pointer;
      width:100%;
      transition:transform .15s ease, filter .15s ease, box-shadow .15s ease;
    }

    button:active{
      transform:scale(.96);
    }

    .app{
      width:100%;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      background:#f7f7f9;
    }

    header{
      background:#fff;
      padding:10px 16px;
      border-bottom:1px solid #e5e7eb;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      z-index:20;
      position:sticky;
      top:0;
      box-shadow:0 1px 5px rgba(0,0,0,.04);
    }

    header h1{
      font-size:16px;
      color:var(--primary);
      font-weight:700;
    }

    .header-controls{
      display:flex;
      align-items:center;
      gap:6px;
    }

    .header-icon-btn{
      width:36px;
      height:36px;
      border-radius:10px;
      background:#f5f3ff;
      color:var(--primary);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:17px;
    }

    .rates{
      background:#fff;
      padding:8px 16px;
      font-size:10px;
      color:#2563eb;
      border-bottom:1px solid #e5e7eb;
      display:flex;
      align-items:center;
      gap:17px;
      overflow-x:auto;
      white-space:nowrap;
      scrollbar-width:none;
      min-height:38px;
    }

    .rates::-webkit-scrollbar{
      display:none;
    }

    .rate-item{
      display:flex;
      align-items:center;
      gap:5px;
      flex-shrink:0;
    }

    .rate-flag{
      font-size:14px;
      line-height:1;
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }

    .rate-code{
      color:#374151;
      font-weight:bold;
    }

    .rate-value{
      color:#2563eb;
    }

    .rate-updated{
      color:#9ca3af;
      font-size:8px;
    }

    .rate-ok{
      color:#10b981;
      font-size:8px;
    }

    .rate-error{
      color:#f59e0b;
      font-size:9px;
    }

    main{
      position:relative;
      flex:1;
      min-height:calc(100vh - 140px);
      padding-bottom:68px;
    }

    .page{
      width:100%;
      min-height:100%;
      padding:16px 16px 27px;
      background:#f7f7f9;
      overflow-y:auto;
    }

    .container{
      max-width:470px;
      margin:0 auto;
      width:100%;
    }

    .top-bar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:9px;
      margin-bottom:14px;
    }

    .top-bar h2{
      font-size:18px;
      color:#1f2937;
      margin:0;
    }

    .client-counter{
      font-size:10px;
      color:#6b7280;
    }

    .status-box{
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:13px;
      padding:9px 12px;
      margin-bottom:12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      box-shadow:0 2px 8px rgba(0,0,0,.045);
    }

    .status-left{
      display:flex;
      align-items:center;
      gap:8px;
      min-width:0;
    }

    .status-dot{
      width:9px;
      height:9px;
      border-radius:50%;
      background:#9ca3af;
      flex-shrink:0;
    }

    .status-dot.online{
      background:var(--green);
      box-shadow:0 0 0 3px rgba(16,185,129,.15);
    }

    .status-dot.error{
      background:var(--red);
      box-shadow:0 0 0 3px rgba(239,68,68,.12);
    }

    .status-text{
      font-size:10px;
      color:#374151;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .mini-btn{
      background:#f5f3ff;
      color:var(--primary);
      border-radius:9px;
      padding:7px 9px;
      width:auto;
      font-size:10px;
      font-weight:600;
    }

    .accounts{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .client-card{
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:15px;
      overflow:hidden;
      box-shadow:0 2px 9px rgba(0,0,0,.045);
      animation:cardIn .25s ease;
    }

    @keyframes cardIn{
      from{opacity:0; transform:translateY(8px) scale(.99);}
      to{opacity:1; transform:none;}
    }

    .client-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:12px 14px;
      border-bottom:1px solid #f0f0f0;
    }

    .client-info{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .client-avatar{
      width:38px;
      height:38px;
      border-radius:10px;
      background:var(--primary);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:bold;
      font-size:14px;
      flex-shrink:0;
    }

    .client-name{
      font-size:14px;
      font-weight:bold;
      color:#1f2937;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .transaction-count{
      font-size:9px;
      color:#9ca3af;
      margin-top:3px;
    }

    .card-actions{
      display:flex;
      align-items:center;
      gap:4px;
      flex-shrink:0;
    }

    .icon-action{
      width:31px;
      height:31px;
      border-radius:9px;
      background:#f5f3ff;
      color:var(--primary);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:14px;
      padding:0;
      width:31px;
    }

    .icon-action.delete{
      background:#fef2f2;
      color:var(--red);
    }

    .client-balance{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      margin:10px 11px 0;
      padding:9px 10px;
      border-radius:10px;
      font-size:10px;
    }

    .client-balance.positive{
      background:#ecfdf5;
      color:#059669;
    }

    .client-balance.negative{
      background:#fef2f2;
      color:#dc2626;
    }

    .client-balance.zero{
      background:#f8fafc;
      color:#6b7280;
    }

    .balance-value{
      text-align:left;
      direction:ltr;
      font-weight:bold;
      font-size:10px;
      white-space:nowrap;
    }

    .transactions{
      border-top:1px solid #f0f0f0;
      margin-top:10px;
    }

    .tx-row{
      padding:10px 13px;
      border-bottom:1px solid #f1f1f1;
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .tx-row:last-child{
      border-bottom:0;
    }

    .tx-main{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
    }

    .tx-direction{
      display:flex;
      align-items:center;
      gap:7px;
      min-width:0;
    }

    .tx-icon{
      width:28px;
      height:28px;
      border-radius:8px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:12px;
      flex-shrink:0;
    }

    .tx-icon.credit{
      background:#ecfdf5;
      color:var(--green);
    }

    .tx-icon.debit{
      background:#fef2f2;
      color:var(--red);
    }

    .tx-type{
      font-size:10px;
      color:#374151;
    }

    .tx-date{
      font-size:8px;
      color:#9ca3af;
      margin-top:3px;
    }

    .tx-amount{
      font-size:10px;
      font-weight:bold;
      direction:ltr;
      white-space:nowrap;
    }

    .tx-amount.credit{
      color:var(--green);
    }

    .tx-amount.debit{
      color:var(--red);
    }

    .tx-bottom{
      margin-top:3px;
      padding-top:7px;
      border-top:1px dashed #e5e7eb;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:7px;
    }

    .tx-meta{
      color:#9ca3af;
      font-size:8px;
      line-height:1.7;
      min-width:0;
    }

    .tx-meta strong{
      font-weight:600;
    }

    .tx-actions{
      display:flex;
      gap:5px;
      flex-shrink:0;
    }

    .tx-action{
      width:27px;
      height:27px;
      border-radius:8px;
      padding:0;
      background:#eff6ff;
      color:#2563eb;
      font-size:11px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .tx-action.delete{
      background:#fef2f2;
      color:var(--red);
    }

    .empty-state{
      background:#fff;
      border:1px dashed #d9d6e2;
      border-radius:14px;
      padding:40px 20px;
      text-align:center;
      color:#6b7280;
    }

    .empty-icon{
      font-size:38px;
      margin-bottom:9px;
    }

    .empty-title{
      margin:0 0 6px;
      font-size:15px;
      color:#374151;
      font-weight:bold;
    }

    .empty-text{
      margin:0;
      font-size:10px;
      line-height:1.8;
    }

    .fab{
      position:fixed;
      right:16px;
      left:auto;
      bottom:74px;
      width:46px;
      height:46px;
      border-radius:50%;
      background:var(--primary);
      color:#fff;
      font-size:25px;
      box-shadow:0 6px 18px rgba(0,0,0,.16);
      z-index:40;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0;
    }

    [dir=rtl] .fab{
      right:auto;
      left:16px;
    }

    .bottom-nav{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      height:60px;
      background:rgba(255,255,255,.97);
      backdrop-filter:blur(12px);
      border-top:1px solid #e5e7eb;
      display:flex;
      justify-content:space-around;
      align-items:center;
      z-index:40;
      box-shadow:0 -2px 10px rgba(0,0,0,.05);
    }

    .nav-inner{
      width:100%;
      display:flex;
      height:100%;
    }

    .nav-item{
      width:50%;
      height:100%;
      background:transparent;
      border-radius:0;
      padding:6px 4px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:2px;
      color:#9ca3af;
      text-decoration:none;
      font-size:8px;
      transition:.18s;
    }

    .nav-item .nav-icon{
      font-size:19px;
      line-height:19px;
    }

    .nav-item.active{
      color:var(--primary);
    }

    .modal-overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.35);
      backdrop-filter:blur(4px);
      display:none;
      align-items:flex-end;
      justify-content:center;
      z-index:1000;
      padding:10px;
    }

    .modal-overlay.show{
      display:flex;
      animation:fadeIn .18s ease;
    }

    @keyframes fadeIn{
      from{opacity:0;}
      to{opacity:1;}
    }

    .modal{
      width:100%;
      max-width:450px;
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:18px 18px 12px 12px;
      padding:18px;
      box-shadow:0 -10px 35px rgba(0,0,0,.15);
      animation:modalUp .25s ease;
      max-height:92vh;
      overflow:auto;
    }

    @keyframes modalUp{
      from{opacity:0; transform:translateY(35px) scale(.97);}
      to{opacity:1; transform:none;}
    }

    .modal-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:14px;
    }

    .modal-header h3{
      margin:0;
      font-size:16px;
      color:var(--primary);
    }

    .close-btn{
      width:31px;
      height:31px;
      border-radius:8px;
      background:#f3f4f6;
      color:#6b7280;
      font-size:17px;
      padding:0;
      width:31px;
    }

    .form-group{
      margin-bottom:11px;
    }

    .form-group label{
      display:block;
      font-size:10px;
      color:#6b7280;
      font-weight:bold;
      margin-bottom:7px;
    }

    .input,.select,.textarea{
      width:100%;
      padding:12px 14px;
      background:#fff;
      border:1px solid #dfe3e8;
      border-radius:12px;
      color:#1f2937;
      font-size:13px;
      outline:none;
      transition:.2s;
    }

    .input:focus,.select:focus,.textarea:focus{
      border-color:var(--primary);
      box-shadow:0 0 0 3px rgba(124,58,237,.08);
    }

    .textarea{
      min-height:70px;
      resize:vertical;
    }

    .direction-box{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:7px;
    }

    .direction-option{
      border:1px solid #dfe3e8;
      background:#fff;
      border-radius:11px;
      padding:10px 7px;
      text-align:center;
      font-size:10px;
      transition:.18s;
      cursor:pointer;
    }

    .direction-option.selected.in{
      border-color:var(--green);
      background:#ecfdf5;
      color:#059669;
    }

    .direction-option.selected.out{
      border-color:var(--red);
      background:#fef2f2;
      color:#dc2626;
    }

    .direction-option input{
      display:none;
    }

    .two-cols{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:9px;
    }

    .rate-result{
      background:#f5f3ff;
      border:1px solid #e9d5ff;
      border-radius:11px;
      padding:10px;
      margin-top:8px;
      margin-bottom:4px;
    }

    .rate-result-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
    }

    .rate-label{
      font-size:9px;
      color:#6b7280;
    }

    .rate-number{
      direction:ltr;
      font-weight:bold;
      font-size:12px;
      color:var(--primary);
      text-align:left;
    }

    .base-equivalent,
    .afn-total{
      margin-top:6px;
      padding-top:6px;
      border-top:1px dashed #ddd2f0;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
    }

    .base-equivalent span,
    .afn-total span{
      font-size:9px;
      color:#6b7280;
    }

    .base-equivalent strong,
    .afn-total strong{
      direction:ltr;
      font-size:14px;
      color:var(--primary-dark);
      text-align:left;
    }

    .modal-actions{
      display:flex;
      gap:7px;
      margin-top:13px;
    }

    .primary-btn,
    .secondary-btn,
    .danger-btn{
      flex:1;
      border-radius:11px;
      padding:11px;
      font-size:11px;
      font-weight:600;
      width:auto;
    }

    .primary-btn{
      background:var(--primary);
      color:#fff;
      box-shadow:0 4px 12px rgba(124,58,237,.28);
    }

    .secondary-btn{
      background:#f3f4f6;
      color:#4b5563;
    }

    .danger-btn{
      background:#fef2f2;
      color:#dc2626;
    }

    .primary-btn:disabled{
      opacity:.5;
      cursor:not-allowed;
    }

    .toast-container{
      position:fixed;
      bottom:75px;
      left:12px;
      right:12px;
      z-index:200;
      pointer-events:none;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:7px;
    }

    .toast{
      max-width:450px;
      width:100%;
      background:#1f2937;
      color:#fff;
      border-radius:10px;
      padding:10px 13px;
      font-size:10px;
      box-shadow:0 8px 25px rgba(0,0,0,.18);
      animation:toastIn .22s ease;
      text-align:center;
      border:1px solid #374151;
    }

    .toast.success{
      background:var(--primary);
    }

    .toast.error{
      background:#dc2626;
    }

    @keyframes toastIn{
      from{opacity:0; transform:translateY(10px);}
      to{opacity:1; transform:translateY(0);}
    }

    .loading{
      text-align:center;
      padding:30px;
      color:#9ca3af;
      font-size:10px;
    }

    @media(max-width:380px){
      .page{padding-left:13px; padding-right:13px;}
      .client-card{border-radius:13px;}
      .tx-row{padding:9px 10px;}
      header{padding-left:13px; padding-right:13px;}
      .top-bar{gap:6px;}
      .client-name{font-size:13px;}
      .balance-value{font-size:9px;}
    }
  </style>
</head>
<body>

  <div class="app">

    <header>
      <h1>Daily Accounting</h1>

      <div class="header-controls">
        <button class="header-icon-btn" type="button" onclick="refreshRates()">↻</button>
      </div>
    </header>

    <div class="rates" id="rates">
      <span class="rate-item">
        <span class="rate-dot status-dot" id="rateDot"></span>
        <span class="status-text" id="rateStatus">🔄 Loading rates...</span>
      </span>
    </div>

    <main>
      <section class="page">
        <div class="container">
          <div class="top-bar">
            <h2>Transactions</h2>
            <span class="client-counter" id="clientCount">0 customers</span>
          </div>

          <div class="status-box">
            <div class="status-left">
              <span class="status-dot" id="rateDotMain"></span>
              <span class="status-text" id="statusText">🔄 Loading rates...</span>
            </div>

            <button class="mini-btn" type="button" onclick="refreshRates()">Update</button>
          </div>

          <div id="accounts-list">
            <div class="loading">Loading accounts...</div>
          </div>
        </div>
      </section>
    </main>

    <button class="fab" type="button" onclick="openAddClientModal()" aria-label="Add client">+</button>

    <nav class="bottom-nav">
      <div class="nav-inner">
        <a href="index.html" class="nav-item">
          <span class="nav-icon">⌂</span>
          <span>Home</span>
        </a>
        <a href="transactions.html" class="nav-item active">
          <span class="nav-icon">⇄</span>
          <span>Transactions</span>
        </a>
      </div>
    </nav>

  </div>

  <div class="modal-overlay" id="clientModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Add Client</h3>
        <button class="close-btn" type="button" onclick="closeModal('clientModal')">×</button>
      </div>

      <div class="form-group">
        <label>Client Name</label>
        <input id="clientNameInput" class="input" type="text" placeholder="e.g. Ahmad" autocomplete="off" />
      </div>

      <div class="modal-actions">
        <button class="secondary-btn" type="button" onclick="closeModal('clientModal')">Cancel</button>
        <button class="primary-btn" type="button" onclick="saveClient()">Save Client</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="transactionModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="transactionModalTitle">New Transaction</h3>
        <button class="close-btn" type="button" onclick="closeModal('transactionModal')">×</button>
      </div>

      <div class="form-group">
        <label>Client</label>
        <select id="transactionClient" class="select"></select>
      </div>

      <div class="form-group">
        <label>Direction</label>

        <div class="direction-box">
          <label class="direction-option selected in" id="directionInBox">
            <input type="radio" name="direction" value="in" checked onchange="setDirection('in')" />
            <span>↓ Client pays me</span>
          </label>

          <label class="direction-option out" id="directionOutBox">
            <input type="radio" name="direction" value="out" onchange="setDirection('out')" />
            <span>↑ I pay client</span>
          </label>
        </div>
      </div>

      <div class="two-cols">
        <div class="form-group">
          <label>Currency</label>
          <select id="transactionCurrency" class="select" onchange="calculateTransaction()">
            <option value="AFN">🇦🇫 Afghani (AFN)</option>
            <option value="USD">🇺🇸 Dollar (USD)</option>
            <option value="EUR">🇪🇺 Euro (EUR)</option>
            <option value="IRR">🇮🇷 Iranian Rial (IRR)</option>
            <option value="TOMAN">🇮🇷 Toman (TOMAN)</option>
            <option value="JPY">🇯🇵 Yen (JPY)</option>

            <option value="SAR">🇸🇦 Saudi Riyal (SAR)</option>

            <option value="INR">🇮🇳 Indian Rupee (INR)</option>
            <option value="PKR">🇵🇰 Pakistani Rupee (PKR)</option>

        <div class="form-group">

  <div class="modal-overlay" id="confirmModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="confirmTitle">Confirm</h3>
        <button class="close-btn" type="button" onclick="closeModal('confirmModal')">×</button>
      </div>

      <p id="confirmMessage" style="font-size:10px; line-height:2; color:#6b7280; margin:0;"></p>

      <div class="modal-actions">
        <button class="secondary-btn" type="button" onclick="closeModal('confirmModal')">Cancel</button>
        <button class="danger-btn" type="button" id="confirmButton">Delete</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    const SUPABASE_URL = "https://hvsymjkbmpmvjycwenbd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_9pkhkb88LNXJw457Sx8dpA_0E231JwH";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let appData = { clients: [] };
    let liveRates = null;
    let editingTransaction = null;
    let selectedDirection = "in";
    let confirmCallback = null;

    function withTimeout(promise, ms = 10000) {
      return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error("Request timeout")), ms))
      ]);
    }

    function showToast(message, type = "") {
      const container = document.getElementById("toastContainer");
      const toast = document.createElement("div");
      toast.className = "toast " + type;
      toast.textContent = message;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateY(-8px)";
        setTimeout(() => toast.remove(), 200);
      }, 2800);
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, function (m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }

    function createId() {
      return (Date.now().toString(36) + Math.random().toString(36).substring(2, 10));
    }

    function formatNumber(number) {
      if (number === null || number === undefined || !Number.isFinite(Number(number))) {
        return "0";
      }
      return Number(number).toLocaleString("en-US", { maximumFractionDigits: 8 });
    }

    function setToday() {
      const input = document.getElementById("transactionDate");
      if (!input) return;
      if (!input.value) {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, "0");
        const day = String(now.getDate()).padStart(2, "0");
        input.value = `${year}-${month}-${day}`;
      }
    }

    function openModal(id) {
      const modal = document.getElementById(id);
      if (!modal) return;
      modal.classList.add("show");
      document.body.style.overflow = "hidden";
    }

    function closeModal(id) {
      const modal = document.getElementById(id);
      if (!modal) return;
      modal.classList.remove("show");
      if (!document.querySelector(".modal-overlay.show")) {
        document.body.style.overflow = "";
      }
    }

    document.querySelectorAll(".modal-overlay").forEach((overlay) => {
      overlay.addEventListener("click", (event) => {
        if (event.target === overlay) closeModal(overlay.id);
      });
    });

    function openConfirm(title, message, callback) {
      document.getElementById("confirmTitle").textContent = title;
      document.getElementById("confirmMessage").innerHTML = message;
      confirmCallback = callback;

      document.getElementById("confirmButton").onclick = async () => {
        closeModal("confirmModal");
        if (confirmCallback) {
          const cb = confirmCallback;
          confirmCallback = null;
          await cb();
        }
      };

      openModal("confirmModal");
    }

    function getSelectedBaseCurrency() {
      try {
        if (window.DailyTranslator && typeof window.DailyTranslator.getBaseCurrency === "function") {
          const value = window.DailyTranslator.getBaseCurrency();
          if (typeof value === "string" && value.trim()) return value.trim().toUpperCase();
          if (value && typeof value === "object") {
            const code = value.code || value.currency || value.currencyCode;
            if (code) return String(code).trim().toUpperCase();
          }
        }
      } catch (e) {}

      try {
        if (window.DailyTranslator && typeof window.DailyTranslator.getCurrencyCode === "function") {
          const code = window.DailyTranslator.getCurrencyCode();
          if (code) return String(code).trim().toUpperCase();
        }
      } catch (e) {}

      return "AFN";
    }

    function getSelectedBaseCurrencyName() {
      const code = getSelectedBaseCurrency();
      const names = {
        AFN: "Afghani",
        USD: "Dollar",
        EUR: "Euro",
        IRR: "Iranian Rial",
        TRY: "Turkish Lira",
        SAR: "Saudi Riyal",
        AED: "UAE Dirham",
        GBP: "Pound",
        CAD: "Canadian Dollar",
        AUD: "Australian Dollar",
        CHF: "Swiss Franc",
        INR: "Indian Rupee",
        PKR: "Pakistani Rupee",
        CNY: "Chinese Yuan",
        RUB: "Russian Ruble",
        JPY: "Japanese Yen",
        TOMAN: "Toman"
      };
      return names[code] || code;
    }

    function normalizeKey(key) {
      return String(key).trim().toLowerCase().replace(/[\s_-]/g, "");
    }

    function extractNumber(value) {
      if (typeof value === "number") return Number.isFinite(value) ? value : null;
      if (typeof value === "string") {
        const cleaned = value.replace(/,/g, "").replace(/[^\d.-]/g, "");
        if (!cleaned) return null;
        const n = Number(cleaned);
        return Number.isFinite(n) ? n : null;
      }
      if (value && typeof value === "object") {
        const possibleKeys = ["rate", "value", "price", "sell", "buy", "afn", "AFN", "rateAfn", "afnRate"];
        for (const key of possibleKeys) {
          if (value[key] !== undefined) {
            const n = extractNumber(value[key]);
            if (n !== null) return n;
          }
        }
      }
      return null;
    }

    function findCurrencyValue(object, aliases) {
      if (object === null || object === undefined) return null;
      if (typeof object !== "object") return null;

      for (const key of Object.keys(object)) {
        const value = object[key];
        const normalizedKey = normalizeKey(key);

        for (const alias of aliases) {
          const normalizedAlias = normalizeKey(alias);
          if (normalizedKey === normalizedAlias) {
            const num = extractNumber(value);
            if (num !== null) return num;
          }
        }
      }

      for (const key of Object.keys(object)) {
        const value = object[key];
        if (value && typeof value === "object") {
          const result = findCurrencyValue(value, aliases);
          if (result !== null) return result;
        }
      }

      return null;
    }

    function getRateForCurrency(currency) {
      currency = String(currency || "AFN").trim().toUpperCase();
      if (currency === "AFN") return 1;
      if (!liveRates) return null;

      const aliases = {
        USD: ["USD", "usd", "dollar", "dollars", "دلار"],
        EUR: ["EUR", "eur", "euro", "euros", "یورو"],
        IRR: ["IRR", "irr", "rial", "iranRial", "ریال"],
        TOMAN: ["TOMAN", "toman", "IRAN_TOMAN", "تومان"],
        JPY: ["JPY", "jpy", "yen", "ین"],
        TRY: ["TRY", "try", "lira", "turkishLira", "لیر"],
        SAR: ["SAR", "sar", "saudiRiyal", "ریال سعودی"],
        AED: ["AED", "aed", "dirham", "درهم"],
        GBP: ["GBP", "gbp", "pound", "پوند"],
        CAD: ["CAD", "cad"],
        AUD: ["AUD", "aud"],
        CHF: ["CHF", "chf"],
        INR: ["INR", "inr", "rupee", "روپیه"],
        PKR: ["PKR", "pkr"],
        CNY: ["CNY", "cny", "yuan", "یوان"],
        RUB: ["RUB", "rub", "ruble", "روبل"]
      };

      const found = findCurrencyValue(liveRates, aliases[currency] || [currency]);
      if (found === null) return null;
      const n = Number(found);
      return Number.isFinite(n) && n > 0 ? n : null;
    }

    function getLiveRate(fromCurrency, toCurrency) {
      const from = String(fromCurrency || "AFN").trim().toUpperCase();
      const to = String(toCurrency || getSelectedBaseCurrency()).trim().toUpperCase();

      if (from === to) return 1;

      if (window.CinaSarafi && typeof window.CinaSarafi.getSarafiRate === "function") {
        try {
          const rate = window.CinaSarafi.getSarafiRate(from, to);
          if (rate !== null && Number.isFinite(Number(rate)) && Number(rate) > 0) return Number(rate);
        } catch (e) {}
      }

      if (!liveRates) return null;

      const fromRate = from === "AFN" ? 1 : getRateForCurrency(from);
      const toRate = to === "AFN" ? 1 : getRateForCurrency(to);

      if (
        fromRate === null ||
        toRate === null ||
        !Number.isFinite(Number(fromRate)) ||
        !Number.isFinite(Number(toRate)) ||
        Number(fromRate) <= 0 ||
        Number(toRate) <= 0
      ) {
        return null;
      }

      return Number(fromRate) / Number(toRate);
    }

    function convertLiveCurrency(amount, fromCurrency, toCurrency) {
      const number = Number(amount);
      if (!Number.isFinite(number)) return null;
      const rate = getLiveRate(fromCurrency, toCurrency);
      if (rate === null || !Number.isFinite(rate)) return null;
      return number * rate;
    }

    function calculateAFN(amount, rate, currency) {
      if (currency === "AFN") return amount;
      return amount * rate;
    }

    function updateCurrencyInterface() {
      const base = getSelectedBaseCurrency();
      const baseName = getSelectedBaseCurrencyName();

      const rateLabel = document.getElementById("rateLabel");
      if (rateLabel) rateLabel.textContent = "Today's rate to " + base;

      const equivalentLabel = document.getElementById("baseEquivalentLabel");
      if (equivalentLabel) equivalentLabel.textContent = "Equivalent " + baseName + " (" + base + ")";

      const afnLabel = document.getElementById("afnTotalLabel");
      if (afnLabel) afnLabel.textContent = "Value in AFN";

      const status = document.getElementById("statusText");
      if (status && liveRates) status.textContent = "Rates are online • " + base;

      const rateStatus = document.getElementById("rateStatus");
      if (rateStatus && liveRates) rateStatus.textContent = "Rates are online • " + base;
    }

    async function refreshRates() {
      const dot = document.getElementById("rateDotMain") || document.getElementById("rateDot");
      const status = document.getElementById("statusText") || document.getElementById("rateStatus");
      if (!dot || !status) return null;

      dot.classList.remove("online", "error");
      status.textContent = "Loading rates...";

      try {
        let rates = null;

        if (window.CinaSarafi && typeof window.CinaSarafi.refreshSarafiRates === "function") {
          rates = await window.CinaSarafi.refreshSarafiRates();
        } else if (typeof getSarafiRates === "function") {
          rates = await getSarafiRates();
        } else {
          throw new Error("Sarafi API function not found");
        }

        if (!rates) throw new Error("API returned empty data");

        liveRates = rates;
        dot.classList.add("online");

        const base = getSelectedBaseCurrency();
        status.textContent = "Rates are online • " + base;
        updateCurrencyInterface();

        if (document.getElementById("transactionModal") && document.getElementById("transactionModal").classList.contains("show")) {
          calculateTransaction();
        }

        renderClients();
        return rates;
      } catch (error) {
        console.error("Rate loading error:", error);
        dot.classList.add("error");
        status.textContent = "Rate fetch failed";
        liveRates = null;
        renderClients();
        return null;
      }
    }

    function calculateTransaction() {
      const currencyElement = document.getElementById("transactionCurrency");
      const amountElement = document.getElementById("transactionAmount");
      const rateDisplay = document.getElementById("rateDisplay");
      const baseTotal = document.getElementById("baseTotal");
      const totalDisplay = document.getElementById("afnTotal");
      const saveButton = document.getElementById("saveTransactionBtn");

      if (!currencyElement || !amountElement) return;

      const currency = currencyElement.value.trim().toUpperCase();
      const amount = Number(amountElement.value) || 0;
      const baseCurrency = getSelectedBaseCurrency();

      const afnRate = getRateForCurrency(currency);
      const baseRate = getLiveRate(currency, baseCurrency);

      if (baseRate === null) {
        rateDisplay.textContent = "Not received";
        baseTotal.textContent = "— " + baseCurrency;
      } else {
        rateDisplay.textContent = "1 " + currency + " = " + formatNumber(baseRate) + " " + baseCurrency;
        const equivalent = amount * baseRate;
        baseTotal.textContent = formatNumber(equivalent) + " " + baseCurrency;
      }

      if (afnRate === null) {
        totalDisplay.textContent = "— AFN";
        saveButton.disabled = true;
        return;
      }

      const total = calculateAFN(amount, afnRate, currency);
      totalDisplay.textContent = formatNumber(total) + " AFN";
      saveButton.disabled = false;
    }

    function normalizeExistingData() {
      appData.clients.forEach((client) => {
        if (!client.id) client.id = createId();
        if (!Array.isArray(client.transactions)) client.transactions = [];

        client.transactions.forEach((tx) => {
          if (!tx.id) tx.id = createId();
          if (!tx.currency) tx.currency = "AFN";
          if (!tx.type) tx.type = tx.direction || "in";
          if (tx.amount === undefined) tx.amount = tx.rawAmount || 0;
          if (tx.rawAmount === undefined) tx.rawAmount = tx.amount || 0;
          if (!tx.rawDate) tx.rawDate = tx.date || new Date().toISOString().slice(0, 10);
          if (tx.totalAFN === undefined) {
            tx.totalAFN = tx.amountInBase !== undefined ? Number(tx.amountInBase) || 0 : 0;
          }
        });
      });
    }

    async function saveData() {
      const { error } = await supabaseClient
        .from("exchange_users")
        .upsert(
          {
            user_id: currentUser.id,
            email: currentUser.email,
            content: appData
          },
          { onConflict: "user_id" }
        );

      if (error) throw error;
    }

    async function checkAuth() {
      const { data, error } = await supabaseClient.auth.getSession();
      if (error) {
        console.error(error);
        showToast("Auth check error", "error");
        return;
      }

      currentUser = data.session?.user || null;
      if (!currentUser) {
        window.location.href = "index.html";
        return;
      }

      await loadData();
    }

    async function loadData() {
      try {
        const { data, error } = await supabaseClient
          .from("exchange_users")
          .select("*")
          .eq("user_id", currentUser.id)
          .maybeSingle();

        if (error) throw error;

        if (data && data.content) {
          if (typeof data.content === "string") {
            try {
              appData = JSON.parse(data.content);
            } catch (e) {
              appData = { clients: [] };
            }
          } else {
            appData = data.content;
          }
        }

        if (!appData || typeof appData !== "object") appData = {};
        if (!Array.isArray(appData.clients)) appData.clients = [];

        normalizeExistingData();
        renderClients();
      } catch (error) {
        console.error(error);
        showToast("Data load failed", "error");
      }
    }

    function renderClients() {
      const container = document.getElementById("accounts-list");
      const count = document.getElementById("clientCount");

      if (!container || !count) return;

      count.textContent = `${appData.clients.length} customers`;

      if (!appData.clients.length) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">👥</div>
            <h3 class="empty-title">No clients yet</h3>
            <p class="empty-text">Use the + button to add a client and begin recording transactions.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = appData.clients.map((client) => renderClient(client)).join("");
    }

    function renderClient(client) {
      const transactions = Array.isArray(client.transactions) ? client.transactions : [];

      let balanceAFN = 0;
      transactions.forEach((tx) => {
        const value = Number(tx.totalAFN) || 0;
        if (tx.type === "in" || tx.direction === "in") {
          balanceAFN += value;
        } else {
          balanceAFN -= value;
        }
      });

      const baseCurrency = getSelectedBaseCurrency();
      const balanceBase = convertLiveCurrency(balanceAFN, "AFN", baseCurrency);

      let balanceClass = "zero";
      let balanceText = "Settled";

      if (balanceAFN > 0.000001) {
        balanceClass = "positive";
        balanceText = "Client owes me";
      } else if (balanceAFN < -0.000001) {
        balanceClass = "negative";
        balanceText = "I owe client";
      }

      const avatar = escapeHtml(String(client.name || "?").trim().charAt(0));
      const balanceDisplay =
        balanceBase === null
          ? `— ${escapeHtml(baseCurrency)}`
          : `${formatNumber(Math.abs(balanceBase))} ${escapeHtml(baseCurrency)}`;

      const transactionsHTML = transactions
        .slice()
        .sort((a, b) => String(b.rawDate || "").localeCompare(String(a.rawDate || "")))
        .map((tx) => renderTransaction(client, tx))
        .join("");

      return `
        <section class="client-card">
          <div class="client-head">
            <div class="client-info">
              <div class="client-avatar">${avatar}</div>
              <div>
                <div class="client-name">${escapeHtml(client.name)}</div>
                <div class="transaction-count">${transactions.length} transactions</div>
              </div>
            </div>

            <div class="card-actions">
              <button class="icon-action" type="button" title="New transaction" onclick="openTransactionModal('${escapeHtml(client.id)}')">＋</button>
              <button class="icon-action delete" type="button" title="Delete client" onclick="askDeleteClient('${escapeHtml(client.id)}')">🗑</button>
            </div>
          </div>

          <div class="client-balance ${balanceClass}">
            <span>${balanceText}</span>
            <span class="balance-value">${balanceDisplay}</span>
          </div>

          <div class="transactions">
            ${
              transactionsHTML || `
                <div class="tx-row">
                  <div class="tx-main">
                    <div class="tx-direction">
                      <div class="tx-icon credit">✓</div>
                      <div>
                        <div class="tx-type">No transactions yet</div>
                        <div class="tx-date">Add a new transaction</div>
                      </div>
                    </div>
                  </div>
                </div>
              `
            }
          </div>
        </section>
      `;
    }

    function renderTransaction(client, tx) {
      const isIn = tx.type === "in" || tx.direction === "in";
      const sign = isIn ? "+" : "-";
      const icon = isIn ? "↓" : "↑";
      const currency = String(tx.currency || "AFN").toUpperCase();
      const amount = Number(tx.rawAmount ?? tx.amount ?? 0);
      const date = tx.rawDate || tx.date || "";
      const baseCurrency = getSelectedBaseCurrency();
      const equivalent = convertLiveCurrency(amount, currency, baseCurrency);
      const note = tx.note ? escapeHtml(tx.note) : "";
      const afnRate = Number(tx.rateAtTransaction) || 0;

      let equivalentText = "";
      if (equivalent === null) {
        equivalentText = `Equivalent: — ${escapeHtml(baseCurrency)}`;
      } else {
        equivalentText = `Equivalent: ${formatNumber(equivalent)} ${escapeHtml(baseCurrency)}`;
      }

      return `
        <div class="tx-row">
          <div class="tx-main">
            <div class="tx-direction">
              <div class="tx-icon ${isIn ? "credit" : "debit"}">${icon}</div>
              <div>
                <div class="tx-type">${isIn ? "Client paid me" : "I paid client"}</div>
                <div class="tx-date">${formatDate(date)}</div>
              </div>
            </div>

            <div class="tx-amount ${isIn ? "credit" : "debit"}">
              ${sign}${formatNumber(amount)} ${escapeHtml(currency)}
            </div>
          </div>

          <div class="tx-bottom">
            <div class="tx-meta">
              <strong>${equivalentText}</strong>
              ${afnRate ? ` • Rate ${formatNumber(afnRate)} AFN` : ""}
              ${note ? ` • ${note}` : ""}
            </div>

            <div class="tx-actions">
              <button class="tx-action" type="button" title="Edit" onclick="editTransaction('${escapeHtml(client.id)}','${escapeHtml(tx.id)}')">✎</button>
              <button class="tx-action delete" type="button" title="Delete" onclick="askDeleteTransaction('${escapeHtml(client.id)}','${escapeHtml(tx.id)}')">×</button>
            </div>
          </div>
        </div>
      `;
    }

    function formatDate(dateString) {
      if (!dateString) return "No date";
      try {
        const date = new Date(dateString + "T00:00:00");
        const settings = window.DailyTranslator && typeof window.DailyTranslator.getSettings === "function" ? window.DailyTranslator.getSettings() : null;
        const language = settings?.language || "fa";
        const localeMap = { en: "en-US", fa: "fa-AF", ar: "ar", ps: "ps-AF", tr: "tr-TR" };
        return new Intl.DateTimeFormat(localeMap[language] || "fa-AF", { year: "numeric", month: "2-digit", day: "2-digit" }).format(date);
      } catch (e) {
        return dateString;
      }
    }

    function fillClientSelect(selectedId) {
      const select = document.getElementById("transactionClient");
      select.innerHTML = appData.clients.map((client) => `
        <option value="${escapeHtml(client.id)}" ${client.id === selectedId ? "selected" : ""}>${escapeHtml(client.name)}</option>
      `).join("");
    }

    function setDirection(direction) {
      selectedDirection = direction;

      const inBox = document.getElementById("directionInBox");
      const outBox = document.getElementById("directionOutBox");

      inBox.classList.toggle("selected", direction === "in");
      outBox.classList.toggle("selected", direction === "out");

      const input = document.querySelector(`input[name="direction"][value="${direction}"]`);
      if (input) input.checked = true;
    }

    function openAddClientModal() {
      document.getElementById("clientNameInput").value = "";
      openModal("clientModal");
      setTimeout(() => document.getElementById("clientNameInput").focus(), 100);
    }

    async function saveClient() {
      const input = document.getElementById("clientNameInput");
      const name = input.value.trim();

      if (!name) {
        showToast("Please enter client name", "error");
        input.focus();
        return;
      }

      appData.clients.push({
        id: createId(),
        name,
        transactions: []
      });

      try {
        await saveData();
        closeModal("clientModal");
        renderClients();
        showToast("Client added successfully", "success");
      } catch (error) {
        console.error(error);
        appData.clients.pop();
        showToast("Client save failed", "error");
      }
    }

    function askDeleteClient(clientId) {
      const client = appData.clients.find((c) => c.id === clientId);
      if (!client) return;

      openConfirm(
        "Delete Client",
        `Are you sure you want to delete <strong>${escapeHtml(client.name)}</strong> and all of their transactions?`,
        async () => {
          const old = appData.clients;
          appData.clients = old.filter((c) => c.id !== clientId);

          try {
            await saveData();
            renderClients();
            showToast("Client deleted", "success");
          } catch (error) {
            console.error(error);
            appData.clients = old;
            renderClients();
            showToast("Delete failed", "error");
          }
        }
      );
    }

    async function openTransactionModal(clientId) {
      editingTransaction = null;

      document.getElementById("transactionModalTitle").textContent = "New Transaction";
      fillClientSelect(clientId);

      document.getElementById("transactionAmount").value = "";
      document.getElementById("transactionCurrency").value = "AFN";
      document.getElementById("transactionNote").value = "";
      setToday();
      setDirection("in");

      openModal("transactionModal");
      await refreshRates();
      calculateTransaction();
    }

    async function editTransaction(clientId, transactionId) {
      const client = appData.clients.find((c) => c.id === clientId);
      if (!client) return;

      const tx = client.transactions.find((t) => t.id === transactionId);
      if (!tx) return;

      editingTransaction = { clientId, transactionId };

      document.getElementById("transactionModalTitle").textContent = "Edit Transaction";
      fillClientSelect(clientId);
      document.getElementById("transactionCurrency").value = tx.currency || "AFN";
      document.getElementById("transactionAmount").value = tx.rawAmount ?? tx.amount ?? "";
      document.getElementById("transactionDate").value = tx.rawDate || tx.date || "";
      document.getElementById("transactionNote").value = tx.note || "";
      setDirection(tx.type || tx.direction || "in");

      openModal("transactionModal");
      await refreshRates();
      calculateTransaction();
    }

    async function saveTransaction() {
      const clientId = document.getElementById("transactionClient").value;
      const currency = document.getElementById("transactionCurrency").value.trim().toUpperCase();
      const amount = Number(document.getElementById("transactionAmount").value);
      const date = document.getElementById("transactionDate").value;
      const note = document.getElementById("transactionNote").value.trim();

      if (!clientId) {
        showToast("Please select a client", "error");
        return;
      }
      if (!amount || amount <= 0) {
        showToast("Please enter amount", "error");
        return;
      }
      if (!date) {
        showToast("Please choose transaction date", "error");
        return;
      }

      const rate = getRateForCurrency(currency);
      if (rate === null) {
        showToast("Currency rate was not received", "error");
        return;
      }

      const totalAFN = calculateAFN(amount, rate, currency);
      if (!Number.isFinite(totalAFN)) {
        showToast("Rate calculation failed", "error");
        return;
      }

      const selectedBase = getSelectedBaseCurrency();
      const selectedBaseRate = getLiveRate(currency, selectedBase);
      const amountInSelectedBase = selectedBaseRate === null ? null : amount * selectedBaseRate;

      const tx = {
        id: editingTransaction ? editingTransaction.transactionId : createId(),
        type: selectedDirection,
        direction: selectedDirection,
        currency,
        rawAmount: amount,
        amount,
        rateAtTransaction: rate,
        totalAFN,
        amountInBase: totalAFN,
        baseCurrencyAtTransaction: selectedBase,
        baseRateAtTransaction: selectedBaseRate,
        amountInSelectedBaseAtTransaction: amountInSelectedBase,
        rawDate: date,
        date,
        note,
        rateSource: "sarafi-api.js",
        rateSavedAt: new Date().toISOString()
      };

      const wasEditing = !!editingTransaction;

      try {
        if (wasEditing) {
          const client = appData.clients.find((c) => c.id === editingTransaction.clientId);
          if (!client) throw new Error("Client not found");

          const index = client.transactions.findIndex((t) => t.id === editingTransaction.transactionId);
          if (index === -1) throw new Error("Transaction not found");

          client.transactions[index] = tx;
        } else {
          const client = appData.clients.find((c) => c.id === clientId);
          if (!client) throw new Error("Client not found");
          if (!Array.isArray(client.transactions)) client.transactions = [];
          client.transactions.push(tx);
        }

        await saveData();
        editingTransaction = null;
        closeModal("transactionModal");
        renderClients();
        showToast(wasEditing ? "Transaction updated" : "Transaction saved successfully", "success");
      } catch (error) {
        console.error(error);
        showToast("Save failed", "error");
      }
    }

    function askDeleteTransaction(clientId, transactionId) {
      openConfirm(
        "Delete Transaction",
        "Are you sure you want to delete this transaction?",
        async () => {
          const client = appData.clients.find((c) => c.id === clientId);
          if (!client) return;

          const old = [...client.transactions];
          client.transactions = client.transactions.filter((tx) => tx.id !== transactionId);

          try {
            await saveData();
            renderClients();
            showToast("Transaction deleted", "success");
          } catch (error) {
            console.error(error);
            client.transactions = old;
            renderClients();
            showToast("Delete failed", "error");
          }
        }
      );
    }

    document.addEventListener("DOMContentLoaded", async () => {
      updateCurrencyInterface();
      setToday();
      await checkAuth();
      await refreshRates();
      renderClients();
    });

    setInterval(async () => {
      await refreshRates();
    }, 60000);

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        document.querySelectorAll(".modal-overlay.show").forEach((modal) => closeModal(modal.id));
      }
    });

    setTimeout(() => {
      updateCurrencyInterface();
      renderClients();
    }, 100);
  </script>
</body>
</html>
