<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه پیشرفته مدیریت معاملات صرافی</title>
    <style>
        /* تنظیمات پایه و متغیرهای رنگی */
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --success: #10b981;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tahoma', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            direction: rtl;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* کانتینر اصلی موبایل‌پسند و مدرن */
        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 850px;
            background: var(--card-bg);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 500px) {
            .app-container {
                border-radius: 24px;
                border: 1px solid var(--border-color);
                height: 90vh;
            }
        }

        /* هدر برنامه */
        .app-header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        .app-header h1 {
            font-size: 18px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 4px;
        }

        .app-header p {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* محتوا */
        .app-content {
            flex: 1;
            position: relative;
            overflow: hidden;
            padding: 20px;
        }

        /* انیمیشن نرم جابه‌جایی صفحات */
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 20px;
            background: var(--card-bg);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            transform: translateX(40px);
            pointer-events: none;
            overflow-y: auto;
        }

        .page.active {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }

        .dashboard-actions {
            margin-bottom: 20px;
        }

        .form-actions {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* استایل دکمه‌ها با انیمیشن‌های نرم کلیک */
        button {
            cursor: pointer;
            border: none;
            padding: 12px 20px;
            border-radius: var(--radius);
            font-size: 15px;
            font-weight: 600;
            width: 100%;
            transition: all 0.25s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
        }

        .btn-success {
            background-color: var(--success);
            color: white;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .btn-success:hover {
            background-color: #059669;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: #475569;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #334155;
        }

        button:active {
            transform: scale(0.97) !important;
        }

        /* فیلدهای ورودی پیشرفته */
        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            color: var(--text-color);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.2);
        }

        /* استایل جدول گزارش معاملات */
        .transactions-section h3 {
            font-size: 15px;
            margin-bottom: 12px;
            color: #e2e8f0;
        }

        .table-responsive {
            max-height: 380px;
            overflow-y: auto;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: right;
        }

        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #0f172a;
            color: var(--text-muted);
            font-weight: 600;
            position: sticky;
            top: 0;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- هدر برنامه -->
        <header class="app-header">
            <h1>سامانه مدیریت معاملات</h1>
            <p>سیستم چندارزی امن و پیشرفته</p>
        </header>

        <!-- محتوای اصلی صفحات -->
        <main class="app-content">
            
            <!-- صفحه اول: داشبورد و لیست تراکنش‌ها -->
            <div id="home-page" class="page active">
                <div class="dashboard-actions">
                    <button class="btn-primary" onclick="switchPage('transaction-page')">
                        <span>+ ثبت معامله جدید</span>
                    </button>
                </div>

                <div class="transactions-section">
                    <h3>لیست معاملات ثبت شده</h3>
                    <div class="table-responsive">
                        <table id="transactions-table">
                            <thead>
                                <tr>
                                    <th>نام مشتری</th>
                                    <th>واحد پول</th>
                                    <th>مبلغ</th>
                                    <th>تاریخ و ساعت</th>
                                </tr>
                            </thead>
                            <tbody id="transaction-list-body">
                                <!-- معاملات به صورت پویا اینجا اضافه می‌شوند -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- صفحه دوم: فرم ثبت معامله پیشرفته -->
            <div id="transaction-page" class="page">
                <div class="form-card">
                    <h2>ثبت معامله جدید</h2>
                    
                    <div class="input-group">
                        <label for="client-name">نام شخص / مشتری</label>
                        <input type="text" id="client-name" placeholder="مثلاً: احمد رضایی">
                    </div>

                    <div class="input-group">
                        <label for="currency-type">انتخاب واحد پول</label>
                        <select id="currency-type">
                            <option value="USD">دلار آمریکا (USD)</option>
                            <option value="AFN">افغانی (AFN)</option>
                            <option value="IRT">تومان ایران (IRT)</option>
                            <option value="EUR">یورو (EUR)</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="amount">مقدار مبلغ</label>
                        <input type="number" id="amount" placeholder="مقدار عددی را وارد کنید...">
                    </div>

                    <div class="form-actions">
                        <button class="btn-success" onclick="saveTransaction()">ذخیره معامله</button>
                        <button class="btn-secondary" onclick="switchPage('home-page')">بازگشت به صفحه اصلی</button>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script>
        // بارگذاری اولیه داده‌ها از حافظه مرورگر به محض باز شدن برنامه
        document.addEventListener('DOMContentLoaded', () => {
            loadTransactions();
        });

        // تابع سوئیچ کردن بین صفحات با انیمیشن نرم
        function switchPage(pageId) {
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => {
                page.classList.remove('active');
            });

            const targetPage = document.getElementById(pageId);
            if (targetPage) {
                targetPage.classList.add('active');
            }
        }

        // تابع ثبت معامله و ذخیره در LocalStorage
        function saveTransaction() {
            const clientNameInput = document.getElementById('client-name');
            const currencySelect = document.getElementById('currency-type');
            const amountInput = document.getElementById('amount');

            const clientName = clientNameInput.value.trim();
            const currency = currencySelect.value;
            const amount = amountInput.value.trim();

            // بررسی خالی نبودن فیلدها
            if (!clientName || !amount) {
                alert('لطفاً نام مشتری و مبلغ را به درستی وارد کنید.');
                return;
            }

            // ساخت شیء معامله جدید همراه با تاریخ و ساعت دقیق
            const now = new Date();
            const timeString = now.toLocaleDateString('fa-IR') + ' - ' + now.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });

            const transaction = {
                id: Date.now(),
                name: clientName,
                currency: currency,
                amount: Number(amount).toLocaleString(),
                date: timeString
            };

            // دریافت لیست قبلی از حافظه مرورگر
            let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
            
            // اضافه کردن معامله جدید به ابتدای لیست
            transactions.unshift(transaction);

            // ذخیره مجدد در LocalStorage
            localStorage.setItem('transactions', JSON.stringify(transactions));

            // پاک کردن فیلدهای فرم
            clientNameInput.value = '';
            amountInput.value = '';

            // به‌روزرسانی جدول و بازگشت به صفحه اصلی
            loadTransactions();
            switchPage('home-page');
        }

        // تابع بارگذاری و نمایش معاملات در جدول
        function loadTransactions() {
            const tableBody = document.getElementById('transaction-list-body');
            const transactions = JSON.parse(localStorage.getItem('transactions')) || [];

            tableBody.innerHTML = '';

            if (transactions.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-muted);">هیچ معامله‌ای ثبت نشده است.</td></tr>`;
                return;
            }

            transactions.forEach(tx => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${tx.name}</td>
                    <td><span style="font-weight: bold; color: #38bdf8;">${tx.currency}</span></td>
                    <td>${tx.amount}</td>
                    <td style="font-size: 11px; color: var(--text-muted);">${tx.date}</td>
                `;
                tableBody.appendChild(row);
            });
        }
    </script>
</body>
</html>
