<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Manager - صرافی ابری امن</title>
    
    <!-- تنظیمات PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7c3aed">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="صرافی ابری">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #7c3aed;
            --primary-dark: #6d28d9;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --credit-color: #10b981;
            --debit-color: #ef4444;
            --radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tahoma', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 900px;
            background: var(--card-bg);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 500px) {
            .app-container {
                border-radius: 24px;
                height: 90vh;
                border: 1px solid var(--border-color);
            }
        }

        .app-header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .app-header h1 {
            font-size: 17px;
            font-weight: 700;
            color: #a78bfa;
        }

        .app-content {
            flex: 1;
            overflow-y: auto;
            position: relative;
            padding: 20px;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 20px;
            background: var(--card-bg);
            display: none;
            flex-direction: column;
            overflow-y: auto;
            transition: all 0.3s ease;
        }

        .page.active {
            display: flex;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 14px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            color: var(--text-color);
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
        }

        button {
            cursor: pointer;
            border: none;
            padding: 14px 20px;
            border-radius: var(--radius);
            font-size: 15px;
            font-weight: 600;
            width: 100%;
            transition: 0.25s;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
            transform: translateY(-1px);
        }

        .custom-select-trigger {
            width: 100%;
            padding: 14px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            color: var(--text-color);
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #1e293b;
            width: 100%;
            max-width: 480px;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 24px;
            border-top: 1px solid var(--border-color);
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-option {
            padding: 14px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            margin-bottom: 10px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .modal-option:hover {
            background: var(--primary);
            border-color: var(--primary);
        }

        .account-card {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 14px;
        }

        .account-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .account-name {
            font-size: 16px;
            font-weight: bold;
            color: #f8fafc;
        }

        .account-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            text-align: center;
            margin-bottom: 12px;
        }

        .stat-box {
            background: #1e293b;
            padding: 10px 6px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .stat-label {
            font-size: 10px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 12px;
            font-weight: bold;
        }

        .transactions-list {
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
            margin-top: 8px;
            max-height: 150px;
            overflow-y: auto;
        }

        .tx-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            padding: 6px 8px;
            background: #1e293b;
            border-radius: 8px;
            margin-bottom: 6px;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .fab {
            position: absolute;
            bottom: 24px;
            left: 24px;
            width: 56px;
            height: 56px;
            background-color: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            box-shadow: 0 10px 20px rgba(124, 58, 237, 0.4);
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="app-header">
            <h1 id="header-title">صرافی ابری امن</h1>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span id="user-email-badge" style="font-size: 11px; color: var(--text-muted);"></span>
                <button onclick="logoutUser()" id="logout-btn" style="display:none; width:auto; padding:4px 8px; font-size:10px; background:#ef4444; color:white;">خروج</button>
            </div>
        </header>

        <main class="app-content">
            
            <div id="login-page" class="page">
                <div style="text-align: center; margin: 30px 0;">
                    <h2 style="font-size: 18px; color: #a78bfa; margin-bottom: 8px;">ورود یا ثبت‌نام در صرافی</h2>
                    <p style="font-size: 11px; color: var(--text-muted);">ایمیل و پسورد خود را وارد کنید.</p>
                </div>
                <div class="input-group">
                    <label>آدرس ایمیل</label>
                    <input type="email" id="auth-email" placeholder="example@gmail.com">
                </div>
                <div class="input-group">
                    <label>رمز عبور (Password)</label>
                    <input type="password" id="auth-password" placeholder="حداقل ۶ کاراکتر...">
                </div>
                
                <button class="btn-primary" onclick="handleSignIn()" style="margin-top: 5px;">ورود به حساب</button>
                <button onclick="handleSignUp()" style="background:transparent; border:1px solid var(--primary); color:#a78bfa; margin-top:10px;">ساخت حساب جدید (ارسال ایمیل تأیید)</button>
            </div>

            <div id="dashboard-page" class="page">
                <div id="accounts-list"></div>
                <div class="fab" onclick="showPage('add-client-page')">+</div>
            </div>

            <div id="add-client-page" class="page">
                <h2 style="font-size: 16px; margin-bottom: 16px;">افزودن مشتری جدید</h2>
                <div class="input-group">
                    <label>نام مشتری</label>
                    <input type="text" id="client-name" placeholder="نام شخص یا شرکت...">
                </div>
                <button class="btn-primary" onclick="saveClient()">ثبت مشتری در دیتابیس</button>
                <button onclick="showPage('dashboard-page')" style="background:transparent; color:var(--text-muted); margin-top:10px;">انصراف</button>
            </div>

            <div id="transaction-page" class="page">
                <h2 style="font-size: 16px; margin-bottom: 16px;">ثبت معامله</h2>
                <input type="hidden" id="active-client-id">

                <div class="input-group">
                    <label>نوع معامله</label>
                    <div class="custom-select-trigger" onclick="openModal('txtype-modal')">
                        <span id="selected-txtype-text">طلب / بستانکاری (Credit ↑)</span>
                        <span>▼</span>
                    </div>
                </div>

                <div class="input-group">
                    <label>واحد پول معامله</label>
                    <div class="custom-select-trigger" onclick="openModal('currency-modal')">
                        <span id="selected-currency-text">دلار آمریکا (USD)</span>
                        <span>▼</span>
                    </div>
                </div>

                <div class="input-group">
                    <label>مقدار مبلغ</label>
                    <input type="number" id="tx-amount" placeholder="مقدار را وارد کنید...">
                </div>

                <button class="btn-primary" onclick="saveTransaction()">ذخیره معامله</button>
                <button onclick="showPage('dashboard-page')" style="background:transparent; color:var(--text-muted); margin-top:10px;">بازگشت</button>
            </div>

        </main>

        <div id="currency-modal" class="modal-overlay" onclick="closeModal(event, 'currency-modal')">
            <div class="modal-content">
                <h3 style="font-size: 14px; margin-bottom: 14px; color: #a78bfa;">انتخاب واحد پول</h3>
                <div class="modal-option" onclick="selectCurrency('USD', 'دلار آمریکا (USD)')">دلار آمریکا (USD)</div>
                <div class="modal-option" onclick="selectCurrency('AFN', 'افغانی (AFN)')">افغانی (AFN)</div>
                <div class="modal-option" onclick="selectCurrency('IRT', 'تومان ایران (IRT)')">تومان ایران (IRT)</div>
                <div class="modal-option" onclick="selectCurrency('EUR', 'یورو (EUR)')">یورو (EUR)</div>
            </div>
        </div>

        <div id="txtype-modal" class="modal-overlay" onclick="closeModal(event, 'txtype-modal')">
            <div class="modal-content">
                <h3 style="font-size: 14px; margin-bottom: 14px; color: #a78bfa;">انتخاب نوع معامله</h3>
                <div class="modal-option" onclick="selectTxType('credit', 'طلب / بستانکاری (Credit ↑)')">طلب / بستانکاری (Credit ↑)</div>
                <div class="modal-option" onclick="selectTxType('debit', 'بدهی (Debit ↓)')">بدهی (Debit ↓)</div>
            </div>
        </div>
    </div>

    <script>
        // ثبت Service Worker برای قابلیت PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registered!', reg))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }

        const SUPABASE_URL = 'https://hvsymjkbmpmvjycwenbd.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_9pkhkb88LNXJw457Sx8dpA_0E231JwH';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let selectedCurrencyVal = 'USD';
        let selectedTxTypeVal = 'credit';
        let currentUserEmail = '';
        let appData = { clients: [] };

        document.addEventListener('DOMContentLoaded', async () => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session && session.user) {
                currentUserEmail = session.user.email;
                document.getElementById('user-email-badge').innerText = currentUserEmail;
                document.getElementById('logout-btn').style.display = 'block';
                await loadDataFromSupabase();
                showPage('dashboard-page');
            } else {
                showPage('login-page');
            }
        });

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        function openModal(modalId) {
            document.getElementById(modalId).classList.add('active');
        }

        function closeModal(e, modalId) {
            if (e.target.classList.contains('modal-overlay')) {
                document.getElementById(modalId).classList.remove('active');
            }
        }

        function selectCurrency(code, label) {
            selectedCurrencyVal = code;
            document.getElementById('selected-currency-text').innerText = label;
            document.getElementById('currency-modal').classList.remove('active');
        }

        function selectTxType(type, label) {
            selectedTxTypeVal = type;
            document.getElementById('selected-txtype-text').innerText = label;
            document.getElementById('txtype-modal').classList.remove('active');
        }

        async function handleSignUp() {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            if (!email || password.length < 6) {
                alert('لطفاً ایمیل معتبر و پسورد حداقل ۶ کاراکتری وارد کنید.');
                return;
            }

            const { data, error } = await supabaseClient.auth.signUp({ email, password });
            if (error) {
                alert('خطا در ثبت‌نام: ' + error.message);
            } else {
                alert('ثبت‌نام انجام شد! لطفاً ایمیل خود را چک کنید و روی لینک تأیید کلیک کنید تا حساب شما فعال شود.');
            }
        }

        async function handleSignIn() {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            if (!email || !password) {
                alert('لطفاً ایمیل و پسورد را وارد کنید.');
                return;
            }

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                alert('خطا در ورود: اطلاعات نادرست است یا ایمیل تایید نشده.\n' + error.message);
            } else {
                currentUserEmail = data.user.email;
                document.getElementById('user-email-badge').innerText = currentUserEmail;
                document.getElementById('logout-btn').style.display = 'block';
                await loadDataFromSupabase();
                showPage('dashboard-page');
            }
        }

        async function logoutUser() {
            await supabaseClient.auth.signOut();
            currentUserEmail = '';
            document.getElementById('logout-btn').style.display = 'none';
            document.getElementById('user-email-badge').innerText = '';
            showPage('login-page');
        }

        async function loadDataFromSupabase() {
            try {
                const { data, error } = await supabaseClient
                    .from('exchange_users')
                    .select('*')
                    .eq('email', currentUserEmail)
                    .maybeSingle();

                if (data && data.content) {
                    appData = data.content;
                } else {
                    appData = { clients: [] };
                    await saveDatatoSupabase();
                }
            } catch (err) {
                console.error('خطا در خواندن داده‌ها:', err);
                appData = { clients: [] };
            }
            renderDashboard();
        }

        async function saveDatatoSupabase() {
            try {
                await supabaseClient
                    .from('exchange_users')
                    .upsert({ email: currentUserEmail, content: appData }, { onConflict: 'email' });
            } catch (err) {
                console.error('خطا در ذخیره ابری:', err);
            }
        }

        async function saveClient() {
            const name = document.getElementById('client-name').value.trim();
            if (!name) {
                alert('نام مشتری را وارد کنید.');
                return;
            }

            appData.clients.push({
                id: Date.now(),
                name: name,
                transactions: []
            });

            await saveDatatoSupabase();
            document.getElementById('client-name').value = '';
            renderDashboard();
            showPage('dashboard-page');
        }

        function openTransactionPage(clientId) {
            document.getElementById('active-client-id').value = clientId;
            showPage('transaction-page');
        }

        async function saveTransaction() {
            const clientId = Number(document.getElementById('active-client-id').value);
            const amount = Number(document.getElementById('tx-amount').value);

            if (!amount || amount <= 0) {
                alert('لطفاً مبلغ معتبری وارد کنید.');
                return;
            }

            let rate = 1;
            if (selectedCurrencyVal === 'USD') rate = 70;
            if (selectedCurrencyVal === 'IRT') rate = 0.0015;
            if (selectedCurrencyVal === 'EUR') rate = 75;

            const amountInBase = amount * rate;

            const client = appData.clients.find(c => c.id === clientId);
            client.transactions.push({
                type: selectedTxTypeVal,
                currency: selectedCurrencyVal,
                rawAmount: amount,
                amountInBase: amountInBase,
                date: new Date().toLocaleDateString('fa-IR')
            });

            await saveDatatoSupabase();
            document.getElementById('tx-amount').value = '';
            renderDashboard();
            showPage('dashboard-page');
        }

        function renderDashboard() {
            const container = document.getElementById('accounts-list');
            container.innerHTML = '';

            if (!appData.clients || appData.clients.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:var(--text-muted); margin-top:50px;">هیچ حسابی ثبت نشده است.<br>روی دکمه + بزنید.</div>`;
                return;
            }

            appData.clients.forEach(client => {
                let totalCredit = 0;
                let totalDebit = 0;

                let txHtml = '';
                if (client.transactions && client.transactions.length > 0) {
                    txHtml = `<div class="transactions-list">`;
                    client.transactions.forEach(tx => {
                        if (tx.type === 'credit') totalCredit += tx.amountInBase;
                        if (tx.type === 'debit') totalDebit += tx.amountInBase;

                        const typeText = tx.type === 'credit' ? 'طلب (↑)' : 'بدهی (↓)';
                        const typeColor = tx.type === 'credit' ? 'var(--credit-color)' : 'var(--debit-color)';
                        
                        txHtml += `
                            <div class="tx-item">
                                <span style="color:${typeColor}; font-weight:bold;">${typeText}</span>
                                <span>${tx.rawAmount.toLocaleString()} ${tx.currency}</span>
                                <span style="color:var(--text-muted); font-size:10px;">(معادل: ${tx.amountInBase.toLocaleString()} افغانی)</span>
                            </div>
                        `;
                    });
                    txHtml += `</div>`;
                }

                let balance = totalCredit - totalDebit;

                const card = document.createElement('div');
                card.className = 'account-card';
                card.innerHTML = `
                    <div class="account-header">
                        <span class="account-name">${client.name}</span>
                        <button onclick="openTransactionPage(${client.id})" style="width:auto; padding:6px 12px; font-size:11px;" class="btn-primary">+ معامله</button>
                    </div>
                    <div class="account-stats">
                        <div class="stat-box">
                            <div class="stat-label">Credit (↑)</div>
                            <div class="stat-value" style="color:var(--credit-color);">${totalCredit.toLocaleString()}</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Debit (↓)</div>
                            <div class="stat-value" style="color:var(--debit-color);">${totalDebit.toLocaleString()}</div>
                        </div>
                        <div class="stat-box" style="background:#1e293b; border-color:var(--primary);">
                            <div class="stat-label">Balance</div>
                            <div class="stat-value" style="color:#a78bfa;">${balance.toLocaleString()}</div>
                        </div>
                    </div>
                    ${txHtml}
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
