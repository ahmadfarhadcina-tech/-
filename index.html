<!DOCTYPE html>
<html lang="en" dir="ltr" id="html-root">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Daily Accounting - Home</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c3aed">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{--primary:#7c3aed;--primary-dark:#6d28d9;--bg:#0f172a;--card:#1e293b;--text:#f8fafc;--muted:#94a3b8;--border:#334155;--green:#10b981;--red:#ef4444;--blue:#3b82f6;--radius:16px;}
*{box-sizing:border-box;margin:0;padding:0;font-family:Tahoma,sans-serif;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;min-height:100%;}
body{background:var(--bg);color:var(--text);min-height:100vh;}
.app{width:100%;min-height:100vh;background:var(--card);display:flex;flex-direction:column;}
header{background:linear-gradient(135deg,#1e293b,#0f172a);padding:10px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:20;}
header h1{font-size:15px;color:var(--primary);}
.header-controls{display:flex;align-items:center;gap:8px;}
.profile-badge{display:none;align-items:center;gap:8px;background:#0f172a;border:1px solid var(--border);padding:4px 10px;border-radius:30px;cursor:pointer;}
.avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;}
.rates{background:#0f172a;padding:8px 16px;font-size:11px;color:#38bdf8;border-bottom:1px solid var(--border);display:flex;justify-content:space-around;gap:15px;overflow:auto;white-space:nowrap;}
.location-status{background:#111827;color:var(--muted);font-size:10px;padding:6px 14px;text-align:center;border-bottom:1px solid var(--border);}
main{position:relative;flex:1;overflow:hidden;}
.page{position:absolute;inset:0;padding:20px;background:var(--card);overflow-y:auto;opacity:0;pointer-events:none;transform:translateY(15px);transition:.3s;}
.page.active{opacity:1;pointer-events:auto;transform:none;z-index:5;}
.box{max-width:450px;margin:20px auto;width:100%;}
h2{font-size:18px;color:var(--primary);margin-bottom:20px;}
.group{margin-bottom:18px;}
.group label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px;}
input{width:100%;padding:14px 16px;background:#0f172a;border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:14px;outline:none;}
input:focus{border-color:var(--primary);box-shadow:0 0 0 3px #7c3aed40;}
button{cursor:pointer;border:0;padding:14px 20px;border-radius:var(--radius);font-size:15px;font-weight:600;width:100%;}
.primary{background:var(--primary);color:white;box-shadow:0 4px 15px #7c3aed66;}
.secondary{background:transparent;color:var(--muted);margin-top:12px;}
[dir=rtl] input{text-align:right;}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:12px;display:none;z-index:3000;font-size:13px;max-width:90%;text-align:center;}
</style>
</head>

<body>
<script src="sarafi-api.js"></script>
 
<div class="app">
<header>
<h1 id="header-title">Daily Accounting</h1>
<div class="header-controls">
<div id="profile-badge" class="profile-badge" onclick="window.location.href='profile.html'">
<div id="header-avatar"><div class="avatar">U</div></div>
<span id="header-name">User</span>
</div>
<button id="logout-btn" onclick="logoutUser()" style="display:none;width:auto;padding:6px 9px;font-size:10px;background:#ef4444;color:#fff">Logout</button>
</div>
</header>

<div class="rates" id="rates"><span>🔄 Loading rates...</span></div>
<div class="location-status" id="location-status">📍 Location: Detecting...</div>

<main>
<section id="login-page" class="page active">
<div class="box">
<div style="text-align:center;margin:40px 0 30px">
<h2 id="login-title">Sign In or Register</h2>
<p id="login-description" style="font-size:12px;color:var(--muted)">Log in to access your cloud accounts.</p>
</div>
<div class="group">
<label id="email-label">Email Address</label>
<input type="email" id="auth-email" placeholder="example@gmail.com">
</div>
<div class="group">
<label id="password-label">Password</label>
<input type="password" id="auth-password" placeholder="At least 6 characters">
</div>
<button id="signin-btn" class="primary" onclick="handleSignIn()">Sign In</button>
<button id="signup-btn" onclick="handleSignUp()" style="background:transparent;border:1px solid var(--primary);color:var(--primary);margin-top:12px">Create New Account</button>

<!-- OTP -->
<div id="otp-section" style="display:none;margin-top:20px">
<div style="text-align:center;margin:25px 0 20px">
<h3 id="otp-title" style="font-size:17px;color:var(--primary);margin-bottom:8px">Verify Your Email</h3>
<p id="otp-description" style="font-size:12px;color:var(--muted);line-height:1.8">Enter the 6-digit code sent to your email.</p>
<p id="otp-email-display" style="font-size:12px;color:#38bdf8;margin-top:8px"></p>
</div>
<div class="group">
<label id="otp-label">Verification Code</label>
<input type="text" id="otp-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Enter 6-digit code">
</div>
<button id="verify-otp-btn" class="primary" onclick="verifySignupCode()">Verify Code</button>
<button id="resend-otp-btn" class="secondary" onclick="resendSignupCode()">Resend Code</button>
<button id="back-signup-btn" class="secondary" onclick="backToSignup()">Back</button>
</div>
</div>
</section>
</main>
</div>

<div id="toast"></div>

<script>
const SUPABASE_URL = 'https://hvsymjkbmpmvjycwenbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_9pkhkb88LNXJw457Sx8dpA_0E231JwH';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let appData = { clients: [] };
let userProfile = { name: '', phone: '', location: 'Jawzjan', avatar: '', themeColor: '#7c3aed', language: 'en' };
let rates = { AFN: 1 };
let pendingSignup = null;

function toast(msg){
 const e=document.getElementById('toast');
 e.innerText=msg; e.style.display='block';
 clearTimeout(window.__toast);
 window.__toast=setTimeout(()=>{e.style.display='none';},3500);
}

function escapeHtml(s){
 return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

async function handleSignIn(){
 const email=document.getElementById('auth-email').value.trim();
 const password=document.getElementById('auth-password').value;
 const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
 if(error) return toast('Sign in error: ' + error.message);
 currentUser=data.user;
 window.location.href='transactions.html';
}

async function handleSignUp(){
 const email=document.getElementById('auth-email').value.trim();
 const password=document.getElementById('auth-password').value;
 if(!email || password.length<6) return toast('Enter valid email and password.');
 const {data,error}=await supabaseClient.functions.invoke('smooth-responder',{body:{email,password}});
 if(error) return toast('Signup error');
 pendingSignup={email,password};
 document.getElementById('email-label').parentElement.style.display='none';
 document.getElementById('password-label').parentElement.style.display='none';
 document.getElementById('signin-btn').style.display='none';
 document.getElementById('signup-btn').style.display='none';
 document.getElementById('otp-section').style.display='block';
 toast('OTP sent to email');
}

async function verifySignupCode(){
 const code=document.getElementById('otp-code').value.trim();
 if(!code) return toast('Enter verification code.');
 const response=await fetch(`${SUPABASE_URL}/functions/v1/dynamic-processor`,{
  method:'POST',
  headers:{'Content-Type':'application/json','apikey':SUPABASE_URL,'Authorization':`Bearer ${SUPABASE_KEY}`},
  body:JSON.stringify({email:pendingSignup.email,code})
 });
 const data=await response.json();
 if(!data?.success) return toast('Invalid verification code.');
 const {data:loginData}=await supabaseClient.auth.signInWithPassword({email:pendingSignup.email,password:pendingSignup.password});
 currentUser=loginData.user;
 window.location.href='transactions.html';
}

async function logoutUser(){
 await supabaseClient.auth.signOut();
 window.location.reload();
}

window.addEventListener('DOMContentLoaded', async()=>{
 const {data}=await supabaseClient.auth.getSession();
 if(data.session?.user){
  window.location.href='transactions.html';
 }
});
</script>
</body>
</html>
